<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBest Vendor Offer — Staging QA</title>
<style>body{font:16px system-ui;background:#f5f7fb;color:#18283d;margin:0}.wrap{max-width:520px;margin:auto;padding:20px}h1{font-size:24px}label{display:block;font-weight:600;margin:16px 0 6px}input,select,button{box-sizing:border-box;width:100%;padding:13px;border:1px solid #bac7d5;border-radius:10px;font:inherit}button{background:#123d78;color:white;border:0;margin-top:18px;font-weight:700}button:disabled{opacity:.55}.note{padding:12px;background:#fff3d7;border-radius:9px}.result{white-space:pre-wrap;background:white;padding:15px;border-radius:10px;margin-top:15px;overflow-wrap:anywhere}.muted{color:#516174;font-size:14px}</style></head><body><main class="wrap"><h1>DBest Vendor Price Editor</h1><p class="note"><strong>Isolated staging QA.</strong> No publication control is offered here. Use only a staging API and a staging vendor session. Never enter production credentials.</p>
<form id="f"><label for="api">Staging API endpoint</label><input id="api" type="url" required placeholder="https://staging.example.com/api/marketplace/vendor-offer-edit"><label for="token">Staging vendor session token</label><input id="token" type="password" required autocomplete="off"><p class="muted">Token stays in this page's memory and is never saved to browser storage.</p><label for="offer">Offer ID (UUID)</label><input id="offer" required pattern="[0-9a-fA-F-]{36}" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"><label for="mode">Price input method</label><select id="mode"><option value="price_inclusive_gst">Selling price (₹)</option><option value="discount_percent">Discount (%)</option></select><label for="value">Selling price or discount</label><input id="value" type="number" min="0" step="0.01" required><button id="save" type="submit">Save vendor offer to staging</button></form><div id="result" class="result" role="status" aria-live="polite">No request sent.</div></main>
<script>
const f=document.getElementById('f'),out=document.getElementById('result'),btn=document.getElementById('save');
f.addEventListener('submit',async e=>{e.preventDefault();const endpoint=document.getElementById('api').value.trim(),token=document.getElementById('token').value,offerId=document.getElementById('offer').value.trim(),mode=document.getElementById('mode').value,value=Number(document.getElementById('value').value);
if(!/^https:\/\//i.test(endpoint)||!Number.isFinite(value)||value<=0){out.textContent='Enter a secure HTTPS endpoint and positive value.';return;}
if(!confirm('Save this vendor price to the STAGING database?'))return;
btn.disabled=true;out.textContent='Submitting authenticated staging PATCH…';
try{const response=await fetch(endpoint,{method:'PATCH',headers:{'Content-Type':'application/json','x-dbest-vendor-token':token},body:JSON.stringify({offerId,patch:{[mode]:value}}),cache:'no-store'});const data=await response.json();out.textContent=JSON.stringify({httpStatus:response.status,ok:data.ok,error:data.error||null,offer:data.ok?{id:data.offer?.id,price_inclusive_gst:data.offer?.price_inclusive_gst,stock:data.offer?.stock,active:data.offer?.active}:undefined},null,2);}
catch(err){out.textContent='Request failed: '+err.message+' (check staging API deployment and CORS)';}finally{btn.disabled=false;}
});
</script></body></html>
