<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBest Preview Member Login</title><style>body{margin:0;background:#f5f7fb;font-family:Inter,system-ui,Arial;color:#13213a}.wrap{min-height:100dvh;display:grid;place-items:center;padding:18px}.card{width:min(430px,100%);background:#fff;border:1px solid #e2e8f2;border-radius:20px;padding:22px;box-shadow:0 20px 55px #1637651f}h2{margin:0 0 8px}p{color:#687386;line-height:1.5}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #dfe6f0;border-radius:12px;font-size:16px;margin-top:10px}button{width:100%;margin-top:12px;border:0;border-radius:12px;padding:12px;background:#175cff;color:#fff;font-weight:800}.soft{background:#edf3ff;color:#175cff}.msg{margin-top:10px;font-size:13px;color:#687386;line-height:1.45}.ok{color:#15803d}.err{color:#b91c1c}</style></head><body><div class="wrap"><div class="card"><h2>DBest Member Login</h2><p>Preview secure login for Razorpay testing. Use your existing Member ID, registered email, or mobile.</p><div id="step1"><input id="login" placeholder="Member ID / Email / Mobile" autocomplete="username"><button id="send">Send Login OTP</button></div><div id="step2" style="display:none"><p id="sent"></p><input id="otp" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit OTP" autocomplete="one-time-code"><button id="verify">Verify & Continue</button><button class="soft" id="back">Back</button></div><div id="msg" class="msg"></div></div></div><script src="/runtime-config.js"></script><script>const BUILD='20260910-master-market-razorpay-v15';const TOKEN_KEY='dbest_member_live_token';const $=id=>document.getElementById(id);const msg=(t,c='')=>{$('msg').className='msg '+c;$('msg').textContent=t};async function call(body){const cfg=window.DBEST_RUNTIME_CONFIG||{};const r=await fetch(String(cfg.supabaseUrl||'')+'/functions/v1/member-login-live',{method:'POST',headers:{apikey:String(cfg.supabasePublishableKey||''),'Authorization':'Bearer '+String(cfg.supabasePublishableKey||''),'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||'Login failed');e.status=r.status;throw e}return j}let login='';$('send').onclick=async()=>{login=$('login').value.trim();if(!login)return msg('Enter Member ID, email or mobile.','err');$('send').disabled=true;msg('Sending OTP…');try{const d=await call({action:'request',login});$('step1').style.display='none';$('step2').style.display='block';$('sent').textContent='OTP sent to '+(d.maskedEmail||'your registered email');msg('OTP sent.');setTimeout(()=>$('otp').focus(),50)}catch(e){msg(e.message==='member_not_found'?'Active member not found.':e.message==='otp_rate_limited'?'Please wait about a minute and retry.':'Could not send OTP.','err')}finally{$('send').disabled=false}};$('verify').onclick=async()=>{const code=$('otp').value.replace(/\D/g,'');if(!/^\d{6}$/.test(code))return msg('Enter the 6-digit OTP.','err');$('verify').disabled=true;msg('Verifying…');try{const d=await call({action:'verify',login,code});if(!d.token||!d.member?.id)throw Error('Secure session was not created.');localStorage.setItem(TOKEN_KEY,String(d.token));let users=[];try{users=JSON.parse(localStorage.getItem('d2_users')||'[]')}catch{};users=Array.isArray(users)?users:[];users=users.filter(x=>String(x.id)!==String(d.member.id));users.push(d.member);localStorage.setItem('d2_users',JSON.stringify(users));localStorage.setItem('d2_session',JSON.stringify({role:d.member.tier,id:d.member.id}));msg('Secure login successful. Opening DBest Preview…','ok');setTimeout(()=>location.href='/?v='+encodeURIComponent(BUILD),500)}catch(e){msg(e.status===401?'Invalid or expired OTP.':String(e.message||'Login failed'),'err')}finally{$('verify').disabled=false}};$('back').onclick=()=>{$('step2').style.display='none';$('step1').style.display='block';msg('')};</script></body></html>
