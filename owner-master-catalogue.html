<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBest Master Catalogue Control</title><style>body{margin:0;background:#f4f7fb;color:#183251;font:14px system-ui}header{background:#173f7e;color:white;padding:16px}main{padding:14px;max-width:1120px;margin:auto}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}input,select,button{padding:10px;border:1px solid #c9d5e4;border-radius:8px;font:inherit}button{background:#173f7e;color:white;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}.card{background:white;padding:12px;border-radius:10px;border:1px solid #dde5ee}.card img{width:100%;height:160px;object-fit:contain}.card label{display:block;font-size:12px;color:#57677b;margin-top:7px}.card input{width:100%;box-sizing:border-box}.card button{width:100%;margin-top:10px}.muted{color:#62728b}.card .check{display:flex;gap:8px;align-items:center}.card .check input{width:auto}</style><script src="/dbest-image-prep-1mb.js"></script></head><body><header><h2>🛍️ Master Catalogue Control Centre</h2>Owner Console · Product management</header><main><p>Search and edit master products. Vendor-specific offers remain separate; customer checkout is not activated by these edits.</p><div class="bar"><input id="q" placeholder="Search product or SKU"><select id="cat"><option value="">All categories</option><option>Grocery & FMCG</option><option>Electronics</option><option>Restaurant</option><option>Medicines (OTC)</option></select><button id="search">Search</button><button id="images">Manage product images</button></div><p id="status" class="muted">Checking Owner Console session…</p><div class="grid" id="grid"></div><div class="bar"><button id="prev">Previous</button><button id="next">Next</button></div></main><script>
const $=id=>document.getElementById(id),api='https://ydedmotbacnllkijzmvp.supabase.co/functions/v1/dbest-owner-master-catalogue';let page=0,total=0;const token=()=>{try{return sessionStorage.getItem('dbest_owner_session_token')||''}catch(e){return''}};function field(card,label,value,type='text'){const l=document.createElement('label');l.textContent=label;const i=document.createElement('input');i.type=type;i.value=value??'';l.append(i);card.append(l);return i}async function load(){if(!token()){$('status').textContent='Log in to DBest Owner Console first, then reopen Catalogue Management.';return}$('status').textContent='Loading…';const url=api+'?page='+page+'&q='+encodeURIComponent($('q').value.trim())+'&category='+encodeURIComponent($('cat').value);try{const r=await fetch(url,{headers:{authorization:'Bearer '+token()}});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Request failed');total=d.total;$('grid').replaceChildren();for(const x of d.items){const card=document.createElement('div');card.className='card';const img=document.createElement('img');img.src=x.image_src||'';img.alt=x.product_title;const code=document.createElement('p');code.className='muted';code.textContent=x.sku;const title=field(card,'Product name',x.product_title),brand=field(card,'Brand',x.brand),category=field(card,'Category',x.category),subcategory=field(card,'Subcategory',x.subcategory),pack=field(card,'Variant / Pack',x.variant_pack),mrp=field(card,'Reference MRP ₹',x.mrp_inr,'number'),suggested=field(card,'Suggested price ₹',x.suggested_price_inr,'number'),stock=field(card,'Suggested stock',x.stock_suggestion,'number');const vis=document.createElement('label');vis.className='check';const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!x.public_catalogue_visible;vis.append(cb,document.createTextNode('Visible in public catalogue'));const photo=document.createElement('input');photo.type='file';photo.accept='image/*';photo.setAttribute('capture','environment');const upload=document.createElement('button');upload.textContent='📷 Take / Upload Product Photo';const uploadMsg=document.createElement('p');uploadMsg.className='muted';upload.onclick=async()=>{if(!photo.files?.[0]){uploadMsg.textContent='Choose or take a photo first';return}upload.disabled=true;uploadMsg.textContent='Compressing and uploading…';try{const prepared=await DBestImagePrep(photo.files[0]);const f=new FormData();f.append('sku',x.sku);f.append('file',prepared);const response=await fetch('https://ydedmotbacnllkijzmvp.supabase.co/functions/v1/dbest-catalogue-image-workflow',{method:'POST',headers:{authorization:'Bearer '+token()},body:f});const data=await response.json();if(!response.ok||!data.ok)throw Error(data.error||'Upload failed');uploadMsg.textContent='Image uploaded for publishing review'}catch(e){uploadMsg.textContent='Error: '+e.message}finally{upload.disabled=false}};const save=document.createElement('button');save.textContent='Save Master Product';const msg=document.createElement('p');msg.className='muted';save.onclick=async()=>{save.disabled=true;msg.textContent='Saving…';const changes={product_title:title.value,brand:brand.value,category:category.value,subcategory:subcategory.value,variant_pack:pack.value,mrp_inr:mrp.value===''?null:Number(mrp.value),suggested_price_inr:suggested.value===''?null:Number(suggested.value),stock_suggestion:Number(stock.value),public_catalogue_visible:cb.checked};try{const r=await fetch(api,{method:'POST',headers:{authorization:'Bearer '+token(),'content-type':'application/json'},body:JSON.stringify({sku:x.sku,changes})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Save failed');msg.textContent='Saved to master catalogue'}catch(e){msg.textContent='Error: '+e.message}finally{save.disabled=false}};card.prepend(img,code);card.append(vis,save,msg,photo,upload,uploadMsg);$('grid').append(card)}$('status').textContent='Showing '+(page*40+1)+'–'+(page*40+d.items.length)+' of '+total+' products';$('prev').disabled=page===0;$('next').disabled=(page+1)*40>=total}catch(e){$('status').textContent='Error: '+e.message}}$('search').onclick=()=>{page=0;load()};$('prev').onclick=()=>{page=Math.max(0,page-1);load()};$('next').onclick=()=>{page++;load()};$('images').onclick=()=>location.href='/owner-catalogue-images.html';load();
</script></body></html>
