<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBest Vendor Product Offers</title><style>body{font:15px system-ui;background:#f5f7fb;color:#1b304a;margin:0}header{background:#173f7e;color:white;padding:17px}main{max-width:950px;margin:auto;padding:16px}.notice{background:#fff1d2;padding:12px;border-radius:8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}input,button{font:inherit;padding:10px;border:1px solid #c5d1df;border-radius:7px}button{background:#173f7e;color:white;border:0}#token{flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.card{background:white;border:1px solid #dce4ef;border-radius:10px;padding:10px}.card img{width:100%;aspect-ratio:1;object-fit:contain}.card input{width:100%;margin:5px 0}.small{color:#65758b;font-size:12px}.card button{width:100%}</style></head><body><header><h2>DBest Vendor Catalogue</h2>Set your own prices and stock</header><main><p class="notice">Vendor login required. Prices and stock save as drafts. Product images are labelled placeholders. Customer checkout remains disabled until approval.</p><div class="toolbar"><input id="token" type="password" autocomplete="off" placeholder="Existing vendor session token"><button id="load">Load products</button></div><p id="status">Enter your authorized vendor session token.</p><div id="grid" class="grid"></div><button id="more" hidden>Load more</button></main><script>
const $=id=>document.getElementById(id),endpoint='https://ydedmotbacnllkijzmvp.supabase.co/functions/v1/dbest-vendor-catalogue-offers';let page=0,total=0;
async function load(reset){const token=$('token').value.trim();if(!token){$('status').textContent='Vendor session required';return}if(reset){page=0;$('grid').replaceChildren()}$('status').textContent='Loading…';try{const r=await fetch(endpoint+'?page='+page,{headers:{authorization:'Bearer '+token}});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Access denied');total=d.total;for(const x of d.items){const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.src=x.image_src;img.loading='lazy';img.alt=x.product_title;const title=document.createElement('b');title.textContent=x.product_title;const meta=document.createElement('p');meta.className='small';meta.textContent=x.sku+' · '+x.category;const price=document.createElement('input');price.type='number';price.min='0.01';price.step='0.01';price.placeholder='Your selling price ₹';price.value=x.offer?.price_inclusive_gst??'';const mrp=document.createElement('input');mrp.type='number';mrp.min='0';mrp.step='0.01';mrp.placeholder='MRP ₹ (optional)';mrp.value=x.offer?.mrp??x.mrp_inr??'';const stock=document.createElement('input');stock.type='number';stock.min='0';stock.step='1';stock.placeholder='Available stock';stock.value=x.offer?.stock??'';const save=document.createElement('button');save.textContent='Save price & stock';const result=document.createElement('p');result.className='small';save.onclick=async()=>{save.disabled=true;result.textContent='Saving…';try{const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+$('token').value.trim()},body:JSON.stringify({sku:x.sku,price:Number(price.value),mrp:mrp.value===''?null:Number(mrp.value),stock:Number(stock.value)})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Save failed');result.textContent='Draft saved successfully'}catch(e){result.textContent='Error: '+e.message}finally{save.disabled=false}};const photo=document.createElement('input');photo.type='file';photo.accept='image/jpeg,image/png,image/webp';const upload=document.createElement('button');upload.textContent='Upload product photo for owner review';const uploadStatus=document.createElement('p');uploadStatus.className='small';upload.onclick=async()=>{if(!photo.files?.[0]){uploadStatus.textContent='Choose an image first';return}upload.disabled=true;uploadStatus.textContent='Uploading…';try{const f=new FormData();f.append('sku',x.sku);f.append('file',photo.files[0]);const r=await fetch('https://ydedmotbacnllkijzmvp.supabase.co/functions/v1/dbest-catalogue-image-workflow',{method:'POST',headers:{authorization:'Bearer '+$('token').value.trim()},body:f});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Upload failed');uploadStatus.textContent='Uploaded. Awaiting owner approval.'}catch(e){uploadStatus.textContent='Error: '+e.message}finally{upload.disabled=false}};card.append(img,title,meta,price,mrp,stock,save,result,photo,upload,uploadStatus);$('grid').append(card)}page++;const n=$('grid').children.length;$('status').textContent=n+' of '+total+' products loaded';$('more').hidden=n>=total}catch(e){$('status').textContent='Error: '+e.message;$('more').hidden=true}}$('load').onclick=()=>load(true);$('more').onclick=()=>load(false);
</script></body></html>
