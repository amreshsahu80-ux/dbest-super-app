<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBest Owner Control Deployment</title><script src="/runtime-config.js"></script><style>body{font-family:system-ui,Arial;background:#f5f7fb;color:#172744;margin:0}.wrap{max-width:720px;margin:auto;padding:20px}.card{background:white;border:1px solid #dce4f1;border-radius:16px;padding:20px;margin:12px 0}label{display:block;margin:12px 0;font-weight:650}input,select,textarea{box-sizing:border-box;width:100%;padding:11px;margin-top:5px;border:1px solid #c6d2e3;border-radius:9px;font:inherit}button,.btn{border:0;background:#175cff;color:white;padding:12px 16px;border-radius:10px;font-weight:700;cursor:pointer}.btn{display:inline-block;text-decoration:none}.note{font-size:13px;color:#4b5870}.error{color:#a11}.ok{color:#14652d}.hide{display:none}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main class="wrap"><a href="/owner-live-onboarding.html">← Owner Console</a><h1>Owner Control Deployment</h1><p class="note">Owner-authorized account creation. Standard applicant KYC/payment/referral steps are bypassed, but operational verification and agreement controls remain in force.</p><section class="card" id="auth"><h2>Verify Owner</h2><label>Owner email<input id="email" type="email" autocomplete="email"></label><label>OTP<input id="otp" inputmode="numeric" autocomplete="one-time-code"></label><button id="send" type="button">Send OTP</button> <button id="verify" type="button">Verify</button></section><section class="card hide" id="panel"><h2>Direct onboarding</h2><form id="deploy"><label>Category<select name="kind" id="kind"><option value="member">Member</option><option value="vendor">Vendor</option><option value="vaahak">Vaahak</option><option value="service_partner">Service Partner</option></select></label><label>Full name<input name="name" required minlength="2"></label><label>Email<input name="email" type="email" required></label><label>Mobile (10 digits)<input name="mobile" required pattern="[0-9]{10}" inputmode="numeric"></label><label>City<input name="city"></label><label>Address<input name="address"></label><label>Pincode<input name="pincode"></label><div id="extra"></div><label><input id="confirm" type="checkbox" required style="width:auto"> I authorize this specific Owner-assisted account creation and understand normal prerequisites are bypassed.</label><button id="submit" type="submit">Create / Update Account</button></form><pre id="result" aria-live="polite"></pre></section><p id="status" role="status"></p></main><script>(function(){'use strict';const cfg=window.DBEST_RUNTIME_CONFIG||{},base=String(cfg.supabaseUrl||'').replace(/\/$/,''),key=String(cfg.supabasePublishableKey||''),tokenKey='dbest_owner_live_token_v1',el=id=>document.getElementById(id);let token=localStorage.getItem(tokenKey)||'';const status=(m,ok=false)=>{el('status').textContent=m;el('status').className=ok?'ok':'error'};async function call(slug,body,owner=false){if(!base||!key)throw Error('Platform configuration missing');const h={apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json'};if(owner)h['x-dbest-owner-token']=token;const res=await fetch(base+'/functions/v1/'+slug,{method:'POST',cache:'no-store',headers:h,body:JSON.stringify(body)}),data=await res.json().catch(()=>({}));if(!res.ok||data.error)throw Error(data.error||'Request failed');return data}const show=()=>{el('auth').classList.toggle('hide',!!token);el('panel').classList.toggle('hide',!token)};el('send').onclick=async()=>{try{await call('send-owner-otp',{email:el('email').value.trim().toLowerCase()});status('OTP sent.',true)}catch(e){status(e.message)}};el('verify').onclick=async()=>{try{const d=await call('verify-owner-otp',{email:el('email').value.trim().toLowerCase(),code:el('otp').value.trim()});if(!d.ownerToken)throw Error('Owner session missing');token=d.ownerToken;localStorage.setItem(tokenKey,token);show();status('Owner verified.',true)}catch(e){status(e.message)}};const fields={member:'<label>Membership tier<select name="tier"><option value="guest">Guest</option><option value="promoter">Promoter</option><option value="prime">Prime</option><option value="leader">Leader</option></select></label>',vendor:'<label>Vendor type<input name="vendorType" value="grocery"></label><label>Owner name<input name="ownerName"></label>',vaahak:'<label>Vehicle type<input name="vehicle" value="Bike"></label><label>Vehicle number<input name="vehicleNo"></label>',service_partner:'<label>Service types (comma separated)<input name="serviceTypes" value="general"></label><label>Service area<input name="serviceArea"></label>'};const update=()=>el('extra').innerHTML=fields[el('kind').value]||'';el('kind').onchange=update;update();el('deploy').onsubmit=async e=>{e.preventDefault();const btn=el('submit');if(!el('confirm').checked)return;const fd=new FormData(e.target),b=Object.fromEntries(fd.entries());delete b.confirm;if(b.kind==='service_partner')b.serviceTypes=String(b.serviceTypes||'').split(',').map(s=>s.trim()).filter(Boolean);if(!window.confirm('Confirm Owner Control Deployment for '+b.name+' ('+b.kind+'). Existing matching accounts may be updated, and Vendor/Vaahak PINs may be reset. Continue?'))return;btn.disabled=true;el('result').textContent='';try{const d=await call('owner-control-deployment',b,true);el('result').textContent=JSON.stringify({kind:d.kind,record:d.record,temporaryPin:d.temporaryPin||null},null,2);status('Owner Control Deployment completed. Securely share any temporary PIN with the intended recipient.',true);el('confirm').checked=false}catch(err){if(/owner_session/.test(err.message)){token='';localStorage.removeItem(tokenKey);show()}status(err.message)}finally{btn.disabled=false}};show()})();</script></body></html>
