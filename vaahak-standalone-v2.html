*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial;background:#f5f7fb;color:#13233c}.shell{max-width:700px;margin:auto;padding:14px}.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid #e8edf5}.topIn{max-width:700px;margin:auto;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:18px;font-weight:950}.statusPill{padding:7px 11px;border-radius:999px;font-size:11px;font-weight:950;background:#eef1f5;color:#667085}.statusPill.on{background:#e8f8ee;color:#17633f}.card{background:#fff;border:1px solid #e5ebf3;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 8px 26px rgba(24,49,91,.06)}.hero{background:linear-gradient(135deg,#1456d8,#387cff);color:#fff;border:0}.hero h2,.card h2,.card h3{margin:0 0 6px}.muted{color:#718096}.hero .muted{color:rgba(255,255,255,.82)}.row{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:14px;min-height:46px;padding:11px 16px;font-weight:900;font-size:15px;background:#1765ff;color:#fff;cursor:pointer}.btn:disabled{opacity:.55}.soft{background:#eef3ff;color:#1652b8}.danger{background:#fff0ef;color:#a52e2e}.good{background:#e9f9ef;color:#17633f}.bad{background:#fff0ef;color:#9c3535}.wide{width:100%}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:11px;font-weight:850;color:#64748b;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border:1px solid #ccd7e6;border-radius:12px;font-size:16px}.full{grid-column:1/-1}.dashHead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.meta{font-size:12px;color:#718096}.primaryActions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:13px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.stat{padding:10px;border-radius:12px;background:#fafbfe;border:1px solid #e7edf5}.stat small{display:block;font-size:9px;text-transform:uppercase;color:#7a8797}.stat b{display:block;margin-top:3px;font-size:12px}.empty{padding:22px 10px;text-align:center;color:#7c8798}.job{border:1px solid #dfe7f1;border-radius:16px;padding:13px}.jobTitle{font-size:16px;font-weight:950}.route{margin-top:7px;font-weight:800;line-height:1.45}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.chip{padding:6px 8px;border-radius:999px;background:#f1f5fa;font-size:10px;font-weight:850}.rideMap{height:210px;border-radius:15px;overflow:hidden;margin-top:12px;border:1px solid #dce5f1;background:#eef3f8}.contact{margin-top:12px;padding:12px;border:1px solid #d7e7dc;background:#f3fbf6;border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.callBtn{text-decoration:none;background:#176b42;color:#fff;border-radius:12px;padding:10px 13px;font-weight:900}.gps,.orderMeta{margin-top:10px;padding:10px;border-radius:12px;background:#f7f9fc;font-size:12px}.paymentBox{margin-top:13px;padding:14px;border:1px solid #d8e4f5;border-radius:15px;background:#f8fbff}.paymentHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.paymentPill{padding:5px 9px;border-radius:999px;font-size:10px;font-weight:900;background:#fff0df;color:#9a5a00}.paymentPill.paid{background:#e7f8ee;color:#12633a}.payMethods{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.payMethods button{border:1px solid #cfdcf0;background:#fff;color:#24466f;border-radius:11px;padding:10px 7px;font-weight:850}.pinModal{position:fixed;inset:0;z-index:9999;background:rgba(8,18,35,.72);display:flex;align-items:center;justify-content:center;padding:16px}.pinSheet{width:min(440px,100%);background:#fff;border-radius:24px;padding:20px}.pinSheet input{width:100%;padding:16px;border:2px solid #bfd3f4;border-radius:14px;font-size:30px;font-weight:900;letter-spacing:10px;text-align:center}.pinActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}@media(max-width:650px){.shell{padding:10px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.payMethods{grid-template-columns:1fr}.rideMap{height:190px}.pinModal{align-items:flex-end;padding:10px}.pinActions{grid-template-columns:1fr}}

<body>
<header class="top"><div class="topIn"><div class="brand">🛵 DBest Vaahak Partner</div><div id="globalStatus" class="statusPill">OFFLINE</div></div></header>
<main class="shell">
<div id="msg" class="card hidden"></div>
<section id="home" class="card hero"><h2>Vaahak Partner Portal</h2><p class="muted">Rides • Marketplace Delivery • Live GPS</p><div class="row"><button class="btn" id="goRegister">Register</button><button class="btn soft" id="goLogin">Login</button></div></section>
<section id="register" class="card hidden"><h2>Register as Vaahak</h2><form id="regForm"><div class="grid"><div class="field"><label>Full Name</label><input name="name" required></div><div class="field"><label>Mobile</label><input name="mobile" inputmode="tel" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Login PIN</label><input name="pin" type="password" inputmode="numeric" minlength="4" maxlength="8" required></div><div class="field"><label>Vehicle Type</label><select name="vehicle"><option>Bike</option><option>Auto</option><option>Car</option><option>SUV</option></select></div><div class="field"><label>Vehicle Number</label><input name="vehicleNo"></div><div class="full row"><label><input type="checkbox" name="ride" checked> Ride jobs</label><label><input type="checkbox" name="delivery" checked> Delivery jobs</label></div><div class="full row"><button class="btn wide" type="submit">Submit Registration</button><button class="btn soft" type="button" id="regBack">Back</button></div></div></form></section>
<section id="login" class="card hidden"><h2>Vaahak Login</h2><form id="loginForm"><div class="grid"><div class="field"><label>Vaahak ID or Mobile</label><input name="id" required></div><div class="field"><label>PIN</label><input name="pin" type="password" inputmode="numeric" required></div><div class="full row"><button class="btn wide">Open Dashboard</button><button class="btn soft" type="button" id="loginBack">Back</button></div></div></form></section>
<section id="dash" class="hidden"><div class="card"><div class="dashHead"><div><h2 id="vname">Vaahak Dashboard</h2><div id="vmeta" class="meta"></div></div></div><div class="primaryActions"><button id="toggleBtn" class="btn">Go Online</button><button id="logoutBtn" class="btn soft">Logout</button></div><div class="stats"><div class="stat"><small>Owner Approval</small><b id="approval">—</b></div><div class="stat"><small>Status</small><b id="online">—</b></div></div></div><div class="card"><h3>Current Ride / Delivery</h3><p class="muted">Marketplace orders use Razorpay verification. Cab rides keep direct Cash/UPI.</p><div id="jobs" class="empty">No live requests.</div></div></section>
</main>
<div id="pinModalHost"></div>
<script>
const cfg=window.DBEST_RUNTIME_CONFIG||{},BASE=String(cfg.supabaseUrl||'').replace(/\/$/,''),API=BASE+'/functions/v1/vaahak-live',COM=BASE+'/functions/v1/vaahak-commerce-live',CANCEL=BASE+'/functions/v1/ride-cancel-live',LOC=BASE+'/functions/v1/vaahak-location-live',KEY=cfg.supabasePublishableKey,TK='dbest_vaahak_live_token';
let current=null,currentJob=null,timer=null,map=null,gpsWatch=null,lastSend=0,pinModalOpen=false,busy=false;
const el=id=>document.getElementById(id);function token(){try{return localStorage.getItem(TK)||''}catch(e){return''}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function digits(s){return String(s||'').replace(/\D/g,'')}function finite(v){return v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v))}
function headers(auth=false){const h={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};if(auth&&token())h['x-vaahak-token']=token();return h}async function endpoint(url,action,body={},auth=false){const r=await fetch(url,{method:'POST',headers:headers(auth),body:JSON.stringify({action,...body})});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||'Request failed');e.data=d;e.status=r.status;throw e}return d}const call=(action,body={},auth=false)=>endpoint(API,action,body,auth),comCall=(action,body={},auth=false)=>endpoint(COM,action,body,auth),locCall=(action,body={})=>endpoint(LOC,action,body,true);
function note(t,ok=true){const m=el('msg');m.textContent=t;m.className='card '+(ok?'good':'bad');m.classList.remove('hidden')}function show(id){['home','register','login','dash'].forEach(x=>el(x).classList.toggle('hidden',x!==id));if(id==='dash')loadStatus(true)}
el('goRegister').onclick=()=>show('register');el('goLogin').onclick=()=>show('login');el('regBack').onclick=()=>show('home');el('loginBack').onclick=()=>show('home');el('toggleBtn').onclick=toggleOnline;el('logoutBtn').onclick=logout;
el('regForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),mobile=digits(f.get('mobile')),email=String(f.get('email')||'').trim();if(mobile.length<10)return note('Enter a valid mobile number.',false);if(!email.includes('@'))return note('Email is mandatory.',false);try{const d=await call('register',{name:f.get('name'),mobile,email,pin:f.get('pin'),vehicle:f.get('vehicle'),vehicleNo:f.get('vehicleNo'),canRide:f.get('ride')==='on',canDeliver:f.get('delivery')==='on'});note('Registration submitted. Vaahak ID: '+d.id);show('login')}catch(x){note('Registration failed: '+x.message,false)}};
el('loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const d=await call('login',{login:String(f.get('id')||'').trim(),pin:String(f.get('pin')||'').trim()});localStorage.setItem(TK,d.token);note('Login successful.');show('dash')}catch(x){note('Invalid Vaahak ID/mobile or PIN.',false)}};
function mapLink(lat,lng){return finite(lat)&&finite(lng)?'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(lat+','+lng)+'&travelmode=driving':'#'}function pickOne(jobs){const active=jobs.find(j=>current&&j.assigned_partner_id===current.id&&['Accepted','Trip Started'].includes(String(j.status)));return active||jobs.find(j=>j.status==='Open')||null}function isMarketplaceDelivery(j){return !!(j&&j.kind==='delivery'&&j.order_meta&&j.order_meta.marketplaceOrderId)}function isPaid(j){return ['Received','Prepaid','Paid','Razorpay Verified','Legacy Completed'].includes(String(j?.payment_status||''))}
function contactHtml(j){if(!current||j.assigned_partner_id!==current.id||!['Accepted','Trip Started'].includes(String(j.status)))return'';const n=digits(j.customer_mobile);return `<div class="contact"><div><small>Customer</small><b>${esc(j.customer_name||'Customer')}</b><div>${n.length>=10?esc(j.customer_mobile):'Mobile unavailable'}</div></div>${n.length>=10?`<a class="callBtn" href="tel:${esc(n)}">📞 Call</a>`:''}</div>`}
function orderMetaHtml(j){if(j.kind!=='delivery'||!j.order_meta)return'';const m=j.order_meta||{},items=Array.isArray(m.items)?m.items:[];return `<div class="orderMeta"><b>${esc(m.vendorName||'Marketplace Delivery')}</b>${items.length?`<div>${items.map(i=>`${esc(i.name||'Item')} × ${Number(i.qty||1)}`).join(' • ')}</div>`:''}${m.collectAmount?`<div style="margin-top:6px"><b>Order value: ₹${Math.round(Number(m.collectAmount||0))}</b></div>`:''}</div>`}
function paymentHtml(j){if(isMarketplaceDelivery(j)){const paid=isPaid(j),started=j.status==='Trip Started';return `<div class="paymentBox"><div class="paymentHead"><b>💳 Marketplace Payment</b><span class="paymentPill ${paid?'paid':''}">${paid?(j.payment_status==='Prepaid'?'PREPAID':'RAZORPAY VERIFIED'):(started?'PENDING':'RAZORPAY')}</span></div>${paid?`<div class="muted">${j.payment_status==='Prepaid'?'Payment completed online before dispatch.':'Customer payment verified by DBest through Razorpay.'}</div><div class="gps">Complete delivery only after Customer confirms receipt.</div>`:(started?`<div class="muted">Waiting for Customer Razorpay payment. Cash / UPI / Other confirmation is disabled for Marketplace orders.</div><div class="gps">This status refreshes automatically after successful payment.</div>`:`<div class="muted">Customer payment will be collected through Razorpay after delivery starts.</div>`)}</div>`}if(j.status!=='Trip Started')return'';const paid=isPaid(j);return `<div class="paymentBox"><div class="paymentHead"><b>💳 Cab/Ride Payment</b><span class="paymentPill ${paid?'paid':''}">${paid?'RECEIVED':'PENDING'}</span></div>${paid?`<div class="muted">Payment confirmed.</div><button class="btn wide" onclick="completeJob('${esc(j.id)}')">Complete Ride</button>`:`<div class="muted">Confirm only after receiving payment.</div><div class="payMethods"><button onclick="confirmPayment('${esc(j.id)}','Cash')">💵 Cash</button><button onclick="confirmPayment('${esc(j.id)}','UPI')">📲 UPI</button><button onclick="confirmPayment('${esc(j.id)}','Online / Other')">✅ Other</button></div>`}</div>`}
function renderJob(j){currentJob=j||null;const host=el('jobs');if(!j){host.className='empty';host.innerHTML='No live requests.';stopGps();if(map){try{map.remove()}catch(e){}map=null}return}host.className='';const assigned=current&&j.assigned_partner_id===current.id,isDelivery=j.kind==='delivery',target=j.status==='Trip Started'?'Destination':'Pickup',targetLat=j.status==='Trip Started'?j.drop_lat:j.pickup_lat,targetLng=j.status==='Trip Started'?j.drop_lng:j.pickup_lng;host.innerHTML=`<div class="job"><div class="jobTitle">${isDelivery?'📦 Marketplace Delivery':'🚕 Ride Request'}</div><div class="route">${esc(j.pickup)} → ${esc(j.dropoff)}</div><div class="chips">${j.distance_km?`<span class="chip">${Number(j.distance_km).toFixed(1)} km</span>`:''}${j.fare?`<span class="chip">₹${Number(j.fare)}</span>`:''}<span class="chip">${esc(j.status)}</span></div>${orderMetaHtml(j)}${contactHtml(j)}<div id="rideMap" class="rideMap"></div><div class="row" style="margin-top:10px">${mapLink(targetLat,targetLng)!=='#'?`<a class="btn soft" target="_blank" rel="noopener" href="${mapLink(targetLat,targetLng)}">Navigate</a>`:''}${j.status==='Open'?`<button class="btn" onclick="jobAction('${esc(j.id)}','accept')">Accept</button><button class="btn soft" onclick="jobAction('${esc(j.id)}','reject')">Skip</button>`:''}</div>${assigned&&j.status==='Accepted'?(isDelivery?`<button class="btn wide" style="margin-top:10px" onclick="startDelivery('${esc(j.id)}')">Start Delivery</button>`:`<button class="btn wide" style="margin-top:10px" onclick="openRidePin('${esc(j.id)}')">🔐 Enter Ride PIN</button>`)+`<button class="btn danger wide" style="margin-top:8px" onclick="cancelJob('${esc(j.id)}')">Cancel</button>`:''}${assigned?paymentHtml(j):''}</div>`;setTimeout(()=>renderMap(j),60);if(assigned&&['Accepted','Trip Started'].includes(String(j.status)))ensureGps();else stopGps()}
function renderMap(j){if(typeof L==='undefined')return;const x=el('rideMap');if(!x)return;if(map){try{map.remove()}catch(e){}map=null}map=L.map(x);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);const pts=[];if(finite(j.pickup_lat)&&finite(j.pickup_lng)){const a=[+j.pickup_lat,+j.pickup_lng];L.marker(a).addTo(map).bindPopup('Pickup');pts.push(a)}if(finite(j.drop_lat)&&finite(j.drop_lng)){const b=[+j.drop_lat,+j.drop_lng];L.marker(b).addTo(map).bindPopup('Destination');pts.push(b)}if(pts.length===2)L.polyline(pts,{weight:5}).addTo(map);if(pts.length)map.fitBounds(pts,{padding:[25,25],maxZoom:16});else map.setView([22.5,85.8],7);setTimeout(()=>map&&map.invalidateSize(),120)}
function ensureGps(){if(gpsWatch!=null||!navigator.geolocation)return;gpsWatch=navigator.geolocation.watchPosition(async p=>{const now=Date.now();if(now-lastSend>4000){lastSend=now;try{await locCall('update_location',{lat:p.coords.latitude,lng:p.coords.longitude,heading:p.coords.heading,speed:p.coords.speed,accuracy:p.coords.accuracy})}catch(e){}}},()=>{}, {enableHighAccuracy:true,timeout:15000,maximumAge:3000})}function stopGps(){if(gpsWatch!=null&&navigator.geolocation){try{navigator.geolocation.clearWatch(gpsWatch)}catch(e){}gpsWatch=null}}
async function loadStatus(force=false){clearTimeout(timer);if(!token())return show('login');if(pinModalOpen&&!force){timer=setTimeout(()=>loadStatus(false),3000);return}try{const d=await comCall('dashboard_status',{},true);current=d.partner;el('vname').textContent='🛵 '+(current.name||'Vaahak');el('vmeta').textContent=current.id+' • '+(current.vehicle||'')+' '+(current.vehicle_no||'');el('approval').textContent=current.owner_approval||'—';el('online').textContent=current.available?'ONLINE':'OFFLINE';el('toggleBtn').textContent=current.available?'Go Offline':'Go Online';el('globalStatus').textContent=current.available?'ONLINE':'OFFLINE';el('globalStatus').classList.toggle('on',!!current.available);renderJob(pickOne(d.jobs||[]));timer=setTimeout(()=>loadStatus(false),3000)}catch(x){if(/session/i.test(x.message)){localStorage.removeItem(TK);stopGps();show('login');note('Session expired. Please login again.',false)}else{note('Dashboard update failed: '+x.message,false);timer=setTimeout(()=>loadStatus(false),4000)}}}
function openRidePin(id){const j=currentJob;if(!j||String(j.id)!==String(id)||j.kind==='delivery')return;clearTimeout(timer);pinModalOpen=true;el('pinModalHost').innerHTML=`<div class="pinModal"><div class="pinSheet"><h3>🔐 Enter 4-digit Ride PIN</h3><input id="ridePin" type="tel" inputmode="numeric" maxlength="4"><div class="pinActions"><button class="btn" onclick="verifyRidePin('${esc(id)}')">Verify & Start</button><button class="btn soft" onclick="closeRidePin()">Cancel</button></div></div></div>`;const i=el('ridePin');i.addEventListener('input',()=>i.value=digits(i.value).slice(0,4));setTimeout(()=>i.focus(),60)}function closeRidePin(){pinModalOpen=false;el('pinModalHost').innerHTML='';loadStatus(true)}
async function verifyRidePin(id){if(busy)return;const i=el('ridePin'),pin=digits(i?.value).slice(0,4);if(!/^\d{4}$/.test(pin))return note('Enter complete 4-digit Ride PIN.',false);busy=true;try{const d=await call('start',{jobId:id,otp:pin},true);if(!d.otpVerified)throw new Error('pin_not_verified');note('Ride started.');closeRidePin()}catch(x){note(x.message==='invalid_ride_otp'?'Ride PIN does not match.':'Ride could not start: '+x.message,false)}finally{busy=false}}
async function startDelivery(id){if(busy)return;busy=true;try{await comCall('start_delivery',{jobId:id},true);note('Delivery started.');loadStatus(true)}catch(x){note('Delivery could not start: '+x.message,false)}finally{busy=false}}
async function confirmPayment(id,method){if(isMarketplaceDelivery(currentJob))return note('Marketplace payment is completed by the Customer through Razorpay. Please wait for verified payment status.',false);if(busy)return;busy=true;try{await comCall('confirm_payment',{jobId:id,method},true);note('Payment confirmed.');loadStatus(true)}catch(x){note('Payment confirmation failed: '+x.message,false)}finally{busy=false}}
async function completeJob(id){if(busy)return;const j=currentJob;if(!j||String(j.id)!==String(id))return;if(!isPaid(j))return note(isMarketplaceDelivery(j)?'Waiting for Customer Razorpay payment verification.':'Confirm payment first.',false);busy=true;try{if(j.kind==='delivery')await comCall('complete_delivery',{jobId:id},true);else await call('complete',{jobId:id},true);note((j.kind==='delivery'?'Delivery':'Ride')+' completed.');stopGps();loadStatus(true)}catch(x){note('Could not complete job: '+x.message,false)}finally{busy=false}}
async function jobAction(id,action){if(busy)return;busy=true;try{await call(action,{jobId:id},true);note(action==='accept'?'Job accepted.':'Request skipped.');loadStatus(true)}catch(x){note('Job update failed: '+x.message,false)}finally{busy=false}}
async function cancelJob(id){if(!confirm('Cancel this job?'))return;try{const r=await fetch(CANCEL,{method:'POST',headers:headers(true),body:JSON.stringify({action:'vaahak_cancel',jobId:id,reason:''})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Unable to cancel');note('Job cancelled.');loadStatus(true)}catch(x){note('Unable to cancel: '+x.message,false)}}
async function toggleOnline(){if(busy)return;busy=true;try{const s=await call('status',{},true);await call('availability',{available:!s.partner.available},true);note(!s.partner.available?'You are ONLINE.':'You are OFFLINE.');loadStatus(true)}catch(x){note(x.message==='owner_approval_pending'?'Owner approval is required before going online.':'Unable to change status: '+x.message,false)}finally{busy=false}}function logout(){localStorage.removeItem(TK);clearTimeout(timer);stopGps();current=null;currentJob=null;el('globalStatus').textContent='OFFLINE';el('globalStatus').classList.remove('on');show('login')}
if(token())show('dash');
</script>
