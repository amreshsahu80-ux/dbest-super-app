<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBest Demo Member Login</title><script src="./runtime-config.js"></script><style>body{margin:0;font-family:Inter,system-ui,Arial;background:#f5f7fb;color:#14213d;display:grid;place-items:center;min-height:100vh;padding:18px}.card{width:min(430px,100%);background:#fff;border-radius:20px;padding:22px;box-shadow:0 20px 60px rgba(20,40,80,.12)}h2{margin:0 0 6px}p{color:#667085;line-height:1.5}label{display:block;font-size:12px;font-weight:800;margin:12px 0 6px}input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d9e0ec;border-radius:12px;font-size:16px;background:#fff}.btn{width:100%;margin-top:14px;border:0;border-radius:12px;padding:12px;background:#175cff;color:#fff;font-weight:800}.msg{margin-top:10px;font-size:13px;min-height:20px}.hint{margin-top:14px;padding:10px;background:#f0f5ff;border-radius:10px;font-size:12px;color:#31528a}</style></head><body><div class="card"><h2>DBest Demo Member Login</h2><p>Test environment only. Select a demo role and enter its password.</p><form id="f"><label>Demo Role</label><select id="id"><option value="DMGUEST01">Demo Guest — DMGUEST01</option><option value="DMPROMO01">Demo Promoter — DMPROMO01</option><option value="DMPRIME01">Demo Prime — DMPRIME01</option><option value="DMLEADER01">Demo Leader — DMLEADER01</option></select><label>Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="Demo password"><button class="btn" id="go">Login to Test Dashboard</button><div class="msg" id="msg"></div></form><div class="hint">Use the password shared for the selected role.</div></div><script>(function(){const cfg=window.DBEST_RUNTIME_CONFIG||{};const base=cfg.supabaseUrl,key=cfg.supabasePublishableKey;const f=document.getElementById('f'),m=document.getElementById('msg'),b=document.getElementById('go');f.onsubmit=async(e)=>{e.preventDefault();if(!base||!key){m.textContent='Runtime configuration unavailable.';return}b.disabled=true;b.textContent='Signing in…';m.textContent='';try{const selected=document.getElementById('id').value;const r=await fetch(base+'/functions/v1/member-login-live',{method:'POST',headers:{'apikey':key,'Content-Type':'application/json'},body:JSON.stringify({action:'demo_login',login:selected,password:document.getElementById('pw').value})});const raw=await r.text();let d={};try{d=raw?JSON.parse(raw):{}}catch(_){d={error:raw||'invalid_response'}}if(!r.ok){const extra=d.received?(' [received: '+d.received+']'):'';throw new Error((d.error||('http_'+r.status))+extra)}localStorage.setItem('dbest_member_live_token',String(d.token||''));localStorage.setItem('dbest_demo_login_member',JSON.stringify(d.member||{}));m.style.color='#15803d';m.textContent='Login successful. Opening dashboard…';setTimeout(()=>location.href='/?demoMember='+encodeURIComponent((d.member||{}).id||''),500)}catch(err){m.style.color='#b91c1c';const code=String(err&&err.message||'login_failed');m.textContent=code.startsWith('invalid_demo_credentials')?'Invalid password for selected demo role.':'Demo login failed: '+code}finally{b.disabled=false;b.textContent='Login to Test Dashboard'}}})();</script></body></html>
