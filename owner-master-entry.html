<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>DBest Project Owner Console</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f5f7fb}
    #dbestOwnerBoot{min-height:100dvh;display:grid;place-items:center;padding:24px;font:700 15px system-ui;color:#33415c;text-align:center}
  </style>
  <script src="/runtime-config.js?v=20260920-owner-float-v3"></script>
</head>
<body>
  <div id="dbestOwnerBoot">Opening DBest Project Owner Console…</div>
  <script>
  (async function(){
    try{
      const BUILD='20260922-platform-analytics-v22';
      const r=await fetch('/index-26.html?v='+BUILD,{cache:'no-store'});
      if(!r.ok)throw new Error('Unable to load Owner Console');
      let html=await r.text();

      html=html.replace('</head>','<script src="/runtime-config.js?v='+BUILD+'"><\/script></head>');

      const scripts=[
        'owner-auth-bridge.js',
        'owner-portal-route.js',
        'owner-live-network-bridge.js',
        'showcase-live-admin.js',
        'owner-control-live.js',
        'owner-clean-controls.js',
        'owner-core-fix.js',
        'owner-navigation-fix.js',
        'owner-report-center.js',
        'owner-report-launcher-fix.js',
        'owner-partner-onboarding-fix.js',
        'owner-report-visibility-v2.js',
        'owner-master-excel-download-fix.js',
        'owner-partner-section-visuals-link.js',
        'owner-payout-percentage-matrix.js',
        'owner-payout-entry-visible.js',
        'owner-section-visibility-control.js',
        'owner-deeplink-all-sections.js',
        'owner-vaahak-wallet-v1.js',
        'owner-review-files-v1.js',
        'partner-kyc-owner-display-v2.js',
        'partner-kyc-owner-signing.js',
        'owner-vendor-profile-review-v1.js',
        'owner-marketplace-category-control-v1.js',
        'owner-control-deployment-v2.js',
        'owner-distributor-management-entry-v1.js',
        'owner-intervention-center-v1.js','owner-push-notification-center-v1.js','owner-whatsapp-setup-v1.js','dbest-push-client-v1.js','owner-floating-actions-layout-v1.js','owner-platform-analytics-v1.js'
      ].map(function(src){return '<script src="/'+src+'?v='+BUILD+'"><\/script>';}).join('');

      const ownerBoot='<script>(function(){function open(){try{if(window.DBEST_OWNER_PORTAL_ROUTE&&window.DBEST_OWNER_PORTAL_ROUTE.open&&location.pathname.toLowerCase()!=="/owner"){location.replace("/owner");return}if(typeof window.ownerLogin==="function"){window.ownerLogin();return}}catch(e){}setTimeout(open,120)}setTimeout(open,80)})();<\/script>';

      html=html.replace('</body>',scripts+ownerBoot+'</body>');
      document.open();document.write(html);document.close();
    }catch(err){
      document.body.innerHTML='<div style="font-family:system-ui;padding:24px"><h2>DBest Project Owner Console</h2><p>Owner Console loading error. Please refresh once.</p><p style="color:#667085">'+String(err&&err.message||err)+'</p></div>';
      console.error(err);
    }
  })();
  </script>
</body>
</html>
