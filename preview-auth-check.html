<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBest Login Check</title><style>body{font:16px system-ui;background:#f4f7fd;color:#17233b;padding:24px;max-width:560px;margin:auto}article{background:white;padding:20px;border-radius:16px;box-shadow:0 8px 25px #1122}a{display:block;padding:13px;background:#175cff;color:white;text-align:center;border-radius:10px;text-decoration:none;margin-top:20px}</style></head><body><article><h2>DBest Login Check</h2><p id="result">Checking session…</p><p id="details"></p><a href="/">Continue to DBest Home</a></article><script>(function(){var s=null,u=[],token=false;try{s=JSON.parse(localStorage.getItem("d2_session")||"null");u=JSON.parse(localStorage.getItem("d2_users")||"[]");token=!!localStorage.getItem("dbest_member_live_token")}catch(e){}var found=!!(s&&s.id&&Array.isArray(u)&&u.some(function(v){return String(v.id)===String(s.id)}));document.getElementById("result").textContent=s&&s.id&&token&&found?"Authenticated session saved":"Session incomplete after login";document.getElementById("details").textContent="Host: "+location.host+" | Role: "+(s&&s.role||"none")+" | Member ID saved: "+!!(s&&s.id)+" | Member record found: "+found+" | Token present: "+token;})();</script></body></html>
