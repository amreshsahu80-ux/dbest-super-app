<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>DBest Super Platform</title>
</head>
<body>
  <div style="font-family:system-ui,Arial;padding:24px;text-align:center">Opening DBest Super App...</div>
  <script>
    (async function(){
      try{
        const BUILD='20260901-0205-preview-speed-v4';
        const r=await fetch('./index-26.html?v='+BUILD,{cache:'no-store'});
        if(!r.ok)throw new Error('Unable to load application');
        let html=await r.text();
        const scriptOpen='<scr'+'ipt src="./runtime-config.js?v='+BUILD+'">';
        const scriptClose='</scr'+'ipt>';
        html=html.replace('</head>',scriptOpen+scriptClose+'<style>html,body{max-width:100%;overflow-x:hidden}img,video,canvas,iframe{max-width:100%;height:auto}input,select,textarea,button{max-width:100%}@media(max-width:700px){.w{width:100%!important;max-width:100%!important}.sectionPage,.sectionOverlay{max-width:100%!important}.form,.serviceFormGrid{grid-template-columns:1fr!important}.full{grid-column:1!important}}</style></head>');
        const core=['member-id-collision-fix.js','backend-bridge.js','member-live-login-bridge.js','production-demo-auth-guard.js','onboarding-contact-policy.js','multilingual-ui-v2.js','language-selector-fix.js','security-inactivity-timeout-v1.js'];
        const tags=core.map(f=>'<scr'+'ipt src="./'+f+'?v='+BUILD+'"></scr'+'ipt>').join('');
        html=html.replace('</body>',tags+'<scr'+'ipt src="./preview-lazy-loader.js?v='+BUILD+'"></scr'+'ipt></body>');
        document.open();document.write(html);document.close();
      }catch(err){
        document.body.innerHTML='<div style="font-family:system-ui,Arial;padding:24px"><h2>DBest Super App</h2><p>Application loading error. Please refresh.</p></div>';
        console.error(err);
      }
    })();
  </script>
</body>
</html>
