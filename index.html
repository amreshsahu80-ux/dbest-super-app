<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
  <title>DBest Super Platform — Safe AI Test</title>
  <style>
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:#f5f7fb}
    body{margin:0;min-width:320px;max-width:100%;overflow-x:hidden}
    *,*:before,*:after{box-sizing:border-box}
    button,input,select,textarea{font:inherit}
    #dbestBoot{min-height:100dvh;display:grid;place-items:center;padding:24px;font:700 14px system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#33415c;text-align:center}
  </style>
</head>
<body>
  <div id="dbestBoot">Opening DBest Super Platform…</div>
  <script>
    (async function(){
      try{
        const BUILD='20260911-marketplace-diagnostic-v22-same-context';
        const r=await fetch('./index-26.html?v='+BUILD,{cache:'no-store'});
        if(!r.ok)throw new Error('Unable to load application');
        let html=await r.text();

        const joinExpr='location.href="/join.html"+(new URLSearchParams(location.search).get("ref")?("?ref="+encodeURIComponent(new URLSearchParams(location.search).get("ref"))):"");return;';
        html=html.replace('function account(){','function account(){if(session.role==="visitor"){'+joinExpr+'}');
        html=html.replace('function openService(id){','function openService(id){if(id==="join"&&session.role==="visitor"){'+joinExpr+'}');
        html=html.replace('function registerChoice(){','function registerChoice(){'+joinExpr);
        html=html.replace('function reg(tier){','function reg(tier){location.href="/join.html?tier="+encodeURIComponent(tier);return;');

        const uniform='<style id="dbest-device-uniformity">html{-webkit-text-size-adjust:100%;text-size-adjust:100%}body{margin:0;max-width:100%;overflow-x:hidden}*,*:before,*:after{box-sizing:border-box}button,input,select,textarea{font:inherit}@media(max-width:480px){input,select,textarea{font-size:16px}}</style>';
        html=html.replace('</head>',uniform+'<script src="./runtime-config.js?v='+BUILD+'"><\/script></head>');
        html=html.replace('</body>','<script defer src="./app-bootstrap-performance-v1.js?v='+BUILD+'"><\/script><script defer src="./auth-mobile-layout-fix-v1.js?v='+BUILD+'"><\/script><script defer src="./payu-preserve-v1.js?v='+BUILD+'"><\/script><script defer src="./razorpay-integration-v1.js?v='+BUILD+'"><\/script><script defer src="./payment-policy-router-v1.js?v='+BUILD+'"><\/script><script defer src="./razorpay-ecom-trace-v1.js?v='+BUILD+'"><\/script><script defer src="./razorpay-checkout-policy-v1.js?v='+BUILD+'"><\/script><script defer src="./razorpay-paymentpage-fallback-v1.js?v='+BUILD+'"><\/script><script defer src="./razorpay-legacy-cart-handoff-v1.js?v='+BUILD+'"><\/script><script defer src="./marketplace-secure-session-v1.js?v='+BUILD+'"><\/script><script defer src="./razorpay-master-cart-button-v1.js?v='+BUILD+'"><\/script><script defer src="./ai-safe-client-v3.js?v='+BUILD+'"><\/script><script defer src="./ai-conversation-flow-v5.js?v='+BUILD+'"><\/script><script>(function(){const q=new URLSearchParams(location.search);if(q.get("dbestLogin")==="1")setTimeout(function(){if(typeof loginChoice==="function")loginChoice()},300);if(q.get("marketDiag")==="1"){const show=async()=>{try{await window.DBEST_PERFORMANCE_BOOTSTRAP?.startFeatures?.();await new Promise(r=>setTimeout(r,700));const boot=!!window.DBEST_PERFORMANCE_BOOTSTRAP,master=!!window.DBEST_MASTER_MARKET,rz=!!window.DBEST_MASTER_RAZORPAY,fin=!!window.DBEST_FINAL_MARKET_CHECKOUT;let token=false,count=-1,form=false,err="";try{token=!!window.DBEST_MEMBER_LIVE?.getToken?.()}catch(_){}try{count=Number(window.DBEST_MASTER_MARKET?.count?.())}catch(_){}if(fin&&count>0){try{window.DBEST_FINAL_MARKET_CHECKOUT.checkout();await new Promise(r=>setTimeout(r,150));form=!!document.getElementById("dbestFinalRazorpayForm")}catch(e){err=String(e?.message||e)}}const items=[["App bootstrap",boot],["Master Cart module",master],["Razorpay module",rz],["Final checkout renderer",fin],["Secure member session",token],["Cart items detected",count>0?count:"0 / unavailable"],["Checkout form created",form]];const wrap=document.createElement("div");wrap.id="dbestSameContextDiag";wrap.style.cssText="position:fixed;inset:0;z-index:2147483647;background:#f5f7fb;overflow:auto;padding:20px;font-family:system-ui,Arial;color:#13213a";wrap.innerHTML='<div style="max-width:560px;margin:auto;background:#fff;border:1px solid #e2e8f2;border-radius:20px;padding:20px"><h2 style="margin-top:0">DBest Checkout Diagnostic</h2><p style="color:#687386">Same-origin diagnostic running inside the actual DBest app.</p>'+items.map(x=>'<div style="display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid #edf1f6"><b>'+x[0]+'</b><b style="text-align:right;color:'+(x[1]===true||typeof x[1]==='number'&&x[1]>0?'#15803d':'#b91c1c')+'">'+(x[1]===true?'PASS':x[1]===false?'FAIL':x[1])+'</b></div>').join('')+(err?'<div style="margin-top:12px;color:#b91c1c;font-weight:700">'+err.replace(/[&<>]/g,'')+'</div>':'')+'<p style="margin-top:16px;font-weight:800;color:'+(boot&&master&&rz&&fin&&token&&count>0&&form?'#15803d':'#b91c1c')+'">'+(boot&&master&&rz&&fin&&token&&count>0&&form?'PASS — checkout renderer is working':'FAIL — screenshot this page')+'</p></div>';document.body.appendChild(wrap)}catch(e){alert('Diagnostic failed: '+String(e?.message||e))}};setTimeout(show,900)}if(q.get("marketCheckout")==="1"){let tries=0;const go=async()=>{tries++;try{await window.DBEST_PERFORMANCE_BOOTSTRAP?.startFeatures?.();if(window.DBEST_FINAL_MARKET_CHECKOUT?.checkout){window.DBEST_FINAL_MARKET_CHECKOUT.checkout();return}if(window.DBEST_MASTER_RAZORPAY?.checkout){window.DBEST_MASTER_RAZORPAY.checkout();return}}catch(e){console.error("[DBEST direct checkout route]",e)}if(tries<40)setTimeout(go,250);};setTimeout(go,500)}})();<\/script></body>');
        document.open();
        document.write(html);
        document.close();
      }catch(err){
        document.body.innerHTML='<div style="font-family:system-ui,Arial;padding:24px"><h2>DBest Super Platform</h2><p>Application loading error. Please refresh.</p></div>';
        console.error(err);
      }
    })();
  </script>
</body>
</html>
