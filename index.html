<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DBest Super App</title>
</head>
<body>
  <div style="font-family:system-ui,Arial;padding:24px;text-align:center">Opening DBest Super App...</div>
  <script>
    (async function(){
      try{
        const r = await fetch('./index-26.html', {cache:'no-store'});
        if(!r.ok) throw new Error('Unable to load application');
        let html = await r.text();
        html = html.replace('</head>', '<script src="./runtime-config.js"><\/script></head>');
        html = html.replace('</body>', '<script src="./backend-bridge.js"><\/script></body>');
        document.open();
        document.write(html);
        document.close();
      }catch(err){
        document.body.innerHTML = '<div style="font-family:system-ui,Arial;padding:24px"><h2>DBest Super App</h2><p>Application loading error. Please refresh.</p></div>';
        console.error(err);
      }
    })();
  </script>
</body>
</html>
