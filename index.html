<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
  <title>DBest Super Platform — Safe AI Test</title>
  <style>
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:#f5f7fb}
    body{margin:0;min-width:320px;max-width:100%;overflow-x:hidden}
    *,*:before,*:after{box-sizing:border-box}
    button,input,select,textarea{font:inherit}
    #dbestBoot{min-height:100dvh;display:grid;place-items:center;padding:24px;font:700 14px system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#33415c;text-align:center}
  </style>
</head>
<body>
  <div id="dbestBoot">Opening DBest Super Platform…</div>
  <script>
    (async function(){
      try{
        const BUILD='20260912-wallet-summary-v1';
        const r=await fetch('./index-26.html?v='+BUILD,{cache:'no-store'});
        if(!r.ok)throw new Error('Unable to load application');
        let html=await r.text();

        const joinExpr='location.href="/join.html"+(new URLSearchParams(location.search).get("ref")?("?ref="+encodeURIComponent(new URLSearchParams(location.search).get("ref"))):"");return;';
        html=html.replace('function openService(id){','function openService(id){if(id==="join"&&session.role==="visitor"){'+joinExpr+'}');
        html=html.replace('function registerChoice(){','function registerChoice(){'+joinExpr);
        html=html.replace('function reg(tier){','function reg(tier){location.href="/join.html?tier="+encodeURIComponent(tier);return;');
        html=html.replace('function loginChoice(){','function loginChoice(){location.href="/preview-member-login-v2.html?return=%2F";return;');
        html=html.split('onclick="loginChoice()"').join('onclick="location.href=\'/preview-member-login-v2.html?return=%2F\';return false"');
        html=html.replace('function ownerOnboardingHub(){','function ownerOnboardingHub(){location.href="/owner-live-onboarding.html";return;');
        html=html.replace('function ownerMemberOnboarding(){','function ownerMemberOnboarding(){location.href="/owner-live-onboarding.html";return;');

        html=html.replace(
          '<button class="btn" id="account" onclick="account()">👤 Register / Login</button>',
          '<div id="dbestHomeAuthActions" style="display:flex;gap:8px;align-items:center"><button class="btn soft" id="homeRegister" onclick="session.role===\'visitor\'?registerChoice():account()">✨ Register</button><button class="btn" id="loginHome" onclick="location.href=\'/preview-member-login-v2.html?return=%2F\';return false">🔐 Login</button></div>'
        );
        html=html.replace(
          '<button class="btn" style="background:#ffffff18;border:1px solid #ffffff35" onclick="account()">Register / Login</button>',
          '<button class="btn" style="background:#fff;color:#1550c6" onclick="registerChoice()">Register</button> <button class="btn" style="background:#ffffff18;border:1px solid #ffffff35" onclick="location.href=\'/preview-member-login-v2.html?return=%2F\';return false">Login</button>'
        );
        html=html.replace(
          '$("account").textContent=session.role==="visitor"?"👤 "+t.acc:"👤 "+(u?.name||session.role);',
          'var hr=$("homeRegister");if(hr)hr.textContent=session.role==="visitor"?"✨ Register":"👤 "+(u?.name||session.role);var lh=$("loginHome");if(lh)lh.style.display=session.role==="visitor"?"":"none";'
        );

        html=html.replace(
          'onclick="marketCheckout(\'${type}\')"',
          'onclick="location.href=\'/preview-marketplace-razorpay-checkout.html?v='+BUILD+'\';return false"'
        );

        const uniform='<style id="dbest-device-uniformity">html{-webkit-text-size-adjust:100%;text-size-adjust:100%}body{margin:0;max-width:100%;overflow-x:hidden}*,*:before,*:after{box-sizing:border-box}button,input,select,textarea{font:inherit}@media(max-width:700px){#dbestHomeAuthActions{width:100%;order:4}#dbestHomeAuthActions .btn{flex:1}}@media(max-width:480px){input,select,textarea{font-size:16px}}</style>';
        html=html.replace('</head>',uniform+'<script src="./runtime-config.js?v='+BUILD+'"><\/script></head>');

        const extras=[
          'app-bootstrap-performance-v1.js','auth-mobile-layout-fix-v1.js','payu-preserve-v1.js',
          'membership-explainer-action-fix-v1.js','user-login-overlay-guard-v1.js',
          'razorpay-integration-v1.js','payment-policy-router-v1.js','razorpay-ecom-trace-v1.js',
          'razorpay-checkout-policy-v1.js','razorpay-paymentpage-fallback-v1.js',
          'marketplace-secure-session-v1.js','razorpay-master-cart-button-v1.js',
          'marketplace-checkout-standalone-route-v1.js','member-wallet-summary-ui-v1.js','ai-safe-client-v3.js','ai-conversation-flow-v5.js'
        ].map(function(src){return '<script defer src="./'+src+'?v='+BUILD+'"><\/script>';}).join('');
        const bootExtras='<script>(function(){window.DBEST_PREVIEW_LOGIN=function(){location.href="/preview-member-login-v2.html?return=%2F";return false};window.loginChoice=window.DBEST_PREVIEW_LOGIN;window.DBEST_PREVIEW_OPEN_RAZORPAY=function(e){try{e&&e.preventDefault&&e.preventDefault();e&&e.stopPropagation&&e.stopPropagation()}catch(_){}location.href="/preview-marketplace-razorpay-checkout.html?v='+BUILD+'";return false};setTimeout(function(){if(new URLSearchParams(location.search).get("dbestLogin")==="1")window.DBEST_PREVIEW_LOGIN()},300)})();<\/script>';
        html=html.replace('</body>',extras+bootExtras+'</body>');

        document.open();
        document.write(html);
        document.close();
      }catch(err){
        document.body.innerHTML='<div style="font-family:system-ui,Arial;padding:24px"><h2>DBest Super Platform</h2><p>Application loading error. Please refresh.</p></div>';
        console.error(err);
      }
    })();
  </script>
</body>
</html>
