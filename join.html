<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Join DBest</title>
<meta name="robots" content="noindex">
<style>
:root{--p:#1760ff;--p2:#735cff;--ink:#13203a;--muted:#6d7890;--line:#e2e8f2;--bg:#f5f7fb;--ok:#12834a;--danger:#a62f2f}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink)}button,input{font:inherit}.page{min-height:100dvh;padding:10px}.shell{max-width:900px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 20px 60px rgba(30,55,100,.12)}.hero{padding:22px;background:linear-gradient(135deg,#12366e,#1760ff 62%,#735cff);color:#fff}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand img{width:150px;max-height:52px;object-fit:contain}.home{border:1px solid #ffffff55;background:#ffffff15;color:#fff;border-radius:14px;padding:10px 13px;font-weight:800}.hero h1{margin:16px 0 5px;font-size:30px;line-height:1.1}.hero p{margin:0;color:#eaf0ff;line-height:1.5}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}.step{padding:8px;border:1px solid #ffffff38;border-radius:999px;text-align:center;font-size:11px;font-weight:800}.step.on{background:#fff;color:#1760ff}.body{padding:20px}.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.plan{border:1px solid var(--line);border-radius:19px;padding:16px}.plan h3{margin:8px 0 4px}.price{font-size:25px;font-weight:900;color:var(--p)}.plan small,.muted{color:var(--muted)}.primary,.plan button{width:100%;border:0;border-radius:13px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:900;padding:13px;margin-top:14px}.card{max-width:620px;margin:auto;border:1px solid var(--line);border-radius:20px;padding:18px}.summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px;border:1px solid #dce6ff;background:#eef4ff;border-radius:15px}.summary b,.user b{display:block}.amount{font-size:24px;font-weight:900;color:var(--p)}.socials{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.social{height:52px;border:1px solid #dfe5ee;background:#fff;border-radius:14px;font-weight:900}.social.fb{background:#1877f2;color:#fff;border-color:#1877f2}.note,.status,.err{margin-top:13px;padding:11px 12px;border-radius:13px;font-size:12px;line-height:1.5}.note,.status{background:#f5f7fb;color:#5d6980}.err{background:#fff1f1;border:1px solid #f0cccc;color:var(--danger)}.user{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:14px}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#efeaff;display:grid;place-items:center;font-weight:900;color:#5537bb}.field{margin-top:12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px;color:#49556d}.field input{width:100%;height:50px;border:1px solid #dfe5ee;border-radius:13px;padding:0 14px;font-size:16px;outline:none}.field input:focus{border-color:#789bff;box-shadow:0 0 0 4px #edf3ff}.center{text-align:center}.link{border:0;background:transparent;color:var(--p);font-weight:800;padding:11px}.success{text-align:center;max-width:620px;margin:auto}.tick{width:72px;height:72px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#e8f8ef;color:var(--ok);font-size:36px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.grid>div{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left}.grid small{display:block;color:var(--muted)}.grid b{display:block;margin-top:3px}.warn{padding:13px;border-radius:14px;background:#fff8e9;border:1px solid #efdfa9;text-align:left;margin:13px 0}.hidden{display:none!important}
@media(max-width:760px){.page{padding:6px}.shell{border-radius:18px}.hero{padding:18px 15px}.hero h1{font-size:26px}.body{padding:14px}.plans{grid-template-columns:1fr 1fr}.socials{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}}
@media(max-width:430px){.plans{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="page"><div class="shell"><div id="app"></div></div></div>
<script>
(()=>{
'use strict';
const SUPA_URL='https://ydedmotbacnllkijzmvp.supabase.co';
const SUPA_KEY='sb_publishable_qWqQExdtL5ddWcK_yLCcNA__-ZUBtox';
const PENDING='dbest_join_pending_v2';
const SOCIAL='dbest_join_social_v2';
const TIERS={leader:{name:'Leader',price:999,badge:'👑'},prime:{name:'Prime',price:599,badge:'⭐'},promoter:{name:'Promoter',price:299,badge:'🚀'},guest:{name:'Guest User',price:49,badge:'✨'}};
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qs=new URLSearchParams(location.search);
const initialRef=String(qs.get('ref')||'').trim().toUpperCase();
const initialTier=String(qs.get('tier')||'').toLowerCase();
const initialProvider=String(qs.get('oauth')||'').toLowerCase();
function read(k,d=null){try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch{return d}}
function write(k,v){localStorage.setItem(k,JSON.stringify(v))}
function drop(k){localStorage.removeItem(k)}
function header(title,sub,step){return `<div class="hero"><div class="brand"><img src="/dbest-logo.png" alt="DBest"><button class="home" onclick="location.href='/'">← DBest Home</button></div><h1>${esc(title)}</h1><p>${esc(sub)}</p><div class="steps">${['Choose Plan','Secure Login','Payment','Active'].map((x,i)=>`<div class="step ${i<=step?'on':''}">${i+1}. ${x}</div>`).join('')}</div></div>`}
function render(html){app.innerHTML=html}
function plans(){render(`${header('Join DBest in under a minute','Choose a plan, sign in securely and pay with Razorpay.',0)}<div class="body"><div class="plans">${Object.entries(TIERS).map(([k,t])=>`<div class="plan"><div style="font-size:26px">${t.badge}</div><h3>${t.name}</h3><div class="price">₹${t.price.toLocaleString('en-IN')}</div><small>${k==='leader'?'Build and lead your DBest network.':k==='prime'?'Enhanced benefits and earning opportunity.':k==='promoter'?'Start promoting DBest services and earning.':'Use DBest services as a registered user.'}</small><button onclick="choose('${k}')">Choose ${t.name}</button></div>`).join('')}</div>${initialRef?`<div class="note">Referral detected: <b>${esc(initialRef)}</b>. It will be applied automatically.</div>`:''}</div>`)}
function choose(tier,msg=''){const t=TIERS[tier];if(!t)return plans();render(`${header('Secure sign-in','Continue with Google or Facebook. No long registration form.',1)}<div class="body"><div class="card"><div class="summary"><div><b>${t.badge} ${t.name}</b><span class="muted">Membership selected</span></div><div class="amount">₹${t.price.toLocaleString('en-IN')}</div></div><div class="socials"><button class="social" onclick="social('google','${tier}')">G &nbsp; Continue with Google</button><button class="social fb" onclick="social('facebook','${tier}')">f &nbsp; Continue with Facebook</button></div><div class="note">Referral code is optional. Aadhaar, PAN, bank details, UTR and payment proof are not required to join.</div>${msg?`<div class="err">${esc(msg)}</div>`:''}<div class="center"><button class="link" onclick="plans()">← Change plan</button></div></div></div>`)}
function social(provider,tier){const old=read(PENDING,{})||{};const ref=initialRef||old.ref||'';const pending={provider,tier,ref,at:Date.now()};write(PENDING,pending);const params=new URLSearchParams({tier,oauth:provider});if(ref)params.set('ref',ref);const redirect=`${location.origin}/join.html?${params.toString()}`;location.href=`${SUPA_URL}/auth/v1/authorize?provider=${encodeURIComponent(provider)}&redirect_to=${encodeURIComponent(redirect)}`}
async function socialUser(token){const r=await fetch(`${SUPA_URL}/auth/v1/user`,{headers:{apikey:SUPA_KEY,Authorization:`Bearer ${token}`}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||j.error_description||'Unable to read social profile');const md=j.user_metadata||{},am=j.app_metadata||{};return{id:String(j.id||''),email:String(j.email||''),name:String(md.full_name||md.name||j.email||'DBest User'),avatar:String(md.avatar_url||md.picture||''),provider:String(am.provider||'')}}
function detail(tier,p){const t=TIERS[tier];if(!t)return plans();const pending=read(PENDING,{})||{},ref=pending.ref||initialRef;write(SOCIAL,p);render(`${header('Almost done','Just add your mobile number. Referral code is optional.',1)}<div class="body"><div class="card"><div class="user">${p.avatar?`<img class="avatar" src="${esc(p.avatar)}" alt="Profile">`:`<div class="avatar">${esc((p.name||'D')[0])}</div>`}<div><b>${esc(p.name)}</b><span class="muted">${esc(p.email)} • ${esc(p.provider||pending.provider||'Social login')}</span></div></div><form onsubmit="pay(event,'${tier}')"><div class="field"><label>Mobile number</label><input name="mobile" inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="10-digit mobile number" required></div><div class="field"><label>Referral code <span class="muted">(optional)</span></label><input name="referral" value="${esc(ref)}" placeholder="e.g. DB3001" style="text-transform:uppercase"></div><div class="summary" style="margin-top:14px"><div><b>${t.badge} ${t.name}</b><span class="muted">Razorpay secure payment</span></div><div class="amount">₹${t.price.toLocaleString('en-IN')}</div></div><div id="gatewayStatus" class="status">Checking Razorpay…</div><button class="primary" type="submit">Pay ₹${t.price.toLocaleString('en-IN')} & Activate</button><div class="note">Membership activates only after DBest verifies the Razorpay payment on the server. No Owner payment approval.</div></form></div></div>`);checkGateway()}
async function checkGateway(){const el=document.getElementById('gatewayStatus');if(!el)return;try{const r=await fetch('/api/razorpay/config',{cache:'no-store'}),j=await r.json();el.textContent=j.configured?`Razorpay ready • ${String(j.mode||'').toUpperCase()} mode`:'Razorpay test credentials are not configured yet.'}catch{el.textContent='Unable to verify Razorpay configuration.'}}
let checkoutPromise=null;function loadCheckout(){if(window.Razorpay)return Promise.resolve();if(checkoutPromise)return checkoutPromise;checkoutPromise=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://checkout.razorpay.com/v1/checkout.js';s.async=true;s.onload=ok;s.onerror=()=>no(new Error('Unable to load Razorpay Checkout'));document.head.appendChild(s)});return checkoutPromise}
async function jfetch(url,opts={}){const r=await fetch(url,opts),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||j.message||`HTTP ${r.status}`);return j}
async function checkout(order,prefill,meta){await loadCheckout();return new Promise((resolve,reject)=>{let done=false;const finish=(fn,v)=>{if(done)return;done=true;fn(v)};const rz=new Razorpay({key:order.keyId,amount:order.amount,currency:order.currency||'INR',name:'DBest',description:'DBest Membership',order_id:order.orderId,prefill,handler:async r=>{try{finish(resolve,await jfetch('/api/razorpay/verify-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...r,...meta})}))}catch(e){finish(reject,e)}},modal:{ondismiss:()=>finish(reject,new Error('Payment cancelled'))}});rz.on('payment.failed',r=>finish(reject,new Error(r?.error?.description||'Payment failed')));rz.open()})}
function localUsers(){try{return JSON.parse(localStorage.getItem('d2_users')||'[]')}catch{return[]}}
function localTx(){try{return JSON.parse(localStorage.getItem('d2_txs')||'[]')}catch{return[]}}
function ids(tier,users){const n=1000+users.length+Math.floor(Math.random()*90),isP=tier!=='guest';return{id:(isP?'PR':'CU')+n,ref:isP?'DB'+n:''}}
async function welcome(u){try{await fetch('/api/membership/welcome-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:u.name,email:u.email,memberId:u.id,tier:TIERS[u.tier].name,referralCode:u.ref||'',profileUrl:location.origin+'/'})})}catch{}}
async function pay(e,tier){e.preventDefault();const p=read(SOCIAL,null),t=TIERS[tier],form=e.target,btn=form.querySelector('button[type="submit"]');if(!p?.email||!p?.id)return choose(tier,'Please sign in again.');const fd=new FormData(form),mobile=String(fd.get('mobile')||'').replace(/\D/g,''),ref=String(fd.get('referral')||'').trim().toUpperCase();if(!/^\d{10}$/.test(mobile))return alert('Enter a valid 10-digit mobile number');let users=localUsers();if(users.some(u=>String(u.email||'').toLowerCase()===p.email.toLowerCase()))return alert('This email is already registered');if(users.some(u=>String(u.mobile||'').replace(/\D/g,'')===mobile))return alert('This mobile number is already registered');if(ref&&!users.some(u=>String(u.ref||'').toUpperCase()===ref))return alert('Referral code not found');btn.disabled=true;btn.textContent='Opening Razorpay…';try{const dbestRef='JOIN_'+Date.now().toString(36).toUpperCase();const order=await jfetch('/api/razorpay/create-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'membership',tier,dbestRef,section:'Membership',sub:t.name,userId:p.id})});if(Number(order.amount)!==Math.round(t.price*100))throw new Error('Membership amount mismatch. Payment stopped.');const v=await checkout(order,{name:p.name,email:p.email,contact:mobile},{dbestRef,kind:'membership',tier,socialUserId:p.id});if(!v.verified)throw new Error('Payment verification failed');const n=ids(tier,users),now=new Date(),u={id:n.id,name:p.name,mobile,email:p.email,tier,ref:n.ref,upline:ref,status:'Active',kyc:'Payout KYC Incomplete',card:true,photo:p.avatar||'',paymentStatus:'Approved',paidAmount:Number(v.amount||order.amount||0)/100,paymentRef:String(v.paymentId||''),paymentDate:now.toISOString().slice(0,10),paymentApprovedBy:'Razorpay Auto Verification',razorpayOrderId:String(v.orderId||order.orderId||''),razorpayPaymentId:String(v.paymentId||''),socialProvider:p.provider||'',socialUserId:p.id,payoutProfileStatus:'Incomplete',payoutEnabled:false};users.push(u);localStorage.setItem('d2_users',JSON.stringify(users));localStorage.setItem('d2_session',JSON.stringify({role:tier,id:u.id}));const txs=localTx();txs.unshift({id:'TX'+Date.now().toString().slice(-9),userId:u.id,user:u.name,section:'Membership',sub:t.name,amount:u.paidAmount,status:'Razorpay Verified / Membership Active',partner:'Razorpay',created:now.toLocaleString('en-IN'),paymentRef:u.paymentRef});localStorage.setItem('d2_txs',JSON.stringify(txs));drop(PENDING);drop(SOCIAL);welcome(u);success(u)}catch(err){alert(String(err?.message||err||'Payment failed'))}finally{btn.disabled=false;btn.textContent=`Pay ₹${t.price.toLocaleString('en-IN')} & Activate`}}
function success(u){const t=TIERS[u.tier];render(`${header('Welcome to DBest','Payment verified. Your membership is active.',3)}<div class="body"><div class="success"><div class="tick">✓</div><h2>${esc(u.name)}, you’re active!</h2><div class="grid"><div><small>Member ID</small><b>${esc(u.id)}</b></div><div><small>Payment</small><b>Razorpay Verified</b></div><div><small>Membership</small><b>${esc(t.name)} Active</b></div><div><small>Payout Profile</small><b>Incomplete</b></div></div><div class="warn"><b>Complete payout details later</b><br><small>Add Aadhaar/PAN and bank proof from My Profile → Payout & KYC. Platform access is active; only payouts remain on hold until verification.</small></div><button class="primary" onclick="location.href='/'">Continue to DBest</button></div></div>`)}
async function resume(){const hash=new URLSearchParams(location.hash.replace(/^#/,''));let pending=read(PENDING,null);if(!pending&&TIERS[initialTier]&&['google','facebook'].includes(initialProvider))pending={tier:initialTier,provider:initialProvider,ref:initialRef,at:Date.now()};const err=hash.get('error_description')||hash.get('error')||qs.get('error_description')||qs.get('error');if(err&&pending){write(PENDING,pending);history.replaceState({},'',location.pathname+(pending.ref?`?ref=${encodeURIComponent(pending.ref)}`:''));return choose(pending.tier,err)}const token=hash.get('access_token');if(token&&pending){write(PENDING,pending);try{const p=await socialUser(token);history.replaceState({},'',location.pathname+(pending.ref?`?ref=${encodeURIComponent(pending.ref)}`:''));return detail(pending.tier,p)}catch(e){return choose(pending.tier,String(e.message||e))}}if((initialTier||initialProvider)&&pending){return choose(pending.tier,'Login return did not contain a valid session. Please tap your social login once more.')}plans()}
window.choose=choose;window.social=social;window.plans=plans;window.pay=pay;resume();
})();
</script>
</body>
</html>
