<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Join DBest</title>
<meta name="robots" content="noindex">
<style>
:root{--p:#165dff;--p2:#715cff;--ink:#15213b;--muted:#6f7a90;--line:#e4e9f2;--bg:#f5f7fb;--ok:#148b4d}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink)}button,input{font:inherit}.page{min-height:100dvh;padding:18px 12px 34px}.shell{max-width:920px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 24px 70px rgba(26,49,100,.12)}.hero{padding:24px;background:radial-gradient(circle at 92% 0,#ffffff33,transparent 27%),linear-gradient(135deg,#102754,#175dff 60%,#725cff);color:#fff}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand img{width:145px;height:48px;object-fit:contain;object-position:left center;filter:drop-shadow(0 5px 12px rgba(0,0,0,.13))}.back{border:1px solid #ffffff42;background:#ffffff14;color:#fff;border-radius:12px;padding:9px 11px;font-weight:800}.hero h1{margin:14px 0 6px;font-size:30px;line-height:1.08}.hero p{margin:0;color:#eaf0ff;line-height:1.5}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:18px}.step{font-size:11px;font-weight:800;padding:8px;border:1px solid #ffffff35;border-radius:999px;text-align:center;background:#ffffff10}.step.on{background:#fff;color:#195bff}.body{padding:22px}.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.plan{border:1px solid var(--line);border-radius:20px;padding:17px;background:#fff;box-shadow:0 9px 25px rgba(30,54,100,.05)}.plan .emoji{font-size:25px}.plan h3{margin:9px 0 3px;font-size:18px}.price{font-size:25px;font-weight:900;color:var(--p)}.plan small{display:block;color:var(--muted);line-height:1.4;min-height:38px}.plan button,.primary{width:100%;border:0;border-radius:13px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:900;padding:12px 14px;margin-top:13px;box-shadow:0 10px 22px rgba(38,80,210,.18)}.card{max-width:620px;margin:auto;border:1px solid var(--line);border-radius:20px;padding:18px;background:#fff}.summary{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 14px;border-radius:15px;background:#eef4ff;border:1px solid #dae6ff}.summary b{display:block}.summary small{color:var(--muted)}.summary .amt{font-size:23px;font-weight:900;color:var(--p)}.socials{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px}.social{height:53px;border:1px solid #dfe5ef;border-radius:14px;background:#fff;font-weight:900}.social.fb{background:#1877f2;color:#fff;border-color:#1877f2}.note{margin-top:14px;padding:12px 13px;border-radius:14px;background:#f5f7fb;color:#5f6c82;font-size:12px;line-height:1.5}.user{display:flex;align-items:center;gap:12px;margin-bottom:15px;padding:12px;border:1px solid var(--line);border-radius:15px}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#edf3ff;display:grid;place-items:center;font-weight:900;color:var(--p)}.user b{display:block}.user small{color:var(--muted)}.field{margin-top:12px}.field label{display:block;font-size:12px;font-weight:800;color:#4c5870;margin-bottom:6px}.field input{width:100%;height:50px;border:1px solid #dfe5ef;border-radius:13px;padding:0 14px;outline:none;font-size:16px}.field input:focus{border-color:#7f9eff;box-shadow:0 0 0 4px #eef3ff}.link{border:0;background:transparent;color:var(--p);font-weight:800;padding:10px}.center{text-align:center}.status{margin-top:12px;padding:10px 12px;border-radius:12px;background:#f7f9fd;font-size:12px;color:#637087}.success{text-align:center;max-width:620px;margin:auto}.tick{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:auto;background:#e9f9f0;color:var(--ok);font-size:36px;font-weight:900}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.grid2>div{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left}.grid2 small{display:block;color:var(--muted)}.grid2 b{display:block;margin-top:3px}.warn{padding:13px;border-radius:14px;background:#fff8e9;border:1px solid #efdfa9;text-align:left;margin:13px 0}.err{padding:11px 12px;border-radius:12px;background:#fff1f1;color:#a12c2c;border:1px solid #f2cece;margin-top:12px;font-size:12px}.hidden{display:none!important}
@media(max-width:760px){.page{padding:8px 6px 24px}.shell{border-radius:20px}.hero{padding:18px 15px}.hero h1{font-size:25px}.body{padding:15px}.plans{grid-template-columns:1fr 1fr}.socials{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}.step{font-size:10px}}
@media(max-width:430px){.plans{grid-template-columns:1fr}.plan small{min-height:0}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="page"><div class="shell"><div id="app"></div></div></div>
<script>
(()=>{
'use strict';
const SUPA_URL='https://ydedmotbacnllkijzmvp.supabase.co';
const SUPA_KEY='sb_publishable_qWqQExdtL5ddWcK_yLCcNA__-ZUBtox';
const PENDING='dbest_join_standalone_pending_v1';
const SOCIAL='dbest_join_standalone_social_v1';
const TIERS={leader:{name:'Leader',price:999,badge:'👑',note:'Build and lead your DBest network.'},prime:{name:'Prime',price:599,badge:'⭐',note:'Enhanced member benefits and earning opportunity.'},promoter:{name:'Promoter',price:299,badge:'🚀',note:'Start promoting DBest services and earning.'},guest:{name:'Guest User',price:49,badge:'✨',note:'Use DBest services as a registered user.'}};
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=new URLSearchParams(location.search);const initialRef=String(q.get('ref')||'').trim().toUpperCase();
const get=(k,d=null)=>{try{return JSON.parse(sessionStorage.getItem(k)||'null')||d}catch{return d}};const set=(k,v)=>sessionStorage.setItem(k,JSON.stringify(v));const del=k=>sessionStorage.removeItem(k);
function header(title,sub,step){return `<div class="hero"><div class="brand"><img src="/dbest-logo.png" alt="DBest"><button class="back" onclick="location.href='/'">← DBest Home</button></div><h1>${esc(title)}</h1><p>${esc(sub)}</p><div class="steps">${['Choose Plan','Secure Login','Payment','Active'].map((x,i)=>`<div class="step ${i<=step?'on':''}">${i+1}. ${x}</div>`).join('')}</div></div>`}
function render(inner){app.innerHTML=inner}
function plans(){render(`${header('Join DBest in under a minute','No long form. Choose a plan, sign in securely and pay with Razorpay.',0)}<div class="body"><div class="plans">${Object.entries(TIERS).map(([k,t])=>`<div class="plan"><div class="emoji">${t.badge}</div><h3>${t.name}</h3><div class="price">₹${t.price.toLocaleString('en-IN')}</div><small>${t.note}</small><button onclick="choose('${k}')">Choose ${t.name}</button></div>`).join('')}</div>${initialRef?`<div class="note">Referral detected: <b>${esc(initialRef)}</b>. It will be applied automatically.</div>`:''}<div class="center"><button class="link" onclick="location.href='/?dbestLogin=1'">Already a member? Login</button></div></div>`)}
function choose(tier){const t=TIERS[tier];if(!t)return plans();render(`${header('Secure sign-in','Use Google or Facebook. DBest only reads the basic profile needed to set up membership.',1)}<div class="body"><div class="card"><div class="summary"><div><b>${t.badge} ${t.name}</b><small>Membership selected</small></div><div class="amt">₹${t.price.toLocaleString('en-IN')}</div></div><div class="socials"><button class="social" onclick="social('google','${tier}')">G &nbsp; Continue with Google</button><button class="social fb" onclick="social('facebook','${tier}')">f &nbsp; Continue with Facebook</button></div><div class="note">Referral code is optional. Aadhaar, PAN, bank details, UTR and payment screenshots are <b>not required to join</b>.</div><div id="oauthErr"></div><div class="center"><button class="link" onclick="plans()">← Change plan</button></div></div></div>`)}
function social(provider,tier){const ref=initialRef||get(PENDING,{})?.ref||'';set(PENDING,{provider,tier,ref,at:Date.now()});const redirect=location.origin+'/join.html'+(ref?`?ref=${encodeURIComponent(ref)}`:'');location.href=`${SUPA_URL}/auth/v1/authorize?provider=${encodeURIComponent(provider)}&redirect_to=${encodeURIComponent(redirect)}`}
async function socialUser(token){const r=await fetch(`${SUPA_URL}/auth/v1/user`,{headers:{apikey:SUPA_KEY,Authorization:`Bearer ${token}`}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||j.error_description||'Unable to read social profile');const md=j.user_metadata||{},am=j.app_metadata||{};return{id:String(j.id||''),email:String(j.email||''),name:String(md.full_name||md.name||j.email||'DBest User'),avatar:String(md.avatar_url||md.picture||''),provider:String(am.provider||'')}}
function detail(tier,p){const t=TIERS[tier],pending=get(PENDING,{})||{},ref=pending.ref||initialRef;set(SOCIAL,p);render(`${header('Almost done','Just add your mobile number. Referral code is optional.',1)}<div class="body"><div class="card"><div class="user">${p.avatar?`<img class="avatar" src="${esc(p.avatar)}" alt="Profile">`:`<div class="avatar">${esc((p.name||'D')[0])}</div>`}<div><b>${esc(p.name)}</b><small>${esc(p.email)} • ${esc(p.provider||pending.provider||'Social login')}</small></div></div><form onsubmit="pay(event,'${tier}')"><div class="field"><label>Mobile number</label><input name="mobile" inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="10-digit mobile number" required></div><div class="field"><label>Referral code <span style="font-weight:600;color:#8a93a3">(optional)</span></label><input name="referral" value="${esc(ref)}" placeholder="e.g. DB3001" style="text-transform:uppercase"></div><div class="summary" style="margin-top:14px"><div><b>${t.badge} ${t.name}</b><small>Razorpay secure payment</small></div><div class="amt">₹${t.price.toLocaleString('en-IN')}</div></div><div id="gatewayStatus" class="status">Checking Razorpay…</div><button class="primary" type="submit">Pay ₹${t.price.toLocaleString('en-IN')} & Activate</button><div class="note">Membership activates automatically only after DBest verifies the Razorpay payment on the server. No Owner approval.</div></form></div></div>`);checkGateway()}
async function checkGateway(){const el=document.getElementById('gatewayStatus');if(!el)return;try{const r=await fetch('/api/razorpay/config',{cache:'no-store'}),j=await r.json();el.textContent=j.configured?`Razorpay ready • ${String(j.mode||'').toUpperCase()} mode`:'Razorpay test credentials are not configured yet.'}catch{el.textContent='Unable to verify Razorpay configuration.'}}
let checkoutPromise=null;function loadCheckout(){if(window.Razorpay)return Promise.resolve();if(checkoutPromise)return checkoutPromise;checkoutPromise=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://checkout.razorpay.com/v1/checkout.js';s.async=true;s.onload=ok;s.onerror=()=>no(new Error('Unable to load Razorpay Checkout'));document.head.appendChild(s)});return checkoutPromise}
async function jfetch(url,opts={}){const r=await fetch(url,opts),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||j.message||`HTTP ${r.status}`);return j}
async function checkout(order,prefill,meta){await loadCheckout();return new Promise((resolve,reject)=>{let done=false;const finish=(fn,v)=>{if(done)return;done=true;fn(v)};const rz=new Razorpay({key:order.keyId,amount:order.amount,currency:order.currency||'INR',name:'DBest',description:'DBest Membership',order_id:order.orderId,prefill,handler:async r=>{try{const v=await jfetch('/api/razorpay/verify-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...r,...meta})});finish(resolve,v)}catch(e){finish(reject,e)}},modal:{ondismiss:()=>finish(reject,new Error('Payment cancelled'))}});rz.on('payment.failed',r=>finish(reject,new Error(r?.error?.description||'Payment failed')));rz.open()})}
function localUsers(){try{return JSON.parse(localStorage.getItem('d2_users')||'[]')}catch{return[]}}function localTx(){try{return JSON.parse(localStorage.getItem('d2_txs')||'[]')}catch{return[]}}
function ids(tier,users){const isP=tier!=='guest',n=1000+users.length+Math.floor(Math.random()*90);return{id:(isP?'PR':'CU')+n,ref:isP?'DB'+n:''}}
async function welcome(u){try{await fetch('/api/membership/welcome-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:u.name,email:u.email,memberId:u.id,tier:TIERS[u.tier].name,referralCode:u.ref||'',profileUrl:location.origin+'/'})})}catch{}}
async function pay(e,tier){e.preventDefault();const form=e.target,btn=form.querySelector('button[type="submit"]'),p=get(SOCIAL,null),t=TIERS[tier];if(!p?.email||!p?.id)return choose(tier);const fd=new FormData(form),mobile=String(fd.get('mobile')||'').replace(/\D/g,''),ref=String(fd.get('referral')||'').trim().toUpperCase();if(!/^\d{10}$/.test(mobile))return alert('Enter a valid 10-digit mobile number');let users=localUsers();if(users.some(u=>String(u.email||'').toLowerCase()===p.email.toLowerCase()))return alert('This email is already registered');if(users.some(u=>String(u.mobile||'').replace(/\D/g,'')===mobile))return alert('This mobile number is already registered');if(ref&&!users.some(u=>String(u.ref||'').toUpperCase()===ref))return alert('Referral code not found');btn.disabled=true;btn.textContent='Opening Razorpay…';const dbestRef='JOIN_'+Date.now().toString(36).toUpperCase();try{const order=await jfetch('/api/razorpay/create-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'membership',tier,dbestRef,section:'Membership',sub:t.name,userId:p.id})});if(Number(order.amount)!==Math.round(t.price*100))throw new Error('Membership amount mismatch. Payment stopped for safety.');const v=await checkout(order,{name:p.name,email:p.email,contact:mobile},{dbestRef,kind:'membership',tier,socialUserId:p.id});if(!v.verified)throw new Error('Payment verification failed');const n=ids(tier,users),now=new Date(),u={id:n.id,name:p.name,mobile,email:p.email,city:'',tier,ref:n.ref,upline:ref,status:'Active',kyc:'Payout KYC Incomplete',card:true,photo:p.avatar||'',pan:'',aad:'',bank:'',ifsc:'',paymentStatus:'Approved',paidAmount:Number(v.amount||order.amount||0)/100,paymentRef:String(v.paymentId||''),paymentDate:now.toISOString().slice(0,10),paymentApprovedBy:'Razorpay Auto Verification',paymentApprovedAt:now.toLocaleString('en-IN'),razorpayOrderId:String(v.orderId||order.orderId||''),razorpayPaymentId:String(v.paymentId||''),socialProvider:p.provider||'',socialUserId:p.id,payoutProfileStatus:'Incomplete',payoutEnabled:false,welcomeMailStatus:'Queued'};users.push(u);localStorage.setItem('d2_users',JSON.stringify(users));localStorage.setItem('d2_session',JSON.stringify({role:tier,id:u.id}));const txs=localTx();txs.unshift({id:'TX'+Date.now().toString().slice(-9),userId:u.id,user:u.name,section:'Membership',sub:t.name,amount:u.paidAmount,status:'Razorpay Verified / Membership Active',partner:'Razorpay',created:now.toLocaleString('en-IN'),createdISO:now.toISOString(),paymentRef:u.paymentRef,razorpayOrderId:u.razorpayOrderId,razorpayPaymentId:u.razorpayPaymentId,paymentStage:'Razorpay Verified'});localStorage.setItem('d2_txs',JSON.stringify(txs));del(PENDING);del(SOCIAL);welcome(u);success(u)}catch(err){alert(String(err?.message||err||'Payment failed'))}finally{btn.disabled=false;btn.textContent=`Pay ₹${t.price.toLocaleString('en-IN')} & Activate`}}
function success(u){const t=TIERS[u.tier];render(`${header('Welcome to DBest','Payment verified. Your membership is active immediately.',3)}<div class="body"><div class="success"><div class="tick">✓</div><h2>${esc(u.name)}, you’re active!</h2><p style="color:#6b7589">Your ${esc(t.name)} membership is ready to use.</p><div class="grid2"><div><small>Member ID</small><b>${esc(u.id)}</b></div><div><small>Payment</small><b>Razorpay Verified</b></div><div><small>Membership</small><b>Active</b></div><div><small>Payout Profile</small><b>Incomplete</b></div></div><div class="warn"><b>Complete payout details later</b><br><small>Add Aadhaar/PAN and bank proof from My Profile → Payout & KYC. Your DBest access is active now; only payouts remain on hold until verification.</small></div><button class="primary" onclick="location.href='/'">Continue to DBest</button></div></div>`)}
async function resume(){const hash=new URLSearchParams(location.hash.replace(/^#/,'')),qs=new URLSearchParams(location.search),pending=get(PENDING,null),err=hash.get('error_description')||hash.get('error')||qs.get('error_description')||qs.get('error');if(err&&pending){history.replaceState({},'',location.pathname+(pending.ref?`?ref=${encodeURIComponent(pending.ref)}`:''));choose(pending.tier);setTimeout(()=>{const e=document.getElementById('oauthErr');if(e)e.innerHTML=`<div class="err">${esc(err)}</div>`},0);return}const token=hash.get('access_token');if(token&&pending){try{const p=await socialUser(token);history.replaceState({},'',location.pathname+(pending.ref?`?ref=${encodeURIComponent(pending.ref)}`:''));detail(pending.tier,p)}catch(e){choose(pending.tier);setTimeout(()=>{const x=document.getElementById('oauthErr');if(x)x.innerHTML=`<div class="err">${esc(e.message||e)}</div>`},0)}return}plans()}
window.choose=choose;window.social=social;window.plans=plans;window.pay=pay;resume();
})();
</script>
</body>
</html>
