<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset DBest Marketplace Cart</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Arial;background:#f4f7fb;color:#13213a;margin:0;padding:24px}.card{max-width:560px;margin:40px auto;background:#fff;border:1px solid #dfe6ef;border-radius:20px;padding:22px;box-shadow:0 14px 36px #17355d14}h2{margin-top:0}.ok{color:#15803d;font-weight:800}.note{color:#687386;line-height:1.5}.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;background:#175cff;color:#fff;font-weight:800;font-size:16px;margin-top:18px}</style></head><body><div class="card"><h2>DBest Marketplace Cart Reset</h2><p id="status" class="note">Clearing Marketplace carts…</p><button id="go" class="btn" style="display:none">Open Clean Preview</button></div><script>(function(){try{localStorage.setItem('d2_grocery_cart','[]');localStorage.setItem('d2_commerce_carts',JSON.stringify({grocery:[],restaurant:[],digital:[],medicine:[]}));['dbest_master_market_cart','dbest_marketplace_cart','dbest_master_cart'].forEach(k=>localStorage.removeItem(k));document.getElementById('status').innerHTML='<span class="ok">Cart cleared successfully.</span><br><br>Grocery, Restaurants, Digital and Medicine carts are now reset to zero. Your login/session has not been removed.';const b=document.getElementById('go');b.style.display='block';b.onclick=function(){location.href='/?v=20260911-clean-cart-test-v1'}}catch(e){document.getElementById('status').textContent='Could not clear cart: '+String(e&&e.message||e)}})();</script></body></html>
