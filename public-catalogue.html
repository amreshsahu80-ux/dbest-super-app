<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBest Public Master Catalogue</title><style>body{font:15px system-ui;margin:0;background:#f5f7fb;color:#182b46}header{background:#174181;color:white;padding:18px}main{max-width:1150px;margin:auto;padding:16px}.note{background:#fff2d8;padding:12px;border-radius:8px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}select,input,button{font:inherit;padding:11px;border:1px solid #c4ccda;border-radius:8px}input{flex:1;min-width:150px}button{background:#174181;color:white;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.card{background:white;border:1px solid #e0e6ef;border-radius:10px;overflow:hidden}.card img{width:100%;aspect-ratio:1;object-fit:contain}.card section{padding:10px}.name{font-weight:700}.meta{font-size:12px;color:#66768c;margin-top:6px}.state{font-size:12px;background:#e9f0f9;padding:5px;border-radius:5px;margin-top:8px}#more{display:block;margin:20px auto}</style></head><body><header><h2>DBest Product Catalogue</h2>Electronics · Grocery · Restaurant · Medicines</header><main><p class="note">Products are publicly browsable. Reference photos may not match exact branded packaging. Vendors will provide prices, stock and offers before purchases become available.</p><div class="filters"><select id="category"><option value="">All categories</option><option>Electronics</option><option>Grocery &amp; FMCG</option><option>Restaurant</option><option>Medicines (OTC)</option></select><input id="search" placeholder="Search product"><button id="go">Search</button></div><p id="status">Loading…</p><div id="grid" class="grid"></div><button id="more" hidden>Show more</button></main><script>
const $=id=>document.getElementById(id);let page=0,total=0;async function load(reset){if(reset){page=0;$('grid').replaceChildren()}const p=new URLSearchParams({page:String(page)});if($('category').value)p.set('category',$('category').value);if($('search').value.trim())p.set('q',$('search').value.trim());$('status').textContent='Loading…';try{const r=await fetch('https://ydedmotbacnllkijzmvp.supabase.co/functions/v1/dbest-public-master-catalogue?'+p);const d=await r.json();if(!d.ok)throw Error(d.error||'Unavailable');total=d.total;for(const x of d.items){const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.loading='lazy';img.src=x.imageUrl;img.alt=x.imageAlt||x.name;const s=document.createElement('section');const n=document.createElement('div');n.className='name';n.textContent=x.name;const m=document.createElement('div');m.className='meta';m.textContent=[x.brand,x.variant,x.category].filter(Boolean).join(' · ');const state=document.createElement('div');state.className='state';state.textContent='Vendor price coming soon';s.append(n,m,state);card.append(img,s);$('grid').append(card)}page++;const shown=$('grid').children.length;$('status').textContent=shown+' of '+total+' products';$('more').hidden=shown>=total}catch(e){$('status').textContent='Error: '+e.message;$('more').hidden=true}}$('go').onclick=()=>load(true);$('category').onchange=()=>load(true);$('search').onkeydown=e=>{if(e.key==='Enter')load(true)};$('more').onclick=()=>load(false);load(true);
</script></body></html>
