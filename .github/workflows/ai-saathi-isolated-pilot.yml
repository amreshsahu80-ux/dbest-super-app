name: AI Saathi isolated pilot tests
on:
  push:
    branches:
      - feat/ai-saathi-isolated-pilot-20261105
    paths:
      - ai-saathi-pilot/**
      - .github/workflows/ai-saathi-isolated-pilot.yml
  pull_request:
    paths:
      - ai-saathi-pilot/**
      - .github/workflows/ai-saathi-isolated-pilot.yml
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-saathi-pilot
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check demo JavaScript syntax
        run: |
          node --check app.js
          node --check api/chat.js
          node --check api/health.js
      - name: Contract tests (no external connections)
        run: node --test tests/chat.test.cjs
