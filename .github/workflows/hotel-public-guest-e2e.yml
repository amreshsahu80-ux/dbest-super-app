name: DBest Public Hotel Guest End-to-End Smoke
on:
  push:
    branches:
      - feat/hotel-rate-compare-isolated-20261027
    paths:
      - '.github/workflows/hotel-public-guest-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-public-guest-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify guest page and real public quote API respond without Vercel login
        run: |
          node - <<'NODE'
          const origin='https://dbest-hotel-guest-public-preview-ncgbvucbb-db-est.vercel.app';
          (async()=>{
           const page=await fetch(origin+'/',{signal:AbortSignal.timeout(12000)});
           const html=await page.text();
           console.log('GUEST_PAGE',JSON.stringify({status:page.status,type:page.headers.get('content-type'),
             hasSearch:html.includes('Search hotels'),hasDbest:html.includes('DBest Special Rate')}));
           if(!page.ok||!html.includes('Search hotels'))process.exitCode=1;
           for(const path of ['/api/hotel-coverage','/api/hotel-fx']){
            const r=await fetch(origin+path,{signal:AbortSignal.timeout(12000)});
            const raw=await r.text();let data;
            try{data=JSON.parse(raw)}catch{data={notJson:true,prefix:raw.slice(0,75)}}
            console.log('GUEST_API',JSON.stringify({path,http:r.status,type:r.headers.get('content-type'),
             status:data.status,count:data.count,base:data.base,date:data.date,rate:data.rates?.INR,notJson:data.notJson}));
            if(!r.ok||!r.headers.get('content-type')?.includes('application/json'))process.exitCode=1;
           }
           const url=new URL('/api/hotel-public-google',origin);
           for(const [k,v] of Object.entries({hotelId:'HOTEL-NANDAN-GHY',checkIn:'2026-11-15',checkOut:'2026-11-16',adults:'2',rooms:'1'}))url.searchParams.set(k,v);
           const r=await fetch(url,{signal:AbortSignal.timeout(45000)});
           const raw=await r.text();let data;
           try{data=JSON.parse(raw)}catch{data={notJson:true,prefix:raw.slice(0,100)}}
           console.log('GUEST_OTA_E2E',JSON.stringify({http:r.status,type:r.headers.get('content-type'),
             status:data.status,live:data.live,stay:data.stay,providers:data.providers?.map(p=>({provider:p.provider,
             price:p.pricePerNight,currency:p.currency})),notJson:data.notJson,preview:data.prefix}));
           if(!r.ok||!data.live||!Array.isArray(data.providers)||data.providers.length===0)process.exitCode=1;
          })().catch(e=>{console.error('GUEST_E2E_FAILED',String(e));process.exitCode=1});
          NODE

      - name: Install browser for real mobile-size UI check
        run: |
          mkdir -p .hotel-guest-browser-test
          echo '{"name":"dbest-guest-mobile-smoke","private":true,"version":"1.0.0"}' > .hotel-guest-browser-test/package.json
          npm install --prefix .hotel-guest-browser-test --no-save --no-audit --no-fund @sparticuz/chromium@153.0.0 puppeteer-core@25.16.0
          test -f .hotel-guest-browser-test/node_modules/@sparticuz/chromium/package.json
      - name: Verify hotel card renders actual OTA quote and difference for selected stay
        run: |
          node - <<'NODE'
          const localRequire=require('node:module').createRequire(require('node:path').resolve('.hotel-guest-browser-test/package.json'));
          const puppeteer=localRequire('puppeteer-core');
          const chromiumModule=localRequire('@sparticuz/chromium');
          const chromium=chromiumModule.default||chromiumModule;
          (async()=>{
           const browser=await puppeteer.launch({
             executablePath:await chromium.executablePath(),
             args:[...chromium.args,'--disable-http2','--disable-dev-shm-usage'],headless:true
           });
           try{
            const page=await browser.newPage();
            await page.setViewport({width:390,height:844,isMobile:true});
            const failed=[];
            page.on('pageerror',err=>failed.push(String(err.message).slice(0,140)));
            const u='https://dbest-hotel-guest-public-preview-ncgbvucbb-db-est.vercel.app/';
            const res=await page.goto(u,{waitUntil:'domcontentloaded',timeout:23000});
            if(!res||res.status()!==200)throw Error('GUEST_PAGE_NOT_200');
            await page.evaluate(()=>{
              document.querySelector('#destination').value='Hotel Nandan';
              document.querySelector('#checkIn').value='2026-11-15';
              document.querySelector('#checkOut').value='2026-11-16';
              document.querySelector('#guests').value='2:1';
              document.querySelector('#searchForm').requestSubmit();
            });
            try{
              await page.waitForFunction(()=>{
                const v=document.querySelector('#results')?.innerText||'';
                return v.includes('Hotel Nandan')&&v.includes('US$')&&
                  (v.includes('OTA lower')||v.includes('DBest lower')||v.includes('Same displayed nightly'));
              },{timeout:55000,polling:500});
            }catch(e){
              const v=await page.$eval('#results',n=>n.innerText);
              console.error('GUEST_MOBILE_CARD_UNVERIFIED',JSON.stringify({
                snippet:v.slice(0,1350),pageErrors:failed
              }));
              throw e;
            }
            const card=await page.$eval('.hotel',n=>({
              title:n.querySelector('h3')?.innerText,
              photoLoaded:!!n.querySelector('img')?.naturalWidth,
              details:n.innerText.slice(0,1150)
            }));
            console.log('GUEST_MOBILE_CARD_VERIFIED',JSON.stringify({
              title:card.title,photoLoaded:card.photoLoaded,
              containsDBest:card.details.includes('₹4,961.25'),
              hasRealUSD:card.details.includes('US$'),
              differenceShown:/OTA lower|DBest lower|Same displayed nightly/.test(card.details),
              excerpt:card.details.slice(-800),pageErrors:failed
            }));
            if(card.title!=='Hotel Nandan'||!card.details.includes('₹4,961.25')||
              !card.details.includes('US$')||
              !/OTA lower|DBest lower|Same displayed nightly/.test(card.details))throw Error('MOBILE_HOTEL_COMPARISON_FAILED');
           }finally{await browser.close()}
          })().catch(e=>{console.error('GUEST_MOBILE_E2E_FAILED',String(e));process.exitCode=1});
          NODE
