name: Partner Home role-switch safety
on:
  pull_request:
    paths:
      - 'partner-android-app/tests/test_home_role_switch_safety.py'
      - 'partner-android-app/app/src/main/java/com/dbest4u/partner/MainActivity.java'
      - '.github/workflows/partner-home-role-switch-safety.yml'
  workflow_dispatch:
jobs:
  role-switch-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Partner Home role-switch isolation
        run: python3 partner-android-app/tests/test_home_role_switch_safety.py
