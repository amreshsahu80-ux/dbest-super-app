name: Home Jobs Payment State Isolation - Narrow QA
on:
  push:
    branches: [fix/homejobs-payment-status-isolation-20261020]
  pull_request:
    branches: [feat/homejobs-customer-dashboard-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  payment-state-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze existing services and production source
        shell: bash
        run: |
          set -euo pipefail
          LIVE=e5a1bbe0a36ed41d9d7099e55d5f17e5063d8eda
          git merge-base --is-ancestor "$LIVE" HEAD
          while IFS= read -r file; do
            case "$file" in
              qa/homejobs/hyperlocal-job-execution-v9-baseline.ts|qa/homejobs/hyperlocal-job-execution-payment-status-v10.ts|qa/homejobs/payment-status-isolation.test.cjs|.github/workflows/homejobs-payment-status-qa.yml)
                echo "Isolated Home Jobs backend candidate: $file";;
              *) echo "::error::Frozen section or service changed: $file";exit 1;;
            esac
          done < <(git diff --name-only "$LIVE" HEAD)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020f4
        with:
          node-version: '24'
      - name: Install test-only TypeScript compiler
        run: npm install --no-save --ignore-scripts --package-lock=false esbuild@0.25.12
      - name: Prove job acceptance, execution, invoicing and payment truth are isolated
        run: node --test qa/homejobs/payment-status-isolation.test.cjs
