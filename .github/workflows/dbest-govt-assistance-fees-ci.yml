name: DBest Government Service Fees - Isolated Regression
on:
  push:
    branches: [fix/govt-fixed-pricing-and-intake-20261020]
  pull_request:
    branches: [release/member-referral-reliable-mount-live-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  govt-fees:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Protect every unrelated frozen app file
        shell: bash
        run: |
          set -euo pipefail
          GOLDEN=c99ddceb8f8dedf72575636d451a34bd6945939d
          git merge-base --is-ancestor "$GOLDEN" HEAD
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              index.html|service-variable-pricing-v1.js|govt-assistance-fees-v1.js|tests/govt-assistance-fees-contract.cjs|tests/govt-fees-live-shell-mobile.cjs|.github/workflows/dbest-govt-assistance-fees-ci.yml)
              echo "Government fees only: $f";;
              *) echo "::error::Frozen source touched: $f";exit 1;;
            esac
          done < <(git diff --name-only "$GOLDEN" HEAD)
          if git diff "$GOLDEN" HEAD -- index.html | grep '^+' | grep -v '^+++' | grep -v "govt-assistance-fees-v1.js"; then
            echo "::error::Unexpected shell changes"; exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020f4
        with:
          node-version: '24'
      - name: Isolated Node fee, field, override and frozen-regression contracts
        run: |
          node --check govt-assistance-fees-v1.js
          node --check service-variable-pricing-v1.js
          node --test tests/govt-assistance-fees-contract.cjs
      - name: Install isolated Chromium automation driver (no deploy)
        run: npm install --no-save --ignore-scripts --package-lock=false playwright-core@1.56.1
      - name: Mobile live-shell fixture with backend writes blocked
        run: node tests/govt-fees-live-shell-mobile.cjs
