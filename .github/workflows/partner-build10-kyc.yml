name: Partner Build 10 isolated KYC checks
on:
  push:
    branches:
      - fix/partner-build10-onboarding-release-20261114
  workflow_dispatch:
jobs:
  kyc-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify onboarding scripts
        run: |
          node scripts/test-partner-build10-kyc.cjs
          node scripts/test-partner-build10-kyc-contract.cjs
  android-build10-unsigned:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: partner-android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check release identity
        run: |
          grep -Fq "applicationId 'com.dbest4u.partner'" app/build.gradle
          grep -Fq 'versionCode 10' app/build.gradle
          grep -Fq "versionName '1.0.6'" app/build.gradle
      - name: Compile isolated unsigned candidate
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon
      - name: Validate release bundle and launcher reference
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          grep -Fq 'android:icon="@drawable/dbest_brand"' app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable-nodpi/dbest_brand.png
          file app/src/main/res/drawable-nodpi/dbest_brand.png | grep -q 'PNG image data'
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab >/dev/null 2>&1 && echo 'Bundle is signed' || echo 'Unsigned bundle: private signing required before Play upload'
      - name: Keep unsigned candidate private
        uses: actions/upload-artifact@v4
        with:
          name: partner-build10-unsigned-aab-and-apk
          path: |
            partner-android-app/app/build/outputs/bundle/release/*.aab
            partner-android-app/app/build/outputs/apk/release/*.apk
          retention-days: 1
