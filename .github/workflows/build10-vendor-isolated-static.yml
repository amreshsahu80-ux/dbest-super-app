name: Build 10 Vendor isolated static checks
on:
  push:
    branches:
      - fix/build10-standalone-vendor-kyc-20261117
    paths:
      - 'vendor.html'
      - 'partner-kyc-registration-upload-v2.js'
      - 'tests/marketplace-vendor-visibility-fixture.cjs'
      - 'scripts/test-build10-vendor-*.cjs'
      - '.github/workflows/build10-vendor-isolated-static.yml'
  workflow_dispatch:
  pull_request:
    branches:
      - fix/partner-build10-onboarding-release-20261114
    paths:
      - 'vendor.html'
      - 'partner-kyc-registration-upload-v2.js'
      - 'scripts/test-build10-vendor-*.cjs'
      - 'tests/marketplace-vendor-visibility-fixture.cjs'
jobs:
  vendor-static:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Vendor camera and KYC static contract
        run: node scripts/test-build10-vendor-camera-static.cjs
      - name: Verify Vendor categories and GPS static contract
        run: node scripts/test-build10-vendor-category-gps-static.cjs
      - name: Verify authenticated KYC upload persistence and fail-closed behavior offline
        run: node scripts/test-build10-vendor-kyc-runtime.cjs

      - name: Verify marketplace category and GPS exclusion fixture offline
        run: node tests/marketplace-vendor-visibility-fixture.cjs
