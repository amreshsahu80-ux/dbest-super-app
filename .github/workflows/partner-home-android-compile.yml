name: Partner home isolated Android compile
on:
  push:
    branches:
      - feat/partner-home-compact-ui-20261115
  pull_request:
    branches:
      - release/partner-build10-isolated-20261114
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: partner-android-app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify Partner identity and compact controls
        run: |
          grep -Fq "applicationId 'com.dbest4u.partner'" app/build.gradle
          grep -Fq 'versionCode 10' app/build.gradle
          grep -Fq 'Gravity.BOTTOM|Gravity.LEFT' app/src/main/java/com/dbest4u/partner/PartnerPushTestController.java
          grep -Fq 'Partner notifications off. Tap for settings' app/src/main/java/com/dbest4u/partner/PartnerPushTestController.java
      - name: Regression-check all three Partner home routes and safe navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('app/src/main/java/com/dbest4u/partner/MainActivity.java').read_text()
          expected={
              'Vendor': ('/Vendor','/partner?type=Vendor'),
              'Vaahak': ('/vaahak','/partner?type=Vaahak'),
              'Service Partner': ('/ServicePartnerDashboard','/partner?type=Service%20Partner'),
          }
          for role,(workspace,join) in expected.items():
              assert f'"{workspace}", "{join}"' in src, f'{role}: route regression'
              assert f'openPortal(title, loginPath)' in src
              assert f'openPortal(title + " · Join", joinPath)' in src
              assert f'Open " + title + " workspace' in src
              assert f'Join as " + title' in src
          assert 'card.setOnClickListener(v -> openPortal(title, loginPath));' in src, 'Role card surface must open workspace'
          assert 'onPageStarted(WebView v, String url, android.graphics.Bitmap favicon)' in src, 'Workspace navigation must show progress'
          assert 'if (showingBrowser && url != null && url.equals(v.getUrl())' in src and '&& browserLoading != null) browserLoading.setVisibility(View.VISIBLE);' in src, 'Progress must be scoped to the active workspace URL and never overlay native home'
          assert 'card.setContentDescription(title + " partner card. Open workspace");' in src, 'Role card needs accessible action label'
          assert 'join.setOnClickListener(v -> openPortal(title + " · Join", joinPath));' in src, 'Join must keep its distinct route'
          assert 'onWorkspaceSelected(canonicalRole)' in src, 'Push role must remain canonical'
          assert 'resetWorkspaceHistoryOnLoad = true;' in src, 'Role switch must reset previous workspace history'
          assert 'if (!showingBrowser || url == null || !url.equals(v.getUrl())) return;' in src, 'Stale page-finished callbacks must not clear new workspace state'
          home = src.split('private void showHome() {', 1)[1].split('\n    }', 1)[0]
          assert 'resetWorkspaceHistoryOnLoad = false;' in home, 'Home must cancel pending role history reset'
          assert 'cancelPendingFileChooser();' in home, 'Home must cancel pending document selection'
          portal=src.split('private void openPortal(String name, String route) {',1)[1].split('\n    }',1)[0]
          assert 'cancelPendingFileChooser();' in portal, 'Role changes must cancel pending document selection'
          assert 'cancelPendingLocationPrompt();' in portal and 'cancelPendingLocationPrompt();' in home, 'Role switch and Home must reject outstanding geolocation prompts'
          assert 'private boolean locationPermissionRequestInFlight;' in src, 'Location permission request needs in-flight reservation'
          prompt=src.split('onGeolocationPermissionsShowPrompt(',1)[1].split('onShowFileChooser(',1)[0]
          assert '|| locationPermissionRequestInFlight' in prompt, 'Second workspace must not claim previous Android permission result'
          assert 'origin == null || !isDbest(Uri.parse(origin))' in prompt, 'Null geolocation origins must be rejected before URI parsing'
          assert 'locationPermissionRequestInFlight = true;' in prompt, 'Permission request must reserve result code'
          permission=src.split('if (code == LOCATION_REQUEST) {',1)[1].split('\n        }',1)[0]
          assert 'locationPermissionRequestInFlight = false;' in permission, 'Permission result must release reservation even after cancellation'
          assert 'if (pending != null && showingBrowser)' in permission, 'Stale result must never grant cancelled workspace'
          assert 'String activeUrl = v.getUrl();' in src and 'activeUrl == null || !isDbest(Uri.parse(activeUrl))' in src, 'File chooser must reject missing or untrusted active URLs without Uri.parse(null)'
          chooser=src.split('private void cancelPendingFileChooser() {',1)[1].split('\n    }',1)[0]
          assert 'fileCallback = null;' in chooser and 'pending.onReceiveValue(null);' in chooser, 'Cancel must clear callback before resolving it'
          # File-picker callbacks must be correlated to their own launch, not a reused request code.
          assert 'activeFileRequestCode = -1;' in src, 'File picker must track an invalidated request'
          assert 'nextFileRequestCode' in src, 'File picker must allocate distinct request codes'
          import re
          request_codes = {name: int(value) for name, value in re.findall(r'private static final int (FILE_REQUEST|FILE_REQUEST_MAX|LOCATION_REQUEST) = (\d+);', src)}
          assert request_codes['FILE_REQUEST'] <= request_codes['FILE_REQUEST_MAX'], 'Invalid picker request-code range'
          assert not request_codes['FILE_REQUEST'] <= request_codes['LOCATION_REQUEST'] <= request_codes['FILE_REQUEST_MAX'], 'File picker request codes must not collide with location permission requests'
          assert 'if (code == activeFileRequestCode && fileCallback != null)' in src, 'Stale picker results must be ignored'
          result_handler=src.split('@Override protected void onActivityResult(',1)[1].split('\n    }',1)[0]
          assert 'activeFileRequestCode = -1;' in result_handler, 'Accepted picker result must invalidate request'
          assert 'pending.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));' in result_handler, 'Accepted picker must deliver result'
          assert 'browserLoading.setVisibility(View.GONE)' in home, 'Home must clear stale loading progress'
          assert 'req.getUrl() != null && req.getUrl().toString().equals(v.getUrl())' in src, 'Late WebView errors must not interrupt a newer workspace'
          assert 'v.clearHistory();' in src and 'resetWorkspaceHistoryOnLoad = false;' in src, 'New workspace must clear old back stack after load'
          assert 'url != null && url.equals(v.getUrl())' in src.split('onPageStarted(WebView v, String url', 1)[1].split('onPageFinished(WebView v, String url', 1)[0], 'Stale page-start must not revive loading indicator'
          assert 'if (!route.startsWith("/") || route.startsWith("//")) return;' in src
          assert 'if (isDbest(url)) return false;' in src
          assert 'if (partnerTestPush != null) partnerTestPush.setHomeVisible(true);' in src
          # Guard compact-device layout and the native notification safe area.
          assert 'page.setPadding(dp(16), dp(8), dp(16), dp(84));' in src, 'Home footer may be obscured'
          assert 'card.addView(photoFrame, new LinearLayout.LayoutParams(-1, dp(84)));' in src, 'Compact role-card photo height regressed'
          assert 'dp(48), 1.5f' in src and 'dp(48), 0.72f' in src, 'Role action proportions regressed'
          assert 'actions.addView(workspace, new LinearLayout.LayoutParams(0, dp(48), 1.5f));' in src
          assert 'actions.addView(join, new LinearLayout.LayoutParams(0, dp(48), 0.72f));' in src
          assert 'brand.addView(privacyMenu, new LinearLayout.LayoutParams(dp(48), dp(48)));' in src, 'Home privacy menu needs 48x48dp touch target'
          assert 'back.setContentDescription("Back");' in src
          # Keep all compact workspace-header controls at accessible 48dp height.
          # Back, Home and Privacy must each meet 48x48dp minimum touch targets.
          assert src.count('new LinearLayout.LayoutParams(dp(48), dp(48))') >= 3, 'Header navigation touch targets must be at least 48x48dp'
          assert 'new LinearLayout.LayoutParams(dp(52), dp(48))' in src, 'Notification account-link target regressed'
          assert 'new LinearLayout.LayoutParams(0, dp(48), 1)' in src
          assert 'home.setContentDescription("Partner home");' in src
          assert 'linkAccount.setContentDescription("Link signed-in partner account to notifications");' in src
          push=Path('app/src/main/java/com/dbest4u/partner/PartnerPushTestController.java').read_text()
          assert 'Gravity.BOTTOM|Gravity.LEFT' in push, 'Notification toggle gravity changed'
          assert 'setHomeVisible' in push, 'Notification visibility API missing'
          assert 'dp(48),Gravity.BOTTOM|Gravity.LEFT' in push, 'Notification toggle must avoid bottom-right WhatsApp floater'
          print('PASS: role routes, join actions, accessibility, canonical push role and safe navigation')
          PY
      - name: Configure isolated QA Firebase client for compilation only
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('app/google-services.json')
          data = json.loads(path.read_text())
          source = next(c for c in data['client'] if c['client_info']['android_client_info']['package_name'] == 'com.dbest4u.partner')
          qa = json.loads(json.dumps(source))
          qa['client_info']['android_client_info']['package_name'] = 'com.dbest4u.partner.qa'
          data['client'].append(qa)
          out = Path('app/src/qa/google-services.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(data))
          PY
      - name: Compile separate-install QA APK and production release AAB without signing
        run: gradle :app:assembleProductionDebug :app:bundleProductionRelease :app:assembleQaDebug --no-daemon
      - name: Verify generated APK and unsigned AAB outputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          qa=list(Path('app/build/outputs/apk/qa/debug').glob('*.apk'))
          aab=list(Path('app/build/outputs/bundle/productionRelease').glob('*.aab'))
          assert len(qa)==1 and qa[0].stat().st_size>100000, f'Expected one nonempty QA APK: {qa}'
          assert len(aab)==1 and aab[0].stat().st_size>100000, f'Expected one nonempty production AAB: {aab}'
          for p in qa+aab:
              print(f'{p}: {p.stat().st_size} bytes sha256={hashlib.sha256(p.read_bytes()).hexdigest()}')
          print('Release AAB is NOT verified signed; no Play upload authorized.')
          PY
      - name: Publish separate-install QA APK (not a Play release)
        uses: actions/upload-artifact@v4
        with:
          name: partner-home-qa-separate-app-apk
          path: partner-android-app/app/build/outputs/apk/qa/debug/*.apk
          retention-days: 3
      - name: Publish unsigned production AAB for build inspection only
        uses: actions/upload-artifact@v4
        with:
          name: partner-home-production-UNSIGNED-aab-NOT-FOR-PLAY
          path: partner-android-app/app/build/outputs/bundle/productionRelease/*.aab
          retention-days: 3
