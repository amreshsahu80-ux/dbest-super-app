name: Build 10 catalogue request-order regression
on:
  pull_request:
    paths:
      - 'marketplace-live-catalog-authority.js'
      - 'qa/build10-catalog-request-order.test.cjs'
      - '.github/workflows/build10-catalog-request-order.yml'
  workflow_dispatch:
jobs:
  catalogue-request-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify request-order guards
        run: node --test qa/build10-catalog-request-order.test.cjs
