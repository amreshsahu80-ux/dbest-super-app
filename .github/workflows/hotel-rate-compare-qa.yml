name: Hotel Price Compare — isolated QA
on:
  push:
    branches:
      - feat/hotel-rate-compare-isolated-20261027
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo-regression:
    name: Test hotel preview without real OTA or payment access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run isolated guest, photo, owner, and price safety tests
        run: node --test tests/hotel-rate-compare.test.cjs
