name: Hotel Price Compare — isolated QA
on:
  push:
    branches:
      - feat/hotel-rate-compare-isolated-20261027
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo-regression:
    name: Test hotel preview without real OTA or payment access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run isolated guest, photo, owner, and price safety tests
        run: node --test tests/hotel-rate-compare.test.cjs tests/hotel-owner-review.test.cjs tests/hotel-simple-flow.test.cjs tests/hotel-outreach-bridge.test.cjs tests/hotel-public-b2c-adapter.test.cjs tests/hotel-public-page-rate-probe.test.cjs tests/hotel-google-browser.test.cjs tests/hotel-photo-render.test.cjs tests/hotel-guest-occupancy-api.test.cjs tests/hotel-booking-lifecycle.test.cjs tests/hotel-dbest-inventory-gate.test.cjs tests/hotel-razorpay-verification.test.cjs tests/hotel-upfront-static-rates.test.cjs tests/hotel-preview-alias-rates.test.cjs tests/hotel-upfront-auto-prices.test.cjs tests/hotel-upfront-search.test.cjs tests/hotel-guest-rate-alias.test.cjs tests/hotel-coverage-contract.test.cjs tests/hotel-isolated-booking-schema.test.cjs tests/hotel-guest-search.test.cjs
