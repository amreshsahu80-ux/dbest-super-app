name: Partner Attribution Unit Tests
on:
  push:
    branches: [fix/leader-claim-attribution-hardening-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020f4
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts --package-lock=false typescript@5.9.3
      - run: node --test tests/leader-claim-attribution-contract.cjs
