name: DBest Referral Reliable Mount — Live Chrome Smoke
on:
  push:
    branches:
      - fix/member-referral-reliable-mount-20261020
  pull_request:
    branches:
      - release/member-referral-link-live-frozen-20261020
  workflow_dispatch:
permissions:
  contents: read
jobs:
  referral-safe-smoke:
    name: Synthetic mobile browser and frozen-source gate
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify no Cab Marketplace insurance membership or payout source changes
        shell: bash
        run: |
          set -euo pipefail
          BASE=24054adf688d1401ccd45fdeb97b00030c051c71
          git merge-base --is-ancestor "$BASE" HEAD
          while IFS= read -r f;do
            [ -n "$f" ] || continue
            case "$f" in
              member-referral-share-v1.js|tests/member-referral-live-browser-smoke.cjs|.github/workflows/dbest-referral-reliable-mount-ci.yml)
                echo "Allowed referral-only / test change: $f";;
              *) echo "::error::Frozen LIVE component change blocked: $f";exit 1;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
      - name: Check JavaScript and prepare headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          node --check member-referral-share-v1.js
          node --check tests/member-referral-live-browser-smoke.cjs
          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --ignore-scripts --no-save --package-lock=false playwright-core@1.57.0
      - name: Repeat browser mobile acceptance three times without forced mount
        run: |
          set -euo pipefail
          node tests/member-referral-live-browser-smoke.cjs
          node tests/member-referral-live-browser-smoke.cjs
          node tests/member-referral-live-browser-smoke.cjs
