name: Partner Build 11 certificate normalization regression
on:
  pull_request:
    branches:
      - release/partner-postbuild10-consolidation-20261118
    paths:
      - '.github/workflows/partner-build10-kyc.yml'
      - '.github/workflows/partner-build11-cert-normalization.yml'
  workflow_dispatch:
jobs:
  certificate-format-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check expected certificate SHA-256 normalization without signing secrets
        shell: bash
        run: |
          set -euo pipefail
          normalize() { printf '%s' "$1" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]'; }
          plain='0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          colon="$(printf '%s' "$plain" | sed 's/../&:/g;s/:$//')"
          expected="$(normalize "$plain")"
          [[ "$expected" =~ ^[0-9A-F]{64}$ ]]
          test "$(normalize "$colon")" = "$expected"
          test "$(normalize "  $colon  ")" = "$expected"
          test "$(normalize "$(printf '%s' "$colon" | tr '[:lower:]' '[:upper:]')")" = "$expected"
          test "$(normalize "$(printf '  %s\n' "$plain")")" = "$expected"
          for invalid in '' '1234' 'zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz' "${plain}0" "${plain%?}"; do
            value="$(normalize "$invalid")"
            if [[ "$value" =~ ^[0-9A-F]{64}$ ]]; then
              echo "::error::Invalid certificate fingerprint was accepted"
              exit 1
            fi
          done
          echo 'Certificate fingerprint formatting regression passed'
