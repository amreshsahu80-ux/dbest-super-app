name: Partner Build 10 Home Android Compile
on:
  push:
    branches:
      - fix/partner-home-compact-reconcile-20261123
    paths:
      - 'partner-android-app/**'
      - '.github/workflows/partner-build10-home-android-compile.yml'
  pull_request:
    paths:
      - 'partner-android-app/**'
      - '.github/workflows/partner-build10-home-android-compile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: partner-android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile Android debug and release bundles without signing
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Upload debug APK for isolated QA
        uses: actions/upload-artifact@v4
        with:
          name: partner-home-build10-debug-apk
          path: partner-android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned AAB for verification only
        uses: actions/upload-artifact@v4
        with:
          name: partner-home-build10-unsigned-aab
          path: partner-android-app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
