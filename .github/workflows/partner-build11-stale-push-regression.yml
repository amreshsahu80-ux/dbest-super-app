name: Partner Build 11 stale push callback regression
on:
  push:
    branches:
      - 'fix/partner-build11-workspace-notification-control-20261121'
      - 'test/partner-build11-*'
  pull_request:
    paths:
      - 'partner-android-app/tests/test_home_stale_push_callback.py'
      - 'partner-android-app/app/src/main/java/com/dbest4u/partner/MainActivity.java'
      - '.github/workflows/partner-build11-stale-push-regression.yml'
  workflow_dispatch:
jobs:
  stale-push-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate delayed push callback role and URL binding
        run: python3 partner-android-app/tests/test_home_stale_push_callback.py
