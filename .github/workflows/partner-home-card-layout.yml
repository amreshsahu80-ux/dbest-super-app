name: Partner Home compact card layout

on:
  pull_request:
    paths:
      - 'partner-android-app/app/src/main/java/com/dbest4u/partner/MainActivity.java'
      - 'partner-android-app/tests/test_home_card_layout.py'
      - '.github/workflows/partner-home-card-layout.yml'
  push:
    branches:
      - 'fix/partner-home-uniform-card-gaps-20261122'
      - 'fix/partner-build11-workspace-notification-control-20261121'
    paths:
      - 'partner-android-app/app/src/main/java/com/dbest4u/partner/MainActivity.java'
      - 'partner-android-app/tests/test_home_card_layout.py'
      - '.github/workflows/partner-home-card-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compact-card-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Partner home role routes and spacing
        run: python3 partner-android-app/tests/test_home_card_layout.py
