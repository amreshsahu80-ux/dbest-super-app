name: AI Saathi multilingual isolated QA
on:
  push:
    branches:
      - feat/ai-saathi-multilingual-qa-20261105
  pull_request:
    paths:
      - ai-saathi-pilot/**
      - .github/workflows/ai-saathi-multilingual-qa.yml
permissions:
  contents: read
jobs:
  qa-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-saathi-pilot
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check api/chat.js
          node --check api/model-chat.js
          node --check api/assist.js
          node --check api/health.js
      - name: Run tests without model calls or credentials
        run: node --test tests/*.test.cjs
