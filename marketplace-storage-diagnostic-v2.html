<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBest Marketplace Diagnostic v2</title><style>body{margin:0;background:#f4f7fb;font-family:system-ui,-apple-system,Segoe UI,Arial;color:#14213d}.wrap{max-width:560px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dfe6ef;border-radius:20px;padding:18px;box-shadow:0 14px 36px #17355d14}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #edf1f6}.k{font-weight:700}.v{text-align:right;font-weight:800;overflow-wrap:anywhere}.ok{color:#15803d}.bad{color:#b91c1c}.warn{color:#9a6700}.note{font-size:13px;line-height:1.5;color:#687386}.btn{width:100%;border:0;border-radius:12px;padding:13px;background:#175cff;color:white;font-weight:800;margin-top:14px}</style></head><body><div class="wrap"><div class="card"><h2 style="margin:0 0 8px">DBest Marketplace Diagnostic v2</h2><p class="note">Standalone test. It does not load the DBest app, does not start payment, and does not display any secret token values.</p><div id="rows"></div><button class="btn" onclick="run()">Run Again</button></div></div><script>const rows=document.getElementById('rows');function add(k,v,c){const d=document.createElement('div');d.className='row';d.innerHTML='<span class="k"></span><span class="v"></span>';d.children[0].textContent=k;d.children[1].textContent=v;d.children[1].className='v '+c;rows.appendChild(d)}async function run(){rows.innerHTML='';let ls=true;try{localStorage.setItem('__dbest_diag','1');localStorage.removeItem('__dbest_diag')}catch(e){ls=false}add('Browser storage',ls?'Available':'Blocked',ls?'ok':'bad');let secure=false,session=false,userCount='Unknown';if(ls){secure=!!localStorage.getItem('dbest_member_live_token');session=!!localStorage.getItem('d2_session');try{const u=JSON.parse(localStorage.getItem('d2_users')||'[]');userCount=Array.isArray(u)?String(u.length):'Stored'}catch(_){userCount='Unreadable'}}add('Secure member session',secure?'Present':'Missing',secure?'ok':'bad');add('DBest local session',session?'Present':'Missing',session?'ok':'warn');add('Stored users',userCount,userCount==='Unreadable'?'bad':'ok');const keys=[];if(ls){for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';if(/cart|commerce|market|order/i.test(k))keys.push(k)}}add('Marketplace/cart storage keys',keys.length?keys.join(', '):'None detected',keys.length?'ok':'warn');let cfg='Not checked',cfgClass='warn';try{const r=await fetch('/api/razorpay/config?diag='+Date.now(),{cache:'no-store'});const d=await r.json().catch(()=>({}));cfg=r.ok&&d.configured?'Configured ('+(d.mode||'unknown')+')':r.ok?'Not configured':'HTTP '+r.status;cfgClass=r.ok&&d.configured?'ok':'bad'}catch(e){cfg='Fetch failed';cfgClass='bad'}add('Razorpay backend',cfg,cfgClass);let runtime='Not checked',runtimeClass='warn';try{const r=await fetch('/runtime-config.js?diag='+Date.now(),{cache:'no-store'});runtime=r.ok?'Available':'HTTP '+r.status;runtimeClass=r.ok?'ok':'bad'}catch(e){runtime='Fetch failed';runtimeClass='bad'}add('Runtime config file',runtime,runtimeClass);add('Result',secure&&cfgClass==='ok'?'Session + Razorpay backend are healthy':'One or more prerequisites missing',secure&&cfgClass==='ok'?'ok':'bad')}run();</script></body></html>
