plugins { id 'com.android.application'; id 'com.google.gms.google-services' }

android {
    namespace 'com.dbest4u.app'
    compileSdk 36

    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.dbest4u.app'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '1.0.2-beta'
    }

    dependencies {
        implementation 'androidx.activity:activity:1.11.0'
        implementation 'androidx.core:core:1.17.0'
        implementation platform('com.google.firebase:firebase-bom:35.1.0')
        implementation 'com.google.firebase:firebase-messaging'
    }

    buildTypes {
        debug {
            // Separate install beside Play-signed DBest; Firebase needs a matching
            // com.dbest4u.app.test registration/config in app/src/debug/.
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
