plugins { id 'com.android.application'; id 'com.google.gms.google-services' }

android {
    namespace 'com.dbest4u.app'
    compileSdk 36

    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.dbest4u.app'
        minSdk 24
        targetSdk 36
        versionCode 6
        versionName '1.0.4'
    }

    dependencies {
        implementation 'androidx.activity:activity:1.11.0'
        implementation 'androidx.core:core:1.17.0'
        implementation platform('com.google.firebase:firebase-bom:35.1.0')
        implementation 'com.google.firebase:firebase-messaging'
    }

    buildTypes {
        // Separate QA installation: never replace the Play-signed public app.
        debug {
            // Existing Firebase test app registration; never overwrite production.
            applicationIdSuffix '.test'
            versionNameSuffix '-push-qa'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

 
// Package DBest's existing brand asset as the launcher icon without
// committing a second copy of its binary image to the repository.
def launcherResDir = file("$buildDir/generated/dbest-launcher-res")
android.sourceSets.main.res.srcDir(launcherResDir)
tasks.register("prepareDbestLauncherIcon", Copy) {
    from rootProject.file("../dbest-logo.png")
    into file("$buildDir/generated/dbest-launcher-res/drawable-nodpi")
    rename { "dbest_launcher.png" }
}
tasks.named("preBuild").configure {
    dependsOn tasks.named("prepareDbestLauncherIcon")
}
