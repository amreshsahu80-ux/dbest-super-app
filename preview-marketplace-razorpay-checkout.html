<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBest Marketplace Checkout</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Arial;background:#f4f7fb;color:#13213a;margin:0;padding:18px}.card{max-width:620px;margin:20px auto;background:#fff;border:1px solid #dfe6ef;border-radius:22px;padding:20px;box-shadow:0 14px 36px #17355d14}h2{margin:0 0 6px}.muted{color:#687386}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f{margin-top:12px}.f label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.f input,.f textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd7e6;border-radius:11px;font:inherit}.f textarea{min-height:76px}.summary{background:#f7f9fd;border:1px solid #e2e8f2;border-radius:14px;padding:13px;margin-top:14px}.line{display:flex;justify-content:space-between;gap:12px;margin:6px 0}.btn{width:100%;border:0;border-radius:12px;padding:14px;background:#175cff;color:#fff;font-weight:850;font-size:16px;margin-top:14px}.btn:disabled{opacity:.55}.secondary{background:#eef3ff;color:#175cff}.ok{color:#15803d;font-weight:800}.err{color:#b42318;font-weight:800}.status{margin-top:12px;padding:11px;border-radius:10px;background:#eef6ff;color:#244a7c;font-size:13px;font-weight:700}@media(max-width:560px){.row{grid-template-columns:1fr}}</style><script src="/runtime-config.js"></script></head><body><div class="card"><h2>DBest Marketplace Checkout</h2><div class="muted">Preview • Razorpay Test Mode</div><div id="cart" class="summary"></div><form id="form"><div class="row"><div class="f"><label>Name</label><input name="name" required></div><div class="f"><label>Mobile</label><input name="mobile" required></div></div><div class="f"><label>Email</label><input name="email" type="email"></div><div class="f"><label>Delivery Address / Landmark</label><textarea name="address" required></textarea></div><div class="row"><div class="f"><label>PIN Code</label><input name="pin" required></div><div class="f"><label>Location</label><button id="gps" type="button" class="btn secondary" style="margin-top:0">Use Current Location</button></div></div><div id="status" class="status">Ready. Set delivery location, then continue.</div><button id="pay" class="btn" type="submit">Continue to Razorpay</button></form></div><script>
(function(){'use strict';
const TYPES=['grocery','restaurant','medicine'],PENDING_KEY='dbest_marketplace_rzp_pending_v1';
const cfg=window.DBEST_RUNTIME_CONFIG||{},BASE=String(cfg.supabaseUrl||'').replace(/\/$/,''),KEY=String(cfg.supabasePublishableKey||''),MASTER_API=BASE+'/functions/v1/marketplace-master-order-live';
let carts=JSON.parse(localStorage.getItem('d2_commerce_carts')||'null')||{grocery:[],restaurant:[],digital:[],medicine:[]};
const commerce=JSON.parse(localStorage.getItem('d2_commerce_config')||'null')||{},session=JSON.parse(localStorage.getItem('d2_session')||'null')||{},users=JSON.parse(localStorage.getItem('d2_users')||'null')||[],token=String(localStorage.getItem('dbest_member_live_token')||''),me=users.find(u=>String(u.id)===String(session.id))||{};
let pos=null,busy=false,recovering=false;
const $=id=>document.getElementById(id),money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});
function product(id){return (commerce.products||[]).find(p=>String(p.id)===String(id))||null}
function rows(){const out=[];for(const t of TYPES)for(const r of (Array.isArray(carts[t])?carts[t]:[])){const p=product(r.id);if(p&&Number(r.qty)>0)out.push({t,r,p})}return out}
function subtotal(){return rows().reduce((a,x)=>a+Number(x.p.price||0)*Number(x.r.qty||0),0)}
function groups(){const g={};for(const x of rows()){const id=String(x.p.vendorId||'');if(!g[id])g[id]={vendorId:id,marketType:x.t,items:[]};g[id].items.push({id:x.r.id,qty:Number(x.r.qty)||1})}return Object.values(g)}
function setStatus(s,err){$('status').textContent=s;$('status').className='status '+(err?'err':'')}
function prefill(){document.querySelector('[name=name]').value=me.name||'';document.querySelector('[name=mobile]').value=me.mobile||'';document.querySelector('[name=email]').value=me.email||''}
function render(){const r=rows();$('cart').innerHTML=r.length?'<div class="line"><span>Items</span><b>'+r.reduce((a,x)=>a+Number(x.r.qty||0),0)+'</b></div><div class="line"><span>Product subtotal</span><b>'+money(subtotal())+'</b></div><div class="line"><span>Delivery</span><b>Calculated securely</b></div>':'<div class="muted">No active cart items.</div>';if(!r.length&&!localStorage.getItem(PENDING_KEY))$('pay').disabled=true}
async function jfetch(url,opt={}){const r=await fetch(url,opt),j=await r.json().catch(()=>({}));if(!r.ok){const e=Error(j.error||j.detail||j.message||('HTTP '+r.status));e.status=r.status;e.data=j;throw e}return j}
async function masterCreate(ref,data){if(!token)throw Error('Secure member session is missing. Please login again.');const h={apikey:KEY,'Content-Type':'application/json','x-dbest-member-token':token};if(KEY.startsWith('eyJ'))h.Authorization='Bearer '+KEY;return jfetch(MASTER_API,{method:'POST',cache:'no-store',headers:h,body:JSON.stringify({action:'create',parentTxId:ref,trackingToken:crypto.randomUUID?crypto.randomUUID():String(Date.now()),customerName:data.name,customerMobile:data.mobile,customerEmail:data.email,deliveryAddress:data.address,dropLat:pos.lat,dropLng:pos.lng,paymentMethod:'Online - Razorpay',taxPercent:Number(commerce.taxPercent||0),groups:groups()})})}
function loadRazorpay(){if(window.Razorpay)return Promise.resolve();return new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://checkout.razorpay.com/v1/checkout.js';s.onload=ok;s.onerror=()=>no(Error('Unable to load Razorpay Checkout'));document.head.appendChild(s)})}
function clearCart(){for(const t of TYPES)carts[t]=[];localStorage.setItem('d2_commerce_carts',JSON.stringify(carts))}
function success(v){clearCart();localStorage.removeItem(PENDING_KEY);setStatus('Payment verified • Order activated • Central record saved ✓');$('pay').textContent='Payment Successful ✓';$('pay').disabled=true;render();return v}
async function recoverPending(showPending){if(recovering)return null;let p=null;try{p=JSON.parse(localStorage.getItem(PENDING_KEY)||'null')}catch{}if(!p?.orderId||!p?.dbestRef||!p?.masterOrderId)return null;recovering=true;try{if(showPending)setStatus('Checking Razorpay payment status…');const v=await jfetch('/api/razorpay/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'recover-marketplace',orderId:p.orderId,dbestRef:p.dbestRef,masterOrderId:p.masterOrderId,userId:p.userId||String(session.id||'')})});if(v.verified&&v.persisted&&v.marketplaceOrderActivated)return success(v);return null}catch(err){if(err.status===409){if(showPending){setStatus('Payment has not been captured yet. You may retry if you cancelled payment.');$('pay').disabled=false}return null}if(showPending){setStatus('Payment status check failed: '+String(err.message||err),true);$('pay').disabled=false}return null}finally{recovering=false}}
$('gps').onclick=function(){setStatus('Getting your location…');navigator.geolocation.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lng:p.coords.longitude};setStatus('Location set successfully ✓')},e=>setStatus(e.code===1?'Location permission denied. Please allow location in Chrome.':'Could not get location. Please retry.',true),{enableHighAccuracy:true,timeout:15000,maximumAge:0})};
$('form').onsubmit=async function(e){e.preventDefault();if(busy)return false;if(!rows().length){const recovered=await recoverPending(true);if(recovered)return false;setStatus('Cart is empty.',true);return false}if(!token){setStatus('Secure member session is missing. Please login again.',true);return false}if(!pos){setStatus('Please tap Use Current Location first.',true);return false}const f=new FormData(e.target),data={name:String(f.get('name')||'').trim(),mobile:String(f.get('mobile')||'').replace(/\D/g,'').slice(-10),email:String(f.get('email')||'').trim(),address:String(f.get('address')||'').trim(),pin:String(f.get('pin')||'').trim()};if(data.name.length<2||data.mobile.length<10||data.address.length<4||data.pin.length<4){setStatus('Complete name, mobile, address and PIN code.',true);return false}busy=true;$('pay').disabled=true;try{const ref='MKT_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);setStatus('Calculating final amount securely…');const m=await masterCreate(ref,data);if(!m.masterOrderId||!m.pricing||!(Number(m.pricing.total)>0))throw Error('Server could not calculate final total.');setStatus('Final total '+money(m.pricing.total)+' • opening Razorpay…');const o=await jfetch('/api/razorpay/create-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'transaction',dbestRef:ref,txId:ref,amount:Number(m.pricing.total),section:'Marketplace - Master Order',sub:'Multi-Category Master Order',userId:String(session.id||''),masterOrderId:m.masterOrderId})});localStorage.setItem(PENDING_KEY,JSON.stringify({orderId:o.orderId,dbestRef:ref,masterOrderId:m.masterOrderId,userId:String(session.id||''),createdAt:Date.now()}));await loadRazorpay();const rz=new Razorpay({key:o.keyId,amount:o.amount,currency:o.currency||'INR',name:'DBest Super Platform',description:'Marketplace Order',order_id:o.orderId,prefill:{name:data.name,email:data.email,contact:data.mobile},handler:async r=>{try{setStatus('Verifying payment…');const v=await jfetch('/api/razorpay/verify-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...r,dbestRef:ref,kind:'transaction'})});if(!v.verified||!v.persisted||!v.marketplaceOrderActivated)throw Error('Payment verification/order activation incomplete.');success(v)}catch(err){setStatus('Payment received. Confirming with Razorpay…');setTimeout(()=>recoverPending(true),800)}},modal:{ondismiss:()=>{setTimeout(()=>{if(localStorage.getItem(PENDING_KEY)&&$('pay').textContent.indexOf('Payment Successful')===-1)recoverPending(true)},1000)}}});rz.on('payment.failed',r=>{setStatus(r?.error?.description||'Payment failed.',true);$('pay').disabled=false});rz.open()}catch(err){setStatus(String(err&&err.message||err),true);$('pay').disabled=false}finally{busy=false}return false};
function resume(){if(document.visibilityState==='visible')recoverPending(false)}
document.addEventListener('visibilitychange',resume);window.addEventListener('focus',()=>setTimeout(()=>recoverPending(false),300));
prefill();render();setTimeout(()=>recoverPending(true),250);
})();
</script></body></html>
