<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBest Owner Image Review</title><style>body{font:15px system-ui;margin:0;background:#f3f6fb;color:#152c49}header{background:#163f7c;color:white;padding:18px}main{max-width:1000px;margin:auto;padding:16px}input,button{padding:11px;font:inherit;border:1px solid #cbd5e2;border-radius:7px}button{background:#163f7c;color:white;border:0;margin:5px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.card{background:white;padding:12px;border-radius:10px}.card img{width:100%;aspect-ratio:1;object-fit:contain}.muted{font-size:12px;color:#61718a}</style><script src="/dbest-image-prep-1mb.js"></script></head><body><header><h2>DBest Owner Console — Product Images</h2>Approve vendor uploads or submit owner images</header><main><p>Requires an active Owner Console session. Images remain private until approved.</p><input id="token" type="password" autocomplete="off" placeholder="Owner session token"><button id="load">Review pending images</button><h3>Owner image upload</h3><input id="sku" placeholder="Product SKU, e.g. SKU-GROC-0001"><input id="photo" type="file" accept="image/*" capture="environment"><button id="upload">Upload for review</button><p id="status"></p><h3>Pending vendor and owner images</h3><div id="grid" class="grid"></div></main><script>
const $=id=>document.getElementById(id);try{const t=sessionStorage.getItem('dbest_owner_session_token')||'';if(t){$('token').value=t;$('token').style.display='none'}}catch(e){};const url='https://ydedmotbacnllkijzmvp.supabase.co/functions/v1/dbest-catalogue-image-workflow';function auth(){return{authorization:'Bearer '+$('token').value.trim()}}async function load(){$('status').textContent='Loading…';try{const r=await fetch(url+'?status=pending_review',{headers:auth()});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Not authorized');$('grid').replaceChildren();for(const x of d.items){const card=document.createElement('div');card.className='card';const img=document.createElement('img');if(x.preview_url)img.src=x.preview_url;img.alt='Proposed image '+x.sku;const title=document.createElement('b');title.textContent=x.sku;const by=document.createElement('p');by.className='muted';by.textContent=x.submitted_by_type+' · '+x.submitted_by_id;card.append(img,title,by);for(const decision of ['approve','reject']){const btn=document.createElement('button');btn.textContent=decision==='approve'?'Approve & publish':'Reject';btn.onclick=async()=>{btn.disabled=true;try{const rr=await fetch(url,{method:'POST',headers:{...auth(),'content-type':'application/json'},body:JSON.stringify({id:x.id,decision})});const out=await rr.json();if(!rr.ok||!out.ok)throw Error(out.error||'Review failed');card.remove();$('status').textContent='Image '+decision+'d'}catch(e){$('status').textContent=e.message;btn.disabled=false}};card.append(btn)}$('grid').append(card)}$('status').textContent=d.items.length+' pending images'}catch(e){$('status').textContent='Error: '+e.message}}$('load').onclick=load;if($('token').value)load();$('upload').onclick=async()=>{const file=$('photo').files?.[0];if(!file){$('status').textContent='Choose an image';return}const f=new FormData();f.append('sku',$('sku').value.trim());try{const prepared=await DBestImagePrep(file);f.append('file',prepared);const r=await fetch(url,{method:'POST',headers:auth(),body:f});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Upload failed');$('status').textContent='Owner image uploaded for approval';await load()}catch(e){$('status').textContent=e.message}};
</script></body></html>
