<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBest Owner Live Onboarding</title><script src="/runtime-config.js"></script><style>body{margin:0;background:#f5f7fb;font-family:Inter,system-ui,Arial;color:#13213a}.wrap{max-width:1080px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e1e8f2;border-radius:18px;padding:16px;margin:12px 0}.hero{background:linear-gradient(135deg,#10264d,#175cff,#745cff);color:#fff}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:800}.tabs button{background:#edf3ff;color:#175cff}.tabs .on,.btn{background:#175cff;color:#fff}.soft{background:#edf3ff;color:#175cff}.danger{background:#fff0f0;color:#a22}.note{padding:11px;border:1px solid #d8e5ff;background:#f5f8ff;border-radius:11px}.ok{background:#eaf8ef}.err{background:#fff0f0;color:#a22}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-top:1px solid #edf1f6}.row:first-child{border-top:0}.meta{font-size:12px;color:#647089;line-height:1.5}.badge{display:inline-block;padding:7px 10px;border-radius:999px;background:#eef3fb;font-size:12px;font-weight:800}.activeBadge{background:#eaf8ef;color:#15803d;border:1px solid #bee5ca}.hide{display:none}.review{background:#fbfcff;border:1px solid #dce6f5;border-radius:16px;padding:14px}.review pre{white-space:pre-wrap;word-break:break-word;background:#f6f8fc;padding:12px;border-radius:10px;font-size:12px}.docs a{display:block;margin:8px 0}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.top a{text-decoration:none;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input{width:100%;padding:11px;border:1px solid #cfd8e6;border-radius:10px;font-size:16px;box-sizing:border-box}.agreementBox{margin-top:14px;padding:12px;border:1px solid #d8e5ff;background:#f5f8ff;border-radius:12px}.agreementActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}@media(max-width:700px){.row{align-items:flex-start;flex-direction:column}.grid,.agreementActions{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><b>DBest Super Platform</b><a href="/">← Main Platform</a></div><div class="card hero"><h1>Owner Live Onboarding</h1><div>Review first • Owner override authority • Real Supabase records</div></div><div id="msg" class="note">Owner authentication required.</div><div id="auth" class="card"><h2>Secure Owner Login</h2><div class="grid"><input id="ownerEmail" type="email" placeholder="Owner email"><input id="ownerOtp" inputmode="numeric" maxlength="6" placeholder="6-digit OTP"><button class="btn" id="sendOtp">Send OTP</button><button class="btn" id="verifyOtp">Verify & Open Console</button></div></div><div id="console" class="hide"><div class="card"><div class="tabs" id="tabs"><button data-tab="members" class="on">Users</button><button data-tab="kyc">Payout KYC</button><button data-tab="vendors">Vendors</button><button data-tab="vaahak">Vaahak</button><button data-tab="service">Service Partners</button></div></div><div id="content"></div><div id="review"></div></div></div><script>(function(){const cfg=window.DBEST_RUNTIME_CONFIG||{},BASE=String(cfg.supabaseUrl||'').replace(/\/$/,''),KEY=String(cfg.supabasePublishableKey||''),TOKEN_KEY='dbest_owner_live_token_v1';const $=id=>document.getElementById(id);let token=localStorage.getItem(TOKEN_KEY)||'',tab='members',rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function msg(t,c=''){const e=$('msg');e.className='note '+c;e.textContent=t}async function fn(slug,body,owner=true){const h={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};if(owner&&token)h['x-dbest-owner-token']=token;const r=await fetch(BASE+'/functions/v1/'+slug,{method:'POST',cache:'no-store',headers:h,body:JSON.stringify(body||{})});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||d.detail||('HTTP '+r.status));e.status=r.status;throw e}return d}function show(){ $('auth').classList.add('hide');$('console').classList.remove('hide');load()}$('sendOtp').onclick=async()=>{try{await fn('send-owner-otp',{email:$('ownerEmail').value.trim().toLowerCase()},false);msg('OTP sent to Owner email.','ok')}catch(e){msg(e.message,'err')}};$('verifyOtp').onclick=async()=>{try{const d=await fn('verify-owner-otp',{email:$('ownerEmail').value.trim().toLowerCase(),code:$('ownerOtp').value.trim()},false);token=d.ownerToken||'';if(!token)throw Error('Owner session not created');localStorage.setItem(TOKEN_KEY,token);msg('Owner verified.','ok');show()}catch(e){msg(e.message,'err')}};$('tabs').onclick=e=>{const b=e.target.closest('button[data-tab]');if(!b)return;tab=b.dataset.tab;[...$('tabs').children].forEach(x=>x.classList.toggle('on',x===b));$('review').innerHTML='';load()};async function load(){try{msg('Loading '+tab+'…');if(tab==='members'){const d=await fn('owner-report-data',{});rows=d.members||[]}else if(tab==='kyc'){const d=await fn('service-request-live',{action:'list'});rows=(d.requests||[]).filter(x=>String(x.section)==='Payout KYC')}else if(tab==='vendors'){const d=await fn('marketplace-live',{action:'owner_list_vendors'});rows=d.vendors||[]}else if(tab==='vaahak'){const d=await fn('vaahak-live',{action:'owner_list'});rows=d.partners||[]}else{const d=await fn('hyperlocal-service-live',{action:'owner_list'});rows=d.partners||[]}render();msg('Live records loaded.','ok')}catch(e){if(/owner_session/.test(e.message)){localStorage.removeItem(TOKEN_KEY);token='';$('console').classList.add('hide');$('auth').classList.remove('hide')}msg(e.message,'err')}}function title(r){if(tab==='members')return (r.Name||'Member')+' • '+(r.Member_ID||'');if(tab==='kyc')return (r.member_name||'Member')+' • '+(r.member_id||'');if(tab==='vendors')return (r.name||'Vendor')+' • '+(r.id||'');if(tab==='vaahak')return (r.name||'Vaahak')+' • '+(r.id||'');return (r.name||'Service Partner')+' • '+(r.service_partner_id||'')}function status(r){if(tab==='members')return (r.Status||'')+' / '+(r.Payment_Status||'');if(tab==='kyc')return (r.status||'')+' / '+(r.payment_status||'');if(tab==='vendors')return (r.owner_approval||'')+' / '+(r.agreement_status||'');if(tab==='vaahak')return (r.owner_approval||'')+' / '+(r.agreement_status||'');return (r.approval_status||'')+' / '+(r.active?'Active':'Inactive')+' / Agreement: '+(r.agreement_status||'Not Signed')}function render(){let lead='';if(tab==='members')lead='<div class="note"><b>Normal social-login + successful Razorpay users stay auto-active.</b> Owner Override is for exceptional/pending records and now bypasses email-verification blocking.</div>';if(tab==='vendors')lead='<div class="note">Owner Override can approve/reject an existing Vendor regardless of normal approval sequence. Review the record first.</div><p><a class="btn soft" href="/vendor" style="display:inline-block;text-decoration:none">Open Vendor Registration</a></p>';if(tab==='vaahak')lead='<div class="note">Owner Override can approve/reject an existing Vaahak record. Review before applying the override.</div><p><a class="btn soft" href="/vaahak" style="display:inline-block;text-decoration:none">Open Vaahak Registration</a></p>';if(tab==='service')lead='<div class="note">Normal Service Partner onboarding requires ₹99 Razorpay payment, Partner OTP agreement signature and Owner OTP agreement signature. Owner Override can deliberately bypass normal prerequisites and is audit-recorded.</div><p><a class="btn soft" href="/service-partner-onboarding-v3.html" style="display:inline-block;text-decoration:none">Start Service Partner Onboarding</a></p>';if(tab==='kyc')lead='<div class="note">Review the uploaded Aadhaar and bank proof before marking payout KYC verified.</div>';$('content').innerHTML='<div class="card"><h2>'+({members:'Users / Members',kyc:'Payout KYC',vendors:'Vendor Onboarding',vaahak:'Vaahak Onboarding',service:'Service Partner Onboarding'}[tab])+'</h2>'+lead+(rows.length?rows.map((r,i)=>'<div class="row"><div><b>'+esc(title(r))+'</b><div class="meta">'+esc(status(r))+'</div></div><button class="btn soft" onclick="reviewRow('+i+')">View Full Registration & Documents</button></div>').join(''):'<p>No records found.</p>')+'</div>'}window.reviewRow=async i=>{const r=rows[i];let docs=[];try{let tx='';if(tab==='kyc')tx=r.transaction_id||'';if(tab==='service')tx=r.registration_transaction_id||'';if(tx){const d=await fn('service-document-live',{action:'owner_list',transactionId:tx});docs=d.documents||[]}}catch(_){}let actions='';if(tab==='members'){actions=(r.Status==='Active'&&r.Payment_Status==='Approved')?'<span class="badge activeBadge">Already Approved & Active ✓</span>':'<button class="btn" onclick="overrideMember(\''+esc(r.Member_ID||'')+'\')">Owner Override Approve & Activate</button>'}if(tab==='kyc')actions='<button class="btn" onclick="setKyc(\''+esc(r.transaction_id||'')+'\',true)">Mark KYC Verified</button> <button class="btn danger" onclick="setKyc(\''+esc(r.transaction_id||'')+'\',false)">Reject KYC</button>';if(tab==='vendors')actions='<button class="btn" onclick="setVendor(\''+esc(r.id||'')+'\',true)">Owner Override Approve</button> <button class="btn danger" onclick="setVendor(\''+esc(r.id||'')+'\',false)">Reject</button>';if(tab==='vaahak')actions='<button class="btn" onclick="setVaahak(\''+esc(r.id||'')+'\',true)">Owner Override Approve</button> <button class="btn danger" onclick="setVaahak(\''+esc(r.id||'')+'\',false)">Reject</button>';if(tab==='service'){const sid=esc(r.service_partner_id||r.member_id||'');let agreement='';if(r.agreement_partner_signed&&!r.agreement_owner_signed){agreement='<div class="agreementBox"><b>Partner agreement signed ✓</b><div class="meta">Owner OTP signature is required before normal approval.</div><div class="agreementActions"><button class="btn" onclick="sendServiceOwnerOtp(\''+sid+'\')">Send Owner Agreement OTP</button><input id="serviceOwnerAgreementOtp" inputmode="numeric" maxlength="6" placeholder="6-digit Owner OTP"><button class="btn" onclick="verifyServiceOwnerOtp(\''+sid+'\')">Verify OTP & Sign Agreement</button></div></div>'}else if(r.agreement_partner_signed&&r.agreement_owner_signed){agreement='<div class="agreementBox ok"><b>Agreement Fully Signed ✓</b><div class="meta">Partner and Owner OTP signatures are complete.</div></div>'}else{agreement='<div class="agreementBox"><b>Partner agreement pending</b><div class="meta">Normal approval stays blocked until the Partner signs. Owner Override remains available for exceptional cases.</div></div>'}actions=agreement+(r.agreement_partner_signed&&r.agreement_owner_signed?'<button class="btn" onclick="setService(\''+esc(r.member_id||'')+'\',true,false)">Approve & Activate</button> ':'')+'<button class="btn soft" onclick="setService(\''+esc(r.member_id||'')+'\',true,true)">Owner Override Approve</button> <button class="btn danger" onclick="setService(\''+esc(r.member_id||'')+'\',false,false)">Reject</button>'}$('review').innerHTML='<div class="card review"><h2>Full Review</h2><pre>'+esc(JSON.stringify(r,null,2))+'</pre><div class="docs"><h3>Uploaded Documents</h3>'+(docs.length?docs.map(d=>d.url?'<a target="_blank" rel="noopener" href="'+esc(d.url)+'">Open '+esc(d.field_name||d.file_name||'document')+'</a>':'<div>'+esc(d.file_name||'Document')+'</div>').join(''):'<div class="meta">No linked documents were returned by the live document service for this record.</div>')+'</div><div style="margin-top:14px">'+actions+'</div></div>';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};window.overrideMember=async id=>{try{await fn('approve-member-and-welcome',{memberId:id,overrideReason:'Owner reviewed registration and applied manual override'});msg('User activated by Owner Override.','ok');load()}catch(e){msg(e.message,'err')}};window.setVendor=async(id,yes)=>{try{await fn('marketplace-live',{action:'owner_approve_vendor',vendorId:id,approve:yes});msg('Vendor status updated by Owner.','ok');load()}catch(e){msg(e.message,'err')}};window.setVaahak=async(id,yes)=>{try{await fn('vaahak-live',{action:'owner_approve',partnerId:id,approve:yes});msg('Vaahak status updated by Owner.','ok');load()}catch(e){msg(e.message,'err')}};window.sendServiceOwnerOtp=async id=>{try{const d=await fn('partner-owner-agreement-otp',{action:'send',partnerKind:'service_partner',partnerId:id,version:'1.0'});msg(d.alreadySigned?'Owner agreement is already signed.':'Owner agreement OTP sent to '+(d.maskedOwnerEmail||'Owner email')+'.','ok')}catch(e){msg(e.message,'err')}};window.verifyServiceOwnerOtp=async id=>{try{const code=String($('serviceOwnerAgreementOtp')?.value||'').trim();await fn('partner-owner-agreement-otp',{action:'verify',partnerKind:'service_partner',partnerId:id,code});msg('Owner OTP verified. Service Partner agreement is Fully Signed.','ok');load()}catch(e){msg(e.message,'err')}};window.setService=async(id,yes,override)=>{try{await fn('hyperlocal-service-live',{action:'owner_set_approval',memberId:id,approval:yes?'Approved':'Rejected',override:!!override,overrideReason:override?'Owner reviewed full registration/documents and intentionally bypassed normal onboarding requirements.':''});msg(override&&yes?'Service Partner activated by Owner Override.':'Service Partner status updated by Owner.','ok');load()}catch(e){msg(e.message,'err')}};window.setKyc=async(tx,yes)=>{try{await fn('service-request-live',{action:'update',transactionId:tx,status:yes?'Completed':'Rejected',paymentStatus:yes?'KYC Verified / Payout Eligible':'KYC Rejected / Payout On Hold',ownerNote:yes?'Owner reviewed Aadhaar and bank proof and verified payout KYC.':'Owner rejected payout KYC after document review.'});msg(yes?'Payout KYC verified and central payout profile enabled.':'Payout KYC rejected and payout remains disabled.','ok');load()}catch(e){msg(e.message,'err')}};if(token)show()})();</script></body></html>
