<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><title>DBest Owner Live Onboarding</title><script src="/runtime-config.js"></script><style>:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e1e8f2;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 24px #16345b12}.hero{background:linear-gradient(135deg,#10264d,#175cff,#745cff);color:#fff}.hero h1{margin:0 0 6px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:800}.tabs button{background:#eef3fb;color:#1d4d96}.tabs button.on,.btn{background:#175cff;color:#fff}.soft{background:#eef3fb;color:#175cff}.danger{background:#fff0f0;color:#a22}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #cfd8e6;border-radius:10px;font-size:16px}.full{grid-column:1/-1}.note{padding:11px;border:1px solid #d8e5ff;background:#f5f8ff;border-radius:11px;margin:10px 0}.ok{background:#eaf8ef;border-color:#bee5ca}.err{background:#fff0f0;border-color:#f0caca;color:#9d2020}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;border-top:1px solid #edf1f6;padding:12px 0}.row:first-child{border-top:0}.meta{font-size:12px;color:#647089}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef3fb;font-size:11px;font-weight:800}.hide{display:none}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.top a{text-decoration:none;font-weight:800}</style></head><body><div class="wrap"><div class="top"><b>DBest Super Platform</b><a href="/">← Main Platform</a></div><div class="card hero"><h1>Owner Live Onboarding</h1><div>Real Supabase records • Manual fallback for exceptional cases</div></div><div id="msg" class="note">Owner authentication required.</div><div id="auth" class="card"><h2>Secure Owner Login</h2><div class="grid"><div><label>Owner Email</label><input id="ownerEmail" type="email" placeholder="Owner email"></div><div><label>OTP</label><input id="ownerOtp" inputmode="numeric" maxlength="6" placeholder="6-digit OTP"></div><div><button class="btn" id="sendOtp">Send OTP</button></div><div><button class="btn" id="verifyOtp">Verify & Open Console</button></div></div></div><div id="console" class="hide"><div class="card"><div class="tabs" id="tabs"><button data-tab="members" class="on">Users</button><button data-tab="vendors">Vendors</button><button data-tab="vaahak">Vaahak</button><button data-tab="service">Service Partners</button></div></div><div id="content"></div></div></div><script>(function(){'use strict';const cfg=window.DBEST_RUNTIME_CONFIG||{},BASE=String(cfg.supabaseUrl||'').replace(/\/$/,''),KEY=String(cfg.supabasePublishableKey||''),TOKEN_KEY='dbest_owner_live_token_v1';const $=id=>document.getElementById(id);let token=localStorage.getItem(TOKEN_KEY)||'',tab='members';function msg(t,c=''){let e=$('msg');e.className='note'+(c?' '+c:'');e.textContent=t}async function fn(slug,body,owner=true,extra={}){const h={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',...extra};if(owner&&token)h['x-dbest-owner-token']=token;const r=await fetch(BASE+'/functions/v1/'+slug,{method:'POST',cache:'no-store',headers:h,body:JSON.stringify(body||{})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||d.detail||('HTTP '+r.status));return d}async function ownerReport(){return fn('owner-report-data',{},true)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function showConsole(){ $('auth').classList.add('hide');$('console').classList.remove('hide');load()}$('sendOtp').onclick=async()=>{try{const email=$('ownerEmail').value.trim().toLowerCase();await fn('send-owner-otp',{email},false);msg('OTP sent to Owner email.','ok')}catch(e){msg(e.message,'err')}};$('verifyOtp').onclick=async()=>{try{const email=$('ownerEmail').value.trim().toLowerCase(),code=$('ownerOtp').value.trim();const d=await fn('verify-owner-otp',{email,code},false);token=d.ownerToken||'';if(!token)throw new Error('Owner session not created');localStorage.setItem(TOKEN_KEY,token);msg('Owner verified. Live onboarding console opened.','ok');showConsole()}catch(e){msg(e.message,'err')}};$('tabs').onclick=e=>{const b=e.target.closest('button[data-tab]');if(!b)return;tab=b.dataset.tab;[...$('tabs').children].forEach(x=>x.classList.toggle('on',x===b));load()};async function approveMember(id){try{await fn('approve-member-and-welcome',{memberId:id});msg('Member approved and activated.','ok');load()}catch(e){msg(e.message,'err')}}window.approveMember=approveMember;async function approveVendor(id,yes){try{await fn('marketplace-live',{action:'owner_approve_vendor',vendorId:id,approve:yes});msg('Vendor status updated.','ok');load()}catch(e){msg(e.message,'err')}}window.approveVendor=approveVendor;async function approveVaahak(id,yes){try{await fn('vaahak-live',{action:'owner_approve',partnerId:id,approve:yes});msg('Vaahak status updated.','ok');load()}catch(e){msg(e.message,'err')}}window.approveVaahak=approveVaahak;async function approveService(memberId,yes){try{await fn('hyperlocal-service-live',{action:'owner_set_approval',memberId,approval:yes?'Approved':'Rejected'});msg('Service Partner status updated.','ok');load()}catch(e){msg(e.message,'err')}}window.approveService=approveService;async function load(){try{msg('Loading live '+tab+' records…');if(tab==='members'){const d=await ownerReport();renderMembers(d.members||[])}else if(tab==='vendors'){const d=await fn('marketplace-live',{action:'owner_list_vendors'});renderVendors(d.vendors||[])}else if(tab==='vaahak'){const d=await fn('vaahak-live',{action:'owner_list'});renderVaahak(d.partners||[])}else{const d=await fn('hyperlocal-service-live',{action:'owner_list'});renderService(d.partners||[])}msg('Live records loaded.','ok')}catch(e){if(/owner_session/.test(e.message)){localStorage.removeItem(TOKEN_KEY);token='';$('console').classList.add('hide');$('auth').classList.remove('hide')}msg(e.message,'err')}}function renderMembers(rows){$('content').innerHTML='<div class="card"><h2>Users / Members</h2><div class="note"><b>Normal Google/Facebook + successful Razorpay registrations do not require Owner approval.</b><br>Use this page only for exceptions, legacy/pending records, or Owner-created users.</div><button class="btn soft" onclick="document.getElementById(\'newMember\').classList.toggle(\'hide\')">+ Owner Create User</button><div id="newMember" class="hide">'+memberForm()+'</div>'+rows.map(r=>'<div class="row"><div><b>'+esc(r.Name)+' • '+esc(r.Member_ID)+'</b><div class="meta">'+esc(r.Membership)+' • '+esc(r.Email)+' • '+esc(r.Mobile)+'</div><span class="badge">'+esc(r.Status)+' / '+esc(r.Payment_Status)+'</span></div><div>'+(r.Status==='Active'&&r.Payment_Status==='Approved'?'<span class="badge">Active ✓</span>':'<button class="btn" onclick="approveMember(\''+esc(r.Member_ID)+'\')">Approve & Activate</button>')+'</div></div>').join('')+'</div>';bindMemberForm()}function memberForm(){return '<form id="memberForm" class="card"><h3>Owner Quick User Onboarding</h3><div class="grid"><div><label>Name</label><input name="name" required></div><div><label>Mobile</label><input name="mobile" required></div><div><label>Email</label><input name="email" type="email" required></div><div><label>Plan</label><select name="tier"><option value="guest">Guest</option><option value="promoter">Promoter</option><option value="prime">Prime</option><option value="leader">Leader</option></select></div><div><label>City</label><input name="city"></div><div><label>Upline Code</label><input name="upline"></div><div><label>Payment Amount</label><input name="paymentAmount" type="number" value="0"></div><div><label>Payment Ref</label><input name="paymentRef" placeholder="OWNER / CASH / UTR"></div><div class="full"><label>Aadhaar / KYC document</label><input name="aadhaarFile" type="file" accept="image/*,.pdf" required></div><div><label>Account Holder</label><input name="accountHolderName" required></div><div><label>Bank Account No.</label><input name="accountNumber" required></div><div><label>Confirm Account No.</label><input name="confirmAccountNumber" required></div><div><label>IFSC</label><input name="ifsc" required></div><div class="full"><button class="btn">Create Active User</button></div></div></form>'}function bindMemberForm(){const f=$('memberForm');if(!f)return;f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f);fd.append('action','owner_create');try{const r=await fetch(BASE+'/functions/v1/member-registration-live',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'x-dbest-owner-token':token},body:fd}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'User onboarding failed');msg('Owner-created user '+(d.member?.id||'')+' is Active.','ok');load()}catch(err){msg(err.message,'err')}}}function renderVendors(rows){$('content').innerHTML='<div class="card"><h2>Vendor Onboarding</h2><a class="btn soft" href="/vendor" style="display:inline-block;text-decoration:none">Open Vendor Registration</a>'+rows.map(v=>'<div class="row"><div><b>'+esc(v.name)+' • '+esc(v.id)+'</b><div class="meta">'+esc(v.type)+' • '+esc(v.email)+' • '+esc(v.mobile)+'</div><span class="badge">'+esc(v.owner_approval)+' / '+esc(v.agreement_status||'')+'</span></div><div><button class="btn" onclick="approveVendor(\''+esc(v.id)+'\',true)">Approve</button> <button class="btn danger" onclick="approveVendor(\''+esc(v.id)+'\',false)">Reject</button></div></div>').join('')+'</div>'}function renderVaahak(rows){$('content').innerHTML='<div class="card"><h2>Vaahak Onboarding</h2><a class="btn soft" href="/vaahak" style="display:inline-block;text-decoration:none">Open Vaahak Registration</a>'+rows.map(v=>'<div class="row"><div><b>'+esc(v.name)+' • '+esc(v.id)+'</b><div class="meta">'+esc(v.vehicle)+' • '+esc(v.vehicle_no||'')+' • '+esc(v.mobile)+'</div><span class="badge">'+esc(v.owner_approval)+' / '+esc(v.agreement_status||'')+'</span></div><div><button class="btn" onclick="approveVaahak(\''+esc(v.id)+'\',true)">Approve</button> <button class="btn danger" onclick="approveVaahak(\''+esc(v.id)+'\',false)">Reject</button></div></div>').join('')+'</div>'}function renderService(rows){$('content').innerHTML='<div class="card"><h2>Service Partner Onboarding</h2><div class="note">Standard onboarding remains ₹99/year via Razorpay. Owner can approve/reject the real Service Partner record here.</div><a class="btn soft" href="/service-partner-onboarding-v3.html" style="display:inline-block;text-decoration:none">Start Service Partner Onboarding</a>'+rows.map(p=>'<div class="row"><div><b>'+esc(p.name)+' • '+esc(p.service_partner_id)+'</b><div class="meta">'+esc(p.email)+' • '+esc(p.mobile)+' • '+esc((p.service_types||[]).join(', '))+'</div><span class="badge">'+esc(p.approval_status)+' / '+(p.active?'Active':'Inactive')+'</span></div><div><button class="btn" onclick="approveService(\''+esc(p.member_id)+'\',true)">Approve</button> <button class="btn danger" onclick="approveService(\''+esc(p.member_id)+'\',false)">Reject</button></div></div>').join('')+'</div>'}if(token){showConsole()}else{$('auth').classList.remove('hide')}})();</script></body></html>
