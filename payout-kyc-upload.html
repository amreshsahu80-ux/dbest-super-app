<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBest Payout KYC</title><style>body{margin:0;background:#f5f7fb;font-family:Inter,system-ui,Arial;color:#13213a}.wrap{min-height:100dvh;display:grid;place-items:center;padding:18px}.card{width:min(520px,100%);background:#fff;border:1px solid #e2e8f2;border-radius:22px;padding:22px;box-shadow:0 20px 55px #1637651f}h2{margin:0 0 8px}.sub{color:#687386;line-height:1.5}.box{margin-top:14px;padding:14px;border:1px solid #e2e8f2;border-radius:14px;background:#fafcff}.box b{display:block;margin-bottom:8px}input[type=file]{width:100%}button{width:100%;margin-top:16px;border:0;border-radius:12px;padding:13px;background:#175cff;color:#fff;font-weight:800}.soft{background:#edf3ff;color:#175cff}.msg{margin-top:12px;font-size:13px;line-height:1.5;color:#687386}.ok{color:#15803d}.err{color:#b91c1c}.badge{display:inline-block;margin-top:8px;padding:6px 9px;border-radius:999px;background:#fff7e8;color:#8a5a00;font-size:12px;font-weight:800}</style></head><body><div class="wrap"><div class="card"><h2>Payout KYC</h2><div class="sub">Your DBest membership remains active. Upload both documents below to submit your payout KYC for Owner verification.</div><div class="badge">Payout: On Hold until verification</div><div class="box"><b>1. Upload Aadhaar</b><input id="aadhaar" type="file" accept="image/*,.pdf"><div class="sub">JPG, PNG, WEBP or PDF.</div></div><div class="box"><b>2. Upload Bank Proof</b><input id="bank" type="file" accept="image/*,.pdf"><div class="sub">Cancelled cheque, passbook or bank statement.</div></div><button id="submit">Submit for Owner Verification</button><button class="soft" onclick="location.href='/'">Back to DBest</button><div id="msg" class="msg"></div></div></div><script src="/runtime-config.js"></script><script>(function(){const TOKEN_KEY='dbest_member_live_token';const token=localStorage.getItem(TOKEN_KEY)||'';const cfg=window.DBEST_RUNTIME_CONFIG||{};const base=String(cfg.supabaseUrl||'');const key=String(cfg.supabasePublishableKey||'');const msg=(t,c='')=>{const e=document.getElementById('msg');e.className='msg '+c;e.textContent=t};async function jsonCall(fn,body){const r=await fetch(base+'/functions/v1/'+fn,{method:'POST',headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json','x-dbest-member-token':token},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||'Request failed');e.status=r.status;throw e}return j}async function upload(txid,field,file){const fd=new FormData();fd.append('transaction_id',txid);fd.append('field',field);fd.append('file',file);const r=await fetch(base+'/functions/v1/service-document-live',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+key,'x-dbest-member-token':token},body:fd});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Document upload failed');return j}document.getElementById('submit').onclick=async()=>{if(!token){msg('Please login again before submitting payout KYC.','err');setTimeout(()=>location.href='/preview-member-login.html?return=%2Fpayout-kyc-upload.html',500);return}const a=document.getElementById('aadhaar').files[0],b=document.getElementById('bank').files[0];if(!a||!b)return msg('Please upload both Aadhaar and bank proof.','err');const btn=document.getElementById('submit');btn.disabled=true;msg('Creating secure KYC request…');try{const txid='KYC'+Date.now().toString(36).toUpperCase();await jsonCall('service-request-live',{action:'create',transaction:{transactionId:txid,section:'Payout KYC',subsection:'Member Payout Verification',amount:0,paymentStatus:'KYC Submitted / Payout On Hold',application:{purpose:'Payout KYC document verification'},documents:{aadhaar:{name:a.name,type:a.type,size:a.size},bank_proof:{name:b.name,type:b.type,size:b.size}}}});msg('Uploading Aadhaar securely…');await upload(txid,'aadhaar',a);msg('Uploading bank proof securely…');await upload(txid,'bank_proof',b);msg('Payout KYC submitted successfully. Your membership remains active. Payout will stay on hold until Owner verification.','ok');btn.textContent='Submitted ✓';btn.disabled=true}catch(e){msg(String(e.message||'Unable to submit KYC'),'err');btn.disabled=false}}})();</script></body></html>
