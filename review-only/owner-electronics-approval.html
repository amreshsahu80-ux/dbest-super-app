<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBest Owner — Electronics Approval Review</title><style>body{font:15px system-ui;background:#f5f7fb;color:#152844;margin:0}header{background:#143e7a;color:white;padding:18px}main{max-width:900px;margin:auto;padding:16px}button{background:#174d9b;color:white;border:0;padding:10px 14px;border-radius:8px}button:disabled{opacity:.45}article{background:white;border-radius:12px;margin:12px 0;padding:14px;display:flex;gap:12px}img{width:88px;height:88px;object-fit:contain}small{display:block;color:#657184;margin:5px 0}.warn{color:#a12727}.ok{color:#176b38}</style></head><body><header><strong>DBest Owner · Electronics Master Review</strong></header><main><p>Owner-only isolated review. Product approval is blocked until image rights and publication checks are complete. Vendor mapping after approval is automatic.</p><button id="load">Load Electronics products</button><p id="status">Sign in at <a href="/owner">Owner Console</a> on this preview domain, then return here.</p><div id="items"></div></main><script src="/runtime-config.js"></script><script>
const $=id=>document.getElementById(id);const cfg=window.DBEST_RUNTIME_CONFIG||{};
async function request(method,body){const token=sessionStorage.getItem('dbest_owner_session_token');if(!token)throw Error('Owner session missing; sign in to /owner on this preview domain');if(!cfg.supabaseUrl||!cfg.supabasePublishableKey)throw Error('Runtime configuration unavailable');const r=await fetch(cfg.supabaseUrl+'/functions/v1/owner-electronics-approval-isolated',{method,headers:{apikey:cfg.supabasePublishableKey,Authorization:'Bearer '+cfg.supabasePublishableKey,'x-dbest-owner-token':token,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){ $('status').textContent='Loading secure Owner review…';$('items').replaceChildren();try{const d=await request('GET');$('status').textContent=d.total+' Electronics products · '+d.eligible+' eligible for approval';for(const p of d.rows){const card=document.createElement('article'),img=document.createElement('img'),body=document.createElement('div'),name=document.createElement('strong'),status=document.createElement('small'),blockers=document.createElement('small'),button=document.createElement('button');name.textContent=p.name||'Product';status.textContent='Master status: '+p.status;blockers.textContent=p.blockers.length?'Checks needed: '+p.blockers.join(', '):'Publication checks complete';blockers.className=p.blockers.length?'warn':'ok';img.alt='Product image';if(p.image_url&&p.image_url.startsWith('https://'))img.src=p.image_url;button.textContent='Owner approve';button.disabled=!p.eligibleForApproval||p.status!=='draft';button.onclick=async()=>{if(!confirm('Approve this verified master product? It will automatically map to active Electronics vendors.'))return;button.disabled=true;try{await request('POST',{action:'approve_product',productId:p.id});await load()}catch(e){alert(e.message);button.disabled=false}};body.append(name,status,blockers,button);card.append(img,body);$('items').append(card)}}catch(e){$('status').textContent='Review unavailable: '+e.message}}
$('load').onclick=load;
</script></body></html>
