<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<title>Join DBest Partner Network</title>
<style>
:root{--ink:#10213d;--muted:#667085;--line:#e2e9f4;--blue:#1760ff;--violet:#735cff;--green:#0f9f79;--pink:#d84f90}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial;background:radial-gradient(circle at top right,#dfe8ff 0,transparent 34%),linear-gradient(180deg,#f8faff,#eef3fb);color:var(--ink)}
.page{min-height:100dvh;padding:16px}.shell{max-width:1120px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{width:135px;max-height:54px;object-fit:contain}.home{border:1px solid var(--line);background:#fff;border-radius:13px;padding:9px 12px;color:#29415f;font-weight:850}
.hero{margin-top:14px;border-radius:30px;padding:30px;background:linear-gradient(135deg,#0d2b63 0%,#1760ff 54%,#735cff 100%);color:#fff;box-shadow:0 28px 70px rgba(29,78,216,.22);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:#ffffff12;right:-80px;top:-90px}.eyebrow{display:inline-flex;gap:7px;align-items:center;padding:7px 10px;border:1px solid #ffffff55;background:#ffffff18;border-radius:999px;font-size:11px;font-weight:850}.hero h1{font-size:clamp(32px,7vw,58px);line-height:.98;margin:16px 0 10px;letter-spacing:-1.7px;max-width:780px}.hero p{font-size:15px;line-height:1.55;max-width:700px;color:#eef4ff}
.roleNote{margin:18px 0 10px;font-weight:900;font-size:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.role{position:relative;border-radius:24px;padding:20px;background:#fff;border:1px solid var(--line);box-shadow:0 14px 35px rgba(30,55,90,.08);overflow:hidden;transition:.2s}.role:hover{transform:translateY(-2px);box-shadow:0 20px 44px rgba(30,55,90,.12)}.role.selected{outline:3px solid #1760ff33;border-color:#8eb2ff}.role:before{content:"";position:absolute;inset:0 0 auto;height:6px;background:var(--grad)}.photo{height:210px;border-radius:18px;overflow:hidden;background:#eaf0f8}.photo img{width:100%;height:100%;object-fit:cover;display:block}.role.selected{outline:3px solid #1760ff33;border-color:#8eb2ff}.role h2{margin:14px 0 3px;font-size:24px}.role .tag{font-size:12px;color:var(--muted);font-weight:750}.cta{width:100%;border:0;border-radius:14px;padding:13px 14px;background:var(--grad);color:#fff;font-weight:900;font-size:14px;box-shadow:0 10px 22px #17376522}.vendor{--grad:linear-gradient(135deg,#0d8878,#27b69a);--soft:#e8fbf6}.vaahak{--grad:linear-gradient(135deg,#1760ff,#654bff);--soft:#edf2ff}.service{--grad:linear-gradient(135deg,#bd3e78,#ec6ca8);--soft:#fff0f7}
.miniLine{margin-top:16px;text-align:center;color:#6b778b;font-size:11px;font-weight:800;letter-spacing:.2px}.lock{display:inline-block;margin-left:8px;padding:5px 8px;border-radius:999px;background:#eef4ff;color:#175cff;font-size:9px;font-weight:900}
@media(max-width:760px){.hero{padding:22px 18px;border-radius:24px}.grid{grid-template-columns:1fr}.role{padding:15px}.photo{height:190px}.top{padding:0 2px}.logo{width:118px}}
</style></head>
<body><main class="page"><div class="shell"><div class="top"><img class="logo" src="/dbest-logo.png" alt="DBest"><button class="home" onclick="location.href='/'">← DBest Home</button></div>
<section class="hero"><span class="eyebrow">DBest Partner Network</span><h1>Join DBest.</h1><p>Vendor • Vaahak • Service Partner</p></section>
<div class="roleNote" id="roleNote">Choose how you want to partner with DBest</div>
<section class="grid">
<article class="role vendor" data-role="Vendor"><div class="photo"><img loading="eager" src="https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1200&q=86" alt="Local retail shop"></div><h2>Vendor</h2><div class="tag">More orders. More customers.</div><button class="cta" onclick="go('Vendor')">Join as Vendor →</button></article>
<article class="role vaahak" data-role="Vaahak"><div class="photo"><img loading="eager" src="https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=1200&q=86" alt="Bike rider"></div><h2>Vaahak</h2><div class="tag">Rides + Delivery</div><button class="cta" onclick="go('Vaahak')">Join as Vaahak →</button></article>
<article class="role service" data-role="Service Partner"><div class="photo"><img loading="eager" src="https://images.unsplash.com/photo-1581092580497-e0d23cbdf1dc?auto=format&fit=crop&w=1200&q=86" alt="Electrician and service technician"></div><h2>Service Partner</h2><div class="tag">Get local service bookings</div><button class="cta" onclick="go('Service Partner')">Join as Service Partner →</button></article>
</section>
<div class="miniLine">Fast onboarding • Secure verification • Go live with DBest</div></div></main>
<script>
(function(){const q=new URLSearchParams(location.search),type=String(q.get('type')||''),leader=q.get('leader_onboard')||'',ta=q.get('ta_onboard')||'',lang=q.get('lang')||localStorage.getItem('d2_lang')||'';
function pathFor(role){if(leader)return role==='Vendor'?'/vendor.html':role==='Vaahak'?'/vaahak-standalone-v2.html':'/service-partner-onboarding-v3.html';if(ta)return role==='Vendor'?'/Vendor':role==='Vaahak'?'/vaahak-ta-onboarding-wrapper.html':'/service-partner-ta-onboarding-wrapper.html';return role==='Vendor'?'/Vendor':role==='Vaahak'?'/vaahak':'/ServicePartner'}
function dest(role){const p=new URLSearchParams();if(lang)p.set('lang',lang);if(leader)p.set('leader_onboard',leader);if(ta)p.set('ta_onboard',ta);const path=pathFor(role);return path+(p.toString()?'?'+p.toString():'')}
window.go=function(role){if((leader||ta)&&type&&role!==type)return;location.href=dest(role)};
if(type&&paths[type]){document.querySelectorAll('.role').forEach(el=>{const match=el.dataset.role===type;el.style.display=match?'':'none';if(match)el.classList.add('selected')});document.getElementById('roleNote').textContent='Your DBest onboarding link is ready';document.querySelector('.grid').style.gridTemplateColumns='minmax(0,560px)';document.querySelector('.grid').style.justifyContent='center';const btn=document.querySelector('[data-role="'+type+'"] .cta');if(btn)btn.textContent='Start Secure '+type+' Onboarding →'}
})();
</script></body></html>
