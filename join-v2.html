<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><title>Join DBest</title><meta name="robots" content="noindex"><style>:root{--p:#1760ff;--p2:#735cff;--ink:#13203a;--muted:#6d7890;--line:#e2e8f2;--bg:#f5f7fb;--ok:#12834a;--danger:#a62f2f}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,Arial;color:var(--ink)}button,input{font:inherit}.page{min-height:100dvh;padding:10px}.shell{max-width:900px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 20px 60px rgba(30,55,100,.12)}.hero{padding:22px;background:linear-gradient(135deg,#12366e,#1760ff 62%,#735cff);color:#fff}.brand{display:flex;align-items:center;justify-content:space-between}.brand img{width:150px;max-height:52px;object-fit:contain}.home{border:1px solid #ffffff55;background:#ffffff15;color:#fff;border-radius:14px;padding:10px 13px;font-weight:800}.hero h1{margin:16px 0 5px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}.step{padding:8px;border:1px solid #ffffff38;border-radius:999px;text-align:center;font-size:11px;font-weight:800}.step.on{background:#fff;color:#1760ff}.body{padding:20px}.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.plan,.card{border:1px solid var(--line);border-radius:19px;padding:16px}.card{max-width:620px;margin:auto}.price,.amount{font-size:24px;font-weight:900;color:var(--p)}.muted{color:var(--muted)}.primary,.plan button,.social{width:100%;border:0;border-radius:13px;padding:13px;font-weight:900}.primary,.plan button{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;margin-top:14px}.socials{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.social{height:52px;border:1px solid #dfe5ee;background:#fff}.social.fb{background:#1877f2;color:#fff}.emailBox{margin-top:12px;padding:14px;border:1px solid #dce6ff;background:#f8fbff;border-radius:15px}.field{margin-top:12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input{width:100%;height:50px;border:1px solid #dfe5ee;border-radius:13px;padding:0 14px;font-size:16px}.note,.status,.err{margin-top:13px;padding:11px 12px;border-radius:13px;font-size:12px;line-height:1.5}.note,.status{background:#f5f7fb;color:#5d6980}.err{background:#fff1f1;color:var(--danger);border:1px solid #f0cccc}.summary{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px;border:1px solid #dce6ff;background:#eef4ff;border-radius:15px}.user{padding:12px;border:1px solid var(--line);border-radius:15px;margin-bottom:14px}.center{text-align:center}.link{border:0;background:transparent;color:var(--p);font-weight:800;padding:11px}.success{text-align:center}.tick{width:72px;height:72px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#e8f8ef;color:var(--ok);font-size:36px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.grid>div{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left}@media(max-width:760px){.plans{grid-template-columns:1fr 1fr}.socials{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}}@media(max-width:430px){.plans,.grid{grid-template-columns:1fr}}</style></head><body><div class="page"><div class="shell"><div id="app"></div></div></div><script>(()=>{'use strict';const SUPA_URL='https://ydedmotbacnllkijzmvp.supabase.co';const SUPA_KEY='sb_publishable_qWqQExdtL5ddWcK_yLCcNA__-ZUBtox';const PENDING='dbest_join_pending_v3',PROFILE='dbest_join_profile_v3';const TIERS={leader:{name:'Leader',price:999,badge:'👑'},prime:{name:'Prime',price:599,badge:'⭐'},promoter:{name:'Promoter',price:299,badge:'🚀'},guest:{name:'Guest User',price:49,badge:'✨'}};const app=document.getElementById('app');let authAccessToken='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const qs=new URLSearchParams(location.search),initialRef=String(qs.get('ref')||'').trim().toUpperCase(),initialTier=String(qs.get('tier')||'').toLowerCase(),initialProvider=String(qs.get('oauth')||'').toLowerCase();function read(k,d=null){try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch{return d}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function drop(k){localStorage.removeItem(k)}function header(title,sub,step){return `<div class="hero"><div class="brand"><img src="/dbest-logo.png"><button class="home" onclick="location.href='/'">← DBest Home</button></div><h1>${esc(title)}</h1><p>${esc(sub)}</p><div class="steps">${['Choose Plan','Verify Identity','Payment','Active'].map((x,i)=>`<div class="step ${i<=step?'on':''}">${i+1}. ${x}</div>`).join('')}</div></div>`}function render(h){app.innerHTML=h}function plans(){render(`${header('Join DBest','Choose a membership and verify securely.',0)}<div class="body"><div class="plans">${Object.entries(TIERS).map(([k,t])=>`<div class="plan"><div style="font-size:26px">${t.badge}</div><h3>${t.name}</h3><div class="price">₹${t.price}</div><small class="muted">${k==='leader'?'Build and lead your DBest network.':k==='prime'?'Enhanced benefits and earning opportunity.':k==='promoter'?'Start promoting DBest services and earning.':'Use DBest services as a registered user.'}</small><button onclick="choose('${k}')">Choose ${t.name}</button></div>`).join('')}</div></div>`)}function choose(tier,msg=''){const t=TIERS[tier];if(!t)return plans();render(`${header('Secure registration','Continue with Google, Facebook, or verify your email with OTP.',1)}<div class="body"><div class="card"><div class="summary"><div><b>${t.badge} ${t.name}</b><span class="muted">Membership selected</span></div><div class="amount">₹${t.price}</div></div><div class="socials"><button class="social" onclick="social('google','${tier}')">G &nbsp; Continue with Google</button><button class="social fb" onclick="social('facebook','${tier}')">f &nbsp; Continue with Facebook</button></div><div class="emailBox"><b>✉️ Register with Email OTP</b><div class="field"><label>Email address</label><input id="emailReg" type="email" autocomplete="email" placeholder="name@example.com"></div><button class="primary" onclick="sendEmailOtp('${tier}')">Send Email OTP</button></div><div class="note">Google/Facebook can auto-fill your name and email. Email registration verifies your email first, then asks for name and mobile. Payout bank details are completed securely after activation.</div>${msg?`<div class="err">${esc(msg)}</div>`:''}<div class="center"><button class="link" onclick="plans()">← Change plan</button></div></div></div>`)}function social(provider,tier){const ref=initialRef||read(PENDING,{})?.ref||'';write(PENDING,{provider,tier,ref,at:Date.now()});const params=new URLSearchParams({tier,oauth:provider});if(ref)params.set('ref',ref);const redirect=`${location.origin}/join-v2.html?${params.toString()}`;location.href=`${SUPA_URL}/auth/v1/authorize?provider=${encodeURIComponent(provider)}&redirect_to=${encodeURIComponent(redirect)}`}async function sendEmailOtp(tier){const email=String(document.getElementById('emailReg')?.value||'').trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(email))return choose(tier,'Enter a valid email address.');write(PENDING,{provider:'email',tier,ref:initialRef||'',email,at:Date.now()});const r=await fetch(`${SUPA_URL}/auth/v1/otp`,{method:'POST',headers:{apikey:SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,create_user:true})});const j=await r.json().catch(()=>({}));if(!r.ok)return choose(tier,j.msg||j.message||'Unable to send OTP.');emailOtpScreen(tier,email)}function emailOtpScreen(tier,email,msg=''){render(`${header('Verify your email','Enter the 6-digit OTP sent to your email.',1)}<div class="body"><div class="card"><div class="field"><label>Email</label><input value="${esc(email)}" disabled></div><div class="field"><label>6-digit OTP</label><input id="emailOtp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="Enter OTP"></div><button class="primary" onclick="verifyEmailOtp('${tier}','${esc(email)}')">Verify Email</button><button class="link" onclick="sendEmailOtp('${tier}')">Resend OTP</button>${msg?`<div class="err">${esc(msg)}</div>`:''}</div></div>`)}async function verifyEmailOtp(tier,email){const token=String(document.getElementById('emailOtp')?.value||'').replace(/\D/g,'');if(!/^\d{6}$/.test(token))return emailOtpScreen(tier,email,'Enter the 6-digit OTP.');const r=await fetch(`${SUPA_URL}/auth/v1/verify`,{method:'POST',headers:{apikey:SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({type:'email',email,token})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.access_token)return emailOtpScreen(tier,email,j.msg||j.message||'OTP verification failed.');authAccessToken=String(j.access_token);const u=j.user||{};detail(tier,{id:String(u.id||''),email:String(u.email||email),name:'',avatar:'',provider:'email'},true)}async function socialUser(token){const r=await fetch(`${SUPA_URL}/auth/v1/user`,{headers:{apikey:SUPA_KEY,Authorization:`Bearer ${token}`}}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.message||'Unable to read profile');const md=j.user_metadata||{},am=j.app_metadata||{};return{id:String(j.id||''),email:String(j.email||''),name:String(md.full_name||md.name||j.email||'DBest User'),avatar:String(md.avatar_url||md.picture||''),provider:String(am.provider||'')}}function detail(tier,p,emailMode=false){const t=TIERS[tier],ref=read(PENDING,{})?.ref||initialRef;write(PROFILE,p);render(`${header('Almost done',emailMode?'Add your name and mobile number.':'We filled what we could. Add your mobile number.',1)}<div class="body"><div class="card"><div class="user"><b>${esc(p.email)}</b><div class="muted">${esc(p.provider||'Verified login')}</div></div><form onsubmit="pay(event,'${tier}')">${emailMode?`<div class="field"><label>Full name</label><input name="name" autocomplete="name" required placeholder="Your full name"></div>`:''}<div class="field"><label>Mobile number</label><input name="mobile" inputmode="numeric" maxlength="10" autocomplete="tel" required placeholder="10-digit mobile number"></div><div class="field"><label>Referral code <span class="muted">(optional)</span></label><input name="referral" value="${esc(ref)}" style="text-transform:uppercase"></div><div class="summary" style="margin-top:14px"><div><b>${t.badge} ${t.name}</b><span class="muted">Razorpay secure payment</span></div><div class="amount">₹${t.price}</div></div><div id="gatewayStatus" class="status">Checking Razorpay…</div><button class="primary" type="submit">Pay ₹${t.price} & Activate</button><div class="note">After activation, complete payout KYC/bank setup from My Wallet before requesting payouts.</div></form></div></div>`);checkGateway()}async function checkGateway(){const el=document.getElementById('gatewayStatus');if(!el)return;try{const r=await fetch('/api/razorpay/config',{cache:'no-store'}),j=await r.json();el.textContent=j.configured&&j.persistenceConfigured?`Razorpay ready • ${String(j.mode||'').toUpperCase()} mode • Central records ready`:'Razorpay setup incomplete';}catch{el.textContent='Unable to verify Razorpay configuration.'}}let checkoutPromise=null;function loadCheckout(){if(window.Razorpay)return Promise.resolve();if(checkoutPromise)return checkoutPromise;checkoutPromise=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://checkout.razorpay.com/v1/checkout.js';s.onload=ok;s.onerror=()=>no(Error('Unable to load Razorpay Checkout'));document.head.appendChild(s)});return checkoutPromise}async function jfetch(url,opts={}){const r=await fetch(url,opts),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||j.message||`HTTP ${r.status}`);return j}async function checkout(order,prefill,meta){await loadCheckout();return new Promise((resolve,reject)=>{let done=false;const finish=(fn,v)=>{if(done)return;done=true;fn(v)};const rz=new Razorpay({key:order.keyId,amount:order.amount,currency:order.currency||'INR',name:'DBest',description:'DBest Membership',order_id:order.orderId,prefill,handler:async r=>{try{finish(resolve,await jfetch('/api/razorpay/verify-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...r,...meta})}))}catch(e){finish(reject,e)}},modal:{ondismiss:()=>finish(reject,Error('Payment cancelled'))}});rz.on('payment.failed',r=>finish(reject,Error(r?.error?.description||'Payment failed')));rz.open()})}async function pay(e,tier){e.preventDefault();const p=read(PROFILE,null),t=TIERS[tier];if(!p?.email||!p?.id||!authAccessToken)return choose(tier,'Please verify your login again before payment.');const fd=new FormData(e.target),mobile=String(fd.get('mobile')||'').replace(/\D/g,''),ref=String(fd.get('referral')||'').trim().toUpperCase(),enteredName=String(fd.get('name')||'').trim(),name=enteredName||p.name||p.email;if(!/^\d{10}$/.test(mobile))return alert('Enter a valid 10-digit mobile number');if(enteredName){await fetch(`${SUPA_URL}/auth/v1/user`,{method:'PUT',headers:{apikey:SUPA_KEY,Authorization:`Bearer ${authAccessToken}`,'Content-Type':'application/json'},body:JSON.stringify({data:{full_name:enteredName}})}).catch(()=>{})}const btn=e.target.querySelector('button[type="submit"]');btn.disabled=true;btn.textContent='Opening Razorpay…';try{const dbestRef='JOIN_'+Date.now().toString(36).toUpperCase();const order=await jfetch('/api/razorpay/create-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'membership',tier,dbestRef,section:'Membership',sub:t.name,userId:p.id,supabaseAccessToken:authAccessToken})});const v=await checkout(order,{name,email:p.email,contact:mobile},{dbestRef,kind:'membership',tier,socialUserId:p.id,socialProvider:p.provider||'',supabaseAccessToken:authAccessToken,mobile,referral:ref,name});if(!v.verified||!v.persisted||!v.memberId)throw Error('Payment verified but membership creation did not complete.');drop(PENDING);drop(PROFILE);render(`${header('Welcome to DBest','Payment verified and membership activated.',3)}<div class="body"><div class="card success"><div class="tick">✓</div><h2>Registration successful</h2><div class="grid"><div><small>Member ID</small><b>${esc(v.memberId)}</b></div><div><small>Membership</small><b>${esc(t.name)}</b></div></div><div class="note">Your payout profile starts as incomplete. Complete payout KYC/bank setup from My Wallet before requesting payouts.</div><button class="primary" onclick="location.href='/'">Open DBest</button></div></div>`)}catch(err){alert(err.message||'Payment failed');btn.disabled=false;btn.textContent=`Pay ₹${t.price} & Activate`}}async function boot(){const h=new URLSearchParams(location.hash.replace(/^#/,'')),token=h.get('access_token');if(token){authAccessToken=token;history.replaceState(null,'',location.pathname+location.search);const pending=read(PENDING,{})||{},tier=pending.tier||initialTier;try{const p=await socialUser(token);write(PROFILE,p);detail(tier,p,false)}catch(e){choose(tier,e.message)}return}if(initialProvider&&initialTier){const pending=read(PENDING,{})||{};if(pending.tier===initialTier)return render(`${header('Completing secure login','Returning from ${initialProvider}…',1)}<div class="body"><div class="card"><div class="status">Waiting for secure login response…</div></div></div>`)}plans()}window.plans=plans;window.choose=choose;window.social=social;window.sendEmailOtp=sendEmailOtp;window.verifyEmailOtp=verifyEmailOtp;window.pay=pay;boot()})();</script></body></html>
