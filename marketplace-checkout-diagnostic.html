<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBest Marketplace Checkout Diagnostic</title><style>body{margin:0;background:#f5f7fb;font-family:Inter,system-ui,Arial;color:#13213a}.wrap{padding:18px;max-width:560px;margin:auto}.card{background:#fff;border:1px solid #e2e8f2;border-radius:20px;padding:18px;box-shadow:0 14px 40px #16376518}.row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid #edf1f6}.row:last-child{border:0}.k{font-weight:700}.v{font-weight:800;text-align:right}.ok{color:#15803d}.bad{color:#b91c1c}.wait{color:#9a6700}.btn{width:100%;margin-top:14px;border:0;border-radius:12px;padding:12px;background:#175cff;color:#fff;font-weight:800}.note{font-size:13px;color:#687386;line-height:1.5;margin-top:12px}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;z-index:20;display:none}.close{position:fixed;z-index:30;right:12px;top:12px;border:0;border-radius:999px;padding:9px 12px;background:#13213a;color:#fff;font-weight:800;display:none}</style></head><body><div class="wrap"><div class="card"><h2 style="margin:0 0 8px">DBest Checkout Diagnostic</h2><p class="note" style="margin-top:0">This page checks the Preview checkout without using the frozen Cart button.</p><div id="rows"><div class="row"><span class="k">Status</span><span class="v wait" id="status">Loading app modules…</span></div></div><button id="open" class="btn" style="display:none">Open Verified Checkout Screen</button><button id="retry" class="btn" style="background:#edf3ff;color:#175cff">Run Diagnostic Again</button><p class="note">No payment is started by this diagnostic. If the checkout form is created successfully, you can open it and continue testing from there.</p></div></div><button id="close" class="close">Close Test Screen</button><iframe id="app" src="/?diagFrame=1&v=20260911-marketplace-diagnostic-v1"></iframe><script>const $=id=>document.getElementById(id);const app=$('app');let frameStarted=false;function row(k,v,ok){const d=document.createElement('div');d.className='row';d.innerHTML='<span class="k"></span><span class="v"></span>';d.children[0].textContent=k;d.children[1].textContent=v;d.children[1].classList.add(ok===true?'ok':ok===false?'bad':'wait');$('rows').appendChild(d)}function clean(){[...$('rows').querySelectorAll('.row')].slice(1).forEach(x=>x.remove());$('open').style.display='none'}async function run(){clean();$('status').textContent='Checking…';$('status').className='v wait';app.style.display='none';$('close').style.display='none';if(!frameStarted){frameStarted=true;app.src='/?diagFrame=1&v=20260911-marketplace-diagnostic-v1&t='+Date.now();}const start=Date.now();let w=null;while(Date.now()-start<12000){try{w=app.contentWindow;if(w?.DBEST_PERFORMANCE_BOOTSTRAP){await w.DBEST_PERFORMANCE_BOOTSTRAP.startFeatures?.();if(w.DBEST_MASTER_MARKET||w.DBEST_MASTER_RAZORPAY)break}}catch(_){}await new Promise(r=>setTimeout(r,250))}try{w=app.contentWindow;const boot=!!w.DBEST_PERFORMANCE_BOOTSTRAP;const master=!!w.DBEST_MASTER_MARKET;const rz=!!w.DBEST_MASTER_RAZORPAY;const final=!!w.DBEST_FINAL_MARKET_CHECKOUT;let token=false;try{token=!!w.DBEST_MEMBER_LIVE?.getToken?.()}catch(_){}let count=-1;try{count=Number(w.DBEST_MASTER_MARKET?.count?.())}catch(_){}row('App bootstrap',boot?'Loaded':'Missing',boot);row('Master Cart module',master?'Loaded':'Missing',master);row('Razorpay module',rz?'Loaded':'Missing',rz);row('Final checkout renderer',final?'Loaded':'Missing',final);row('Secure member session',token?'Present':'Missing',token);row('Cart items detected',count>=0?String(count):'Unavailable',count>0);let rendered=false,err='';if(final&&count>0){try{w.DBEST_FINAL_MARKET_CHECKOUT.checkout();await new Promise(r=>setTimeout(r,250));rendered=!!w.document.getElementById('dbestFinalRazorpayForm');if(!rendered)err='Checkout form was not created.'}catch(e){err=String(e?.message||e)}}row('Checkout form',rendered?'CREATED ✓':(err||'Not created'),rendered);if(rendered){$('status').textContent='PASS — checkout renderer works';$('status').className='v ok';$('open').style.display='block'}else{$('status').textContent='FAIL — screenshot this page';$('status').className='v bad'}}catch(e){row('Diagnostic error',String(e?.message||e),false);$('status').textContent='FAIL — screenshot this page';$('status').className='v bad'}}app.addEventListener('load',()=>{if(frameStarted)setTimeout(run,600)},{once:false});$('retry').onclick=()=>{frameStarted=true;app.src='/?diagFrame=1&v=20260911-marketplace-diagnostic-v1&t='+Date.now();setTimeout(run,900)};$('open').onclick=()=>{app.style.display='block';$('close').style.display='block'};$('close').onclick=()=>{app.style.display='none';$('close').style.display='none'};frameStarted=true;setTimeout(run,1000);</script></body></html>
