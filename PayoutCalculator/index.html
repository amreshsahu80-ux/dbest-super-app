function roles(){let lv=$('level').value||'guest',rv=$('rideRole').value||'guest';$('level').innerHTML=order.map(r=>`<option value="${r}">${T().roles[r]}</option>`).join('');$('rideRole').innerHTML=order.map(r=>`<option value="${r}">${T().roles[r]}</option>`).join('');$('level').value=lv;$('rideRole').value=rv}function vehicles(){let v=$('vehicle').value||'cab';$('vehicle').innerHTML=Object.keys(fees).map(k=>`<option value="${k}">${T().vehicles[k]}</option>`).join('');$('vehicle').value=v}function categories(){let l=$('level').value||'guest',old=$('category').value,g=DBEST_PAYOUT_RULES[l];$('category').innerHTML=cats[l].map(k=>`<option value="${k}">${T().services[k]||g[k].label}</option>`).join('');if(old&&cats[l].includes(old))$('category').value=old;$('uplineWrap').classList.toggle('hide',l==='leader');if(l==='leader')$('uplineCount').value='0';leader()}function leader(){let l=$('level').value,c=$('category').value,r=DBEST_PAYOUT_RULES[l]&&DBEST_PAYOUT_RULES[l][c],w=$('leaderRateWrap'),i=$('leaderRate');if(r&&r.directMin!=null){w.classList.remove('hide');i.min=r.directMin;i.max=r.directMax;if(!i.value)i.value=r.directMin}else w.classList.add('hide')}
function regular(){let l=$('level').value,c=$('category').value,b=Math.max(0,+$('base').value||0),r=DBEST_PAYOUT_RULES[l][c],dr=+r.direct;if(!Number.isFinite(dr)&&r.directMin!=null)dr=Math.min(+r.directMax,Math.max(+r.directMin,+$('leaderRate').value||+r.directMin));let d=b*dr/100,rr=[];if(l!=='leader'){if(c==='marketplace')rr=[1,1,1];else if(l==='guest')rr=[+r.upline||0,+r.upline||0,+r.upline||0];else{let h=DBEST_PAYOUT_RULES[l].hierarchy||{};rr=[+(h.immediate??3),+(h.next??1),+(h.third??.5)]}}let n=Math.min(rr.length,+$('uplineCount').value||0),u=0,rows=`<div class="row"><span>${T().directPayout} (${dr}%)</span><b>${money(d)}</b></div>`;for(let i=0;i<n;i++){let a=b*rr[i]/100;u+=a;rows+=`<div class="row"><span>${T().uplineLevel}${i+1} (${rr[i]}%)</span><b>${money(a)}</b></div>`}$('directOut').textContent=money(d);$('uplineOut').textContent=money(u);$('totalOut').textContent=money(d+u);$('regularRows').innerHTML=rows;$('sameLevelNote').textContent=T().sameLevel;$('regularNote').textContent=T().regularNote;$('regularResult').classList.add('show')}
function hchecks(){let role=$('rideRole').value||'guest',eligible=order.slice(order.indexOf(role));$('hierarchyChecks').innerHTML=eligible.map((r,i)=>`<label class="check"><input type="checkbox" data-role="${r}" ${i===0?'checked disabled':'checked'}><span>${T().roles[r]} — ${rates[r]}%</span></label>`).join('');$('hierarchyChecks').querySelectorAll('input').forEach(x=>x.onchange=vaahak)}function vaahak(){let fee=fees[$('vehicle').value]||0,role=$('rideRole').value||'guest',ok=$('completed').checked&&$('selfRide').checked&&$('firstRide').checked,active=order.slice(order.indexOf(role)),sel={};$('hierarchyChecks').querySelectorAll('input').forEach(x=>sel[x.dataset.role]=x.checked);let al=0,body='';order.forEach(r=>{let p=fee*rates[r]/100,a=0,s='';if(!ok)s=T().notEligible;else if(!active.includes(r))s=T().notChain;else if(sel[r]){a=p;al+=a;s=T().payout}else s=T().retained;body+=`<tr><td>${T().roles[r]}</td><td>${rates[r]}%</td><td>${money(a)}</td><td>${s}</td></tr>`});$('feeOut').textContent=money(fee);$('hierOut').textContent=money(ok?al:0);$('dbestOut').textContent=ok?money(Math.max(0,fee-al)):'—';$('allocationRows').innerHTML=body;$('eligibilityBox').innerHTML=ok?`<div class="success">${T().qualifies}</div>`:`<div class="warn">${T().notQualifies}</div>`;$('vaahakResult').classList.add('show')}
function apply(){document.documentElement.lang=lang;$('langSelect').value=lang;let x=T();[['title','title'],['subtitle','subtitle'],['tabRegular','regular'],['tabVaahak','vaahak'],['rMemberLabel','member'],['rCategoryLabel','service'],['rBaseLabel','base'],['rUplineLabel','uplines'],['rLeaderLabel','leaderRate'],['regularCalc','calc'],['directLbl','direct'],['uplineLbl','uplineTotal'],['totalLbl','total'],['freedomMsg','freedom'],['vVehicleLabel','vehicle'],['vRoleLabel','bookingMember'],['eligibilityTitle','eligibility'],['completedTxt','completed'],['selfTxt','self'],['firstTxt','first'],['hierarchyTitle','hierarchy'],['vaahakCalc','calcV'],['dailyFeeLbl','dailyFee'],['hierPayoutLbl','hierPayout'],['dbestLbl','dbest'],['thRole','role'],['thRate','rate'],['thAmt','amount'],['thStatus','status'],['vaahakNote','vnote']].forEach(a=>$(a[0]).textContent=x[a[1]]);$('important').innerHTML=x.important;roles();vehicles();categories();hchecks();regular();vaahak()}$('langSelect').onchange=e=>{lang=e.target.value;localStorage.setItem('dbest_payout_lang',lang);apply()};$('level').onchange=()=>{categories();regular()};$('category').onchange=()=>{leader();regular()};$('base').oninput=regular;$('uplineCount').onchange=regular;$('leaderRate').oninput=regular;$('regularCalc').onclick=regular;$('rideRole').onchange=()=>{hchecks();vaahak()};$('vehicle').onchange=vaahak;['completed','selfRide','firstRide'].forEach(id=>$(id).onchange=vaahak);$('vaahakCalc').onclick=vaahak;apply();
