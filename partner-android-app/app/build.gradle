plugins { id 'com.android.application' }

android {
    namespace 'com.dbest4u.partner'
    compileSdk 36
    defaultConfig {
        applicationId 'com.dbest4u.partner'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.core:core:1.17.0'
}
