let verifiedEmail='',accessToken='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function sendOtp(){const email=String(document.getElementById('email').value||'').trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(email))return msg(t.invalidEmail,'err');const b=document.getElementById('send');b.disabled=true;msg(t.send+'…');try{const r=await client.auth.signInWithOtp({email:email,options:{shouldCreateUser:true}});if(r.error)throw r.error;verifiedEmail=email;otpScreen()}catch(e){msg(String(e.message||t.invalidEmail),'err');b.disabled=false}}
function otpScreen(){app.innerHTML='<div class="field"><label>'+t.email+'</label><input value="'+esc(verifiedEmail)+'" disabled></div><div class="field"><label>'+t.otp+'</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="'+t.otp+'"></div><button class="btn" id="verify">'+t.verify+'</button><button class="btn soft" onclick="location.reload()">'+t.again+'</button><div id="msg" class="msg"></div>';document.getElementById('verify').onclick=verifyOtp}
async function verifyOtp(){const token=String(document.getElementById('otp').value||'').replace(/\D/g,'').slice(0,6);if(!/^\d{6}$/.test(token))return msg(t.invalidOtp,'err');msg(t.verify+'…');try{const r=await client.auth.verifyOtp({email:verifiedEmail,token:token,type:'email'});if(r.error||!r.data.session||!r.data.session.access_token)throw r.error||new Error('OTP verification failed');accessToken=r.data.session.access_token;details()}catch(e){msg(String(e.message||t.invalidOtp),'err')}}
function details(){app.innerHTML='<div class="field"><label>'+t.name+'</label><input id="name" autocomplete="name" required></div><div class="field"><label>'+t.mobile+'</label><input id="mobile" inputmode="numeric" maxlength="10" autocomplete="tel"></div><div class="field"><label>'+t.city+'</label><input id="city" autocomplete="address-level2"></div><div class="field"><label>'+t.ref+'</label><input id="ref" value="'+esc(initialRef)+'" style="text-transform:uppercase"><div class="refnote">'+t.refopt+'</div></div><button class="btn" id="activate">'+t.activate+'</button><div class="note">'+t.nokyc+'</div><div id="msg" class="msg"></div>';document.getElementById('activate').onclick=activate}
async function activate(){const name=String(document.getElementById('name').value||'').trim(),mobile=String(document.getElementById('mobile').value||'').replace(/\D/g,''),city=String(document.getElementById('city').value||'').trim(),upline=String(document.getElementById('ref').value||'').trim().toUpperCase();if(name.length<2)return msg(t.invalidName,'err');if(!/^\d{10}$/.test(mobile))return msg(t.invalidMobile,'err');const b=document.getElementById('activate');b.disabled=true;msg(t.activating);try{const r=await fetch(BASE+'/functions/v1/member-registration-live',{method:'POST',cache:'no-store',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({action:'register',tier:'starter',name:name,email:verifiedEmail,mobile:mobile,city:city,upline:upline,paymentAmount:0,accessToken:accessToken})});const d=await r.json().catch(()=>({}));if(!r.ok){if(d.error==='upline_not_found')throw new Error('Referral code not found or not active.');if(d.error==='starter_cannot_be_referrer')throw new Error('Starter members cannot be referral uplines.');throw new Error(d.error||'Starter registration failed')}app.innerHTML='<div class="success"><div class="tick">✓</div><h2>'+t.success+'</h2><div>'+t.memberid+'</div><div class="id">'+esc(d.member&&d.member.id||'')+'</div><div class="note" style="text-align:left"><b>'+t.membership+':</b> Starter • FREE<br><b>'+t.kyc+':</b> Not Required<br><b>'+t.financial+':</b> Not Available<br><b>'+t.ref+':</b> '+esc(upline||'—')+'<br><b>'+t.upgrade+':</b> Guest / Promoter / Prime / Leader</div><button class="btn" onclick="location.href=\'/preview-member-login-v2.html?return=%2F&lang='+encodeURIComponent(lang)+'\'">'+t.login+'</button></div>'}catch(e){msg(String(e.message||'Starter registration failed.'),'err');b.disabled=false}}
start();
})();
</script>
