<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>DBest Starter</title>
<style>
:root{--p:#1760ff;--p2:#735cff;--ink:#13203a;--muted:#667085;--line:#e4e9f3;--ok:#16834d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(180deg,#f6f9ff,#edf3fb);color:var(--ink)}
.wrap{min-height:100dvh;display:grid;place-items:center;padding:16px}.card{width:min(560px,100%);background:#fff;border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 24px 65px #17376520}
.hero{padding:24px;background:linear-gradient(135deg,#10316f,#1760ff 60%,#735cff);color:#fff}.brand{display:flex;justify-content:space-between;align-items:center}.brand img{width:120px;background:#fff;border-radius:12px;padding:5px}.home{border:1px solid #ffffff55;background:#ffffff18;color:#fff;border-radius:11px;padding:8px 10px;font-weight:800}.hero h1{margin:18px 0 6px;font-size:30px}.hero p{margin:0;opacity:.9}.free{display:inline-block;margin-top:14px;padding:8px 12px;border-radius:999px;background:#e9fff1;color:#157042;font-weight:900}
.body{padding:22px}.benefits{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}.benefit{padding:11px;border-radius:14px;background:#f7f9fd;border:1px solid #e5eaf2;font-size:13px;font-weight:750}.field{margin-top:12px}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:6px;color:#48556e}.field input{width:100%;height:50px;border:1px solid #dfe5ef;border-radius:13px;padding:0 13px;font-size:16px}.btn{width:100%;border:0;border-radius:13px;padding:13px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:900;margin-top:14px}.soft{background:#eef4ff;color:#175cff}.msg{margin-top:12px;font-size:13px;line-height:1.45}.ok{color:var(--ok)}.err{color:#b42318}.note{margin-top:14px;padding:12px;border-radius:13px;background:#fff8e8;border:1px solid #f0dda8;font-size:12px;line-height:1.5;color:#685825}.success{text-align:center}.tick{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:#e9faef;color:#16834d;font-size:36px;margin:auto}.id{font-size:27px;font-weight:950;color:#175cff;margin:12px 0}
@media(max-width:480px){.benefits{grid-template-columns:1fr}.hero{padding:20px}.body{padding:17px}}
</style></head><body><div class="wrap"><div class="card"><div class="hero"><div class="brand"><img src="/dbest-logo.png" alt="DBest"><button class="home" onclick="location.href='/'">← Home</button></div><h1>🌱 DBest Starter</h1><p>Join free and access DBest services at attractive platform rates.</p><span class="free">FREE • NO KYC • NO MEMBERSHIP FEE</span></div><div class="body" id="app"></div></div></div>
<script src="/runtime-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>(function(){'use strict';
const cfg=window.DBEST_RUNTIME_CONFIG||{},BASE=String(cfg.supabaseUrl||'').replace(/\/$/,''),KEY=String(cfg.supabasePublishableKey||''),client=window.supabase.createClient(BASE,KEY,{auth:{persistSession:false,autoRefreshToken:false}}),app=document.getElementById('app');
let verifiedEmail='',accessToken='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(t,c=''){const e=document.getElementById('msg');if(e){e.className='msg '+c;e.textContent=t}}
function start(){app.innerHTML='<div class="benefits"><div class="benefit">✓ DBest platform rates</div><div class="benefit">✓ All customer services</div><div class="benefit">✓ No KYC required</div><div class="benefit">✓ Upgrade anytime</div></div><div class="field"><label>Email ID</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"></div><button class="btn" id="send">Send Email OTP</button><div class="note"><b>Starter has no wallet, cashback, referral income or payouts.</b><br>Wallet and eligible earning benefits begin from Guest membership and above.</div><div id="msg" class="msg"></div>';document.getElementById('send').onclick=sendOtp}
async function sendOtp(){const email=String(document.getElementById('email').value||'').trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(email))return msg('Enter a valid email ID.','err');const b=document.getElementById('send');b.disabled=true;msg('Sending OTP…');try{const {error}=await client.auth.signInWithOtp({email,options:{shouldCreateUser:true}});if(error)throw error;verifiedEmail=email;otpScreen()}catch(e){msg(String(e.message||'Could not send OTP.'),'err');b.disabled=false}}
function otpScreen(){app.innerHTML='<div class="field"><label>Email</label><input value="'+esc(verifiedEmail)+'" disabled></div><div class="field"><label>6-digit OTP</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="Enter OTP"></div><button class="btn" id="verify">Verify Email</button><button class="btn soft" onclick="location.reload()">Start Again</button><div id="msg" class="msg"></div>';document.getElementById('verify').onclick=verifyOtp}
async function verifyOtp(){const token=String(document.getElementById('otp').value||'').replace(/\D/g,'').slice(0,6);if(!/^\d{6}$/.test(token))return msg('Enter the 6-digit OTP.','err');msg('Verifying…');try{const {data,error}=await client.auth.verifyOtp({email:verifiedEmail,token,type:'email'});if(error||!data.session?.access_token)throw error||new Error('OTP verification failed');accessToken=data.session.access_token;details()}catch(e){msg(String(e.message||'OTP verification failed.'),'err')}}
function details(){app.innerHTML='<div class="field"><label>Full Name</label><input id="name" autocomplete="name" required></div><div class="field"><label>Mobile Number</label><input id="mobile" inputmode="numeric" maxlength="10" autocomplete="tel"></div><div class="field"><label>City</label><input id="city" autocomplete="address-level2"></div><button class="btn" id="activate">Activate Free Starter</button><div class="note">No Aadhaar, PAN, bank details or payment are required for Starter.</div><div id="msg" class="msg"></div>';document.getElementById('activate').onclick=activate}
async function activate(){const name=String(document.getElementById('name').value||'').trim(),mobile=String(document.getElementById('mobile').value||'').replace(/\D/g,''),city=String(document.getElementById('city').value||'').trim();if(name.length<2)return msg('Enter your full name.','err');if(!/^\d{10}$/.test(mobile))return msg('Enter a valid 10-digit mobile number.','err');const b=document.getElementById('activate');b.disabled=true;msg('Activating Starter…');try{const r=await fetch(BASE+'/functions/v1/member-registration-live',{method:'POST',cache:'no-store',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({action:'register',tier:'starter',name,email:verifiedEmail,mobile,city,paymentAmount:0,accessToken})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Starter registration failed');app.innerHTML='<div class="success"><div class="tick">✓</div><h2>Starter Activated</h2><div>Your DBest Member ID</div><div class="id">'+esc(d.member?.id||'')+'</div><div class="note" style="text-align:left"><b>Membership:</b> Starter • FREE<br><b>KYC:</b> Not Required<br><b>Wallet / Cashback / Payout:</b> Not Available<br><b>Upgrade:</b> Guest or above anytime</div><button class="btn" onclick="location.href=\'/preview-member-login-v2.html?return=%2F\'">Login to DBest</button></div>'}catch(e){msg(String(e.message||'Starter registration failed.'),'err');b.disabled=false}}
start()})();</script></body></html>
